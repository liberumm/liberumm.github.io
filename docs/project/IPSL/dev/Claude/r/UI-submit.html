<!DOCTYPE html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="店舗データの店舗確定・本部確定・データ連携を管理する画面" />
  <title>店舗データ確定・連携管理</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <style>

    table[aria-label="店舗データ一覧"] th:not(:last-child),

    table[aria-label="操作対象データと処理設定"] th:not(:last-child),
    table[aria-label="操作対象データと処理設定"] td:not(:last-child) { border-right: 1px solid var(--table-grid, #d6dbe1); }
    table[aria-label="店舗データ一覧"] th,
    table[aria-label="店舗データ一覧"] td,
    table[aria-label="操作対象データと処理設定"] th,
    table[aria-label="操作対象データと処理設定"] td { border-bottom: 1px solid var(--table-grid, #d6dbe1) !important; }
    table[aria-label="店舗データ一覧"] tbody tr:last-child td,
    table[aria-label="操作対象データと処理設定"] tbody tr:last-child td { border-bottom: 0 !important; }
    section[aria-label="表示条件"] { background-color: var(--panel-filter-bg, #fff); border-left: var(--panel-accent-width, 0) solid var(--panel-filter-accent, transparent); }
    section[aria-label="対象データ"] { background-color: var(--panel-target-bg, #fff); border-left: var(--panel-accent-width, 0) solid var(--panel-target-accent, transparent); }

    section[aria-label="表示条件"],
    section[aria-label="対象データ"],
    section[aria-label="進捗状況"],
    section[aria-label="店舗一覧"] { box-shadow: var(--panel-shadow, none); }
    section[aria-label="店舗一覧"] div:has(> article) { gap: 6px; }
    #boot-status { padding: 24px; color: #52606d; font: 14px/1.5 "Roboto", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
  </style>
</head>
<body>
  <div id="root"><div id="boot-status">Loading application...</div></div>
  <noscript>このアプリケーションにはJavaScriptが必要です。</noscript>
  <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
  <script id="app-source" type="text/plain">
    const { useEffect, useMemo, useRef, useState } = React;
    const {
      Alert, AppBar, Autocomplete, Box, Button, Checkbox, Chip, Container, CssBaseline,
      Dialog, DialogActions, DialogContent, DialogTitle, FormControl, IconButton,
      InputLabel, List, ListItemButton, MenuItem, Paper, Select, Snackbar, Stack,
      SvgIcon, Switch, Table, TableBody, TableCell, TableContainer, TableHead, TableRow, TableSortLabel,
      TextField, ThemeProvider, Toolbar, Tooltip, Typography, createTheme,
    } = MaterialUI;

    const LOCAL_TODAY = (() => {
      const now = new Date();
      const pad = (value) => String(value).padStart(2, "0");
      const year = String(now.getFullYear());
      const month = pad(now.getMonth() + 1);
      const day = pad(now.getDate());
      const slashDate = `${year}/${month}/${day}`;
      return { year, month: String(Number(month)), date: `${year}-${month}-${day}`, slashDate, compactDate: `${year}${month}${day}`, period: `${year}-${month}`, dateTime: `${slashDate} ${pad(now.getHours())}:${pad(now.getMinutes())}` };
    })();
    const APP_CONFIG = {
      name: "店舗データ確定・連携管理",
      version: "3.3.10-material2-default",
      defaultPeriod: LOCAL_TODAY.period,
      demoCurrentAt: new URLSearchParams(window.location.search).get("demoNow") || LOCAL_TODAY.dateTime,
      api: {
        mode: new URLSearchParams(window.location.search).get("api") === "real" ? "real" : "mock",
        baseUrl: new URLSearchParams(window.location.search).get("apiBase") || "http://localhost:3000/api",
        timeoutMs: 10000,
        mockLatencyMs: 180,
        mockIntegrationMs: 700,
        mockStorageKey: "store-data-confirmation-api-mock-v3",
      },
    };

    const CONFIRMATION_STATUS = {
      draft: { label: "未確定", color: "var(--status-draft, #6b7280)" },
      storeConfirmed: { label: "店舗確定", color: "var(--status-store, #2563eb)" },
      hqConfirmed: { label: "本部確定", color: "var(--status-hq, #15803d)" },
    };
    const INTEGRATION_STATUS = {
      notStarted: { label: "未連携", color: "var(--status-draft, #6b7280)" },
      processing: { label: "連携中", color: "var(--status-processing, #b45309)" },
      succeeded: { label: "連携済", color: "var(--status-integration, #15803d)" },
      failed: { label: "連携失敗", color: "var(--status-failed, #b91c1c)" },
    };
    const SUMMARY_STAGES = {
      draft: { label: "未確定", color: CONFIRMATION_STATUS.draft.color },
      storeConfirmed: { label: "店舗確定・本部未確定", color: CONFIRMATION_STATUS.storeConfirmed.color },
      hqConfirmed: { label: "本部確定（完了）", color: CONFIRMATION_STATUS.hqConfirmed.color },
      integrationSucceeded: { label: "連携済み", color: INTEGRATION_STATUS.succeeded.color },
    };
    const DATA_TYPES = {
      stocktake: {
        label: "棚卸",
        fields: [
          { key: "bookInventory", label: "帳簿在庫", unit: "円" },
          { key: "countedInventory", label: "実地在庫", unit: "円" },
          { key: "inventoryVariance", label: "在庫差異", unit: "円" },
        ],
      },
      order: {
        label: "発注",
        fields: [
          { key: "orderAmount", label: "発注金額", unit: "円" },
          { key: "orderLines", label: "発注明細", unit: "件" },
          { key: "deliveryCount", label: "納品予定", unit: "件" },
        ],
      },
      returns: {
        label: "返品",
        fields: [
          { key: "returnAmount", label: "返品金額", unit: "円" },
          { key: "returnLines", label: "返品明細", unit: "件" },
          { key: "returnQuantity", label: "返品数量", unit: "点" },
        ],
      },
    };
    function buildTargetDatasets(referenceDate = LOCAL_TODAY.date) {
      const match = String(referenceDate).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const [, year, month, day] = match || [null, LOCAL_TODAY.year, String(LOCAL_TODAY.month).padStart(2, "0"), LOCAL_TODAY.date.slice(8, 10)];
      const compactDate = `${year}${month}${day}`;
      const slashDate = `${year}/${month}/${day}`;
      const period = `${year}-${month}`;
      return [
        { id: `dataset-${compactDate}-stocktake-household-1100`, dataNumber: `D-${compactDate}-002`, dataType: "stocktake", sourceDepartment: "家庭用品", scheduledAt: `${slashDate} 11:00`, period },
        { id: `dataset-${compactDate}-order-seafood-1000`, dataNumber: `D-${compactDate}-001`, dataType: "order", sourceDepartment: "鮮魚", scheduledAt: `${slashDate} 10:00`, period },
        { id: `dataset-${compactDate}-order-produce-1200`, dataNumber: `D-${compactDate}-003`, dataType: "order", sourceDepartment: "青果", scheduledAt: `${slashDate} 12:00`, period },
        { id: `dataset-${compactDate}-order-produce-1500`, dataNumber: `D-${compactDate}-004`, dataType: "order", sourceDepartment: "青果", scheduledAt: `${slashDate} 15:00`, period },
        { id: `dataset-${compactDate}-returns-produce-1800`, dataNumber: `D-${compactDate}-005`, dataType: "returns", sourceDepartment: "青果", scheduledAt: `${slashDate} 18:00`, period },
        { id: `dataset-${compactDate}-order-meat-1830`, dataNumber: `D-${compactDate}-006`, dataType: "order", sourceDepartment: "精肉", scheduledAt: `${slashDate} 18:30`, period },
      ];
    }
    let TARGET_DATASETS = buildTargetDatasets();
    let DATASET_BY_ID = new Map(TARGET_DATASETS.map((item) => [item.id, item]));
    function replaceTargetDatasetCatalog(referenceDate) { TARGET_DATASETS = buildTargetDatasets(referenceDate); DATASET_BY_ID = new Map(TARGET_DATASETS.map((item) => [item.id, item])); return TARGET_DATASETS; }
    const DATASET_PROCESSING_SETTINGS_STORAGE_KEY = "store-data-confirmation-processing-settings-v1";
    const SCHEDULED_TIME_PATTERN = /^([01]\d|2[0-3]):[0-5]\d$/;
    const DEFAULT_DATASET_PROCESSING_SETTING = { processingEnabled: true, scheduledTime: null, unconfirmedReminderEnabled: false, reminderLeadMinutes: 10 };
    function normalizeDatasetProcessingSettings(value) { return TARGET_DATASETS.reduce((settings, dataset) => { const source = value?.[dataset.id] || {}; const reminderLeadMinutes = Number(source.reminderLeadMinutes); settings[dataset.id] = { processingEnabled: source.processingEnabled !== false, scheduledTime: SCHEDULED_TIME_PATTERN.test(source.scheduledTime || "") ? source.scheduledTime : null, unconfirmedReminderEnabled: Boolean(source.unconfirmedReminderEnabled), reminderLeadMinutes: Number.isFinite(reminderLeadMinutes) ? Math.max(0, Math.min(240, Math.trunc(reminderLeadMinutes))) : DEFAULT_DATASET_PROCESSING_SETTING.reminderLeadMinutes }; return settings; }, {}); }
    let volatileDatasetProcessingSettings = null;
    function readDatasetProcessingSettings() { if (!volatileDatasetProcessingSettings) volatileDatasetProcessingSettings = normalizeDatasetProcessingSettings(null); return normalizeDatasetProcessingSettings(volatileDatasetProcessingSettings); }
    function writeDatasetProcessingSettings(settings) { const normalized = normalizeDatasetProcessingSettings(settings); volatileDatasetProcessingSettings = normalized; return normalized; }
    function clearLegacyBrowserStorage() { try { window.localStorage.removeItem(DATASET_PROCESSING_SETTINGS_STORAGE_KEY); window.localStorage.removeItem(APP_CONFIG.api.mockStorageKey); } catch (_) {} }
    clearLegacyBrowserStorage();
    const STORE_NAMES = ["東京駅前店", "新宿中央店", "横浜みなと店", "大宮西口店", "名古屋栄店", "大阪梅田店", "神戸三宮店", "福岡天神店"];
    const DEPARTMENT_BY_AREA = { 東日本: "東日本営業部", 中日本: "中日本営業部", 西日本: "西日本営業部" };
    const AREA_NAMES = Object.keys(DEPARTMENT_BY_AREA);
    const MANAGER_NAMES = ["佐藤", "鈴木", "高橋", "田中", "伊藤", "山本", "中村", "小林"];
    const STORE_MASTER = Array.from({ length: 150 }, (_, index) => {
      const code = String(index + 1).padStart(3, "0");
      const area = AREA_NAMES[index % AREA_NAMES.length];
      return {
        id: `S${code}`, code, name: STORE_NAMES[index] || `${area}${code}店`,
        company: index < 120 ? "株式会社サンプルリテール" : "株式会社サンプルフーズ",
        department: DEPARTMENT_BY_AREA[area], area, manager: MANAGER_NAMES[index % MANAGER_NAMES.length],
      };
    });
    const STORE_BY_ID = new Map(STORE_MASTER.map((item) => [item.id, item]));
    const PERMISSION = {
      VIEW: "view", STORE_SELF_CONFIRM: "storeSelfConfirm", STORE_SELF_REOPEN: "storeSelfReopen",
      STORE_PROXY_CONFIRM: "storeProxyConfirm", STORE_PROXY_REOPEN: "storeProxyReopen", HQ_CONFIRM: "hqConfirm", HQ_REOPEN: "hqReopen", INTEGRATION_DATA_CREATE: "integrationDataCreate",
    };
    const ACCESS_PROFILES = [
      { id: "store-s004", userName: "田中 店長", orgName: "大宮西口店", orgType: "store", attentionAction: "storeConfirm", scope: { type: "stores", storeIds: ["S004"] }, permissions: [PERMISSION.VIEW, PERMISSION.STORE_SELF_CONFIRM, PERMISSION.STORE_SELF_REOPEN] },
      { id: "hq-product", userName: "商品部 担当者", orgName: "商品部", orgType: "hq", attentionAction: "hqConfirm", scope: { type: "all" }, permissions: [PERMISSION.VIEW, PERMISSION.STORE_PROXY_CONFIRM, PERMISSION.STORE_PROXY_REOPEN, PERMISSION.HQ_CONFIRM, PERMISSION.HQ_REOPEN, PERMISSION.INTEGRATION_DATA_CREATE] },
      { id: "hq-system", userName: "情報システム部 運用保守担当", orgName: "情報システム部", orgType: "hq", attentionAction: "storeConfirm", scope: { type: "all" }, permissions: [PERMISSION.VIEW, PERMISSION.STORE_PROXY_CONFIRM, PERMISSION.STORE_PROXY_REOPEN, PERMISSION.HQ_CONFIRM, PERMISSION.HQ_REOPEN, PERMISSION.INTEGRATION_DATA_CREATE] },
      { id: "hq-general-affairs", userName: "総務部 担当者", orgName: "総務部", orgType: "hq", attentionAction: null, scope: { type: "all" }, permissions: [PERMISSION.VIEW] },
    ];
    const ACTION_DEFINITIONS = {
      storeConfirm: { label: (profile) => profile.orgType === "store" ? "店舗確定" : "代理店舗確定", title: "店舗確定を実行しますか", body: "未確定の店舗データを店舗確定へ進めます。", permission: (profile) => profile.orgType === "store" ? PERMISSION.STORE_SELF_CONFIRM : PERMISSION.STORE_PROXY_CONFIRM, canApply: (record) => record.confirmationStatus === "draft" && record.integration.state === "notStarted", nextStatus: "storeConfirmed" },
      storeReopen: { label: (profile) => profile.orgType === "store" ? "店舗確定解除" : "代理店舗確定解除", title: "店舗確定を解除しますか", body: "店舗確定を解除し、未確定へ1段階戻します。", permission: (profile) => profile.orgType === "store" ? PERMISSION.STORE_SELF_REOPEN : PERMISSION.STORE_PROXY_REOPEN, canApply: (record) => record.confirmationStatus === "storeConfirmed" && record.integration.state === "notStarted", nextStatus: "draft" },
      hqConfirm: { label: () => "本部確定・連動用データ作成", title: "操作対象データを本部確定しますか", body: "店舗確定は押印チェックとして扱います。未確定を含む全店舗の現時点データを本部確定し、連動用データ作成を開始します。", permission: () => PERMISSION.HQ_CONFIRM, canApply: (record) => ["draft", "storeConfirmed"].includes(record.confirmationStatus) && record.integration.state === "notStarted", nextStatus: "hqConfirmed" },
      hqConfirmSelected: { label: () => "選択店舗を本部確定", title: "選択店舗だけを本部確定しますか", body: "選択した店舗だけを本部確定し、連動用データ作成を開始します。未選択の店舗は変更しません。", permission: () => PERMISSION.HQ_CONFIRM, canApply: (record) => ["draft", "storeConfirmed"].includes(record.confirmationStatus) && record.integration.state === "notStarted", nextStatus: "hqConfirmed" },
      hqReopen: { label: () => "本部確定解除", title: "本部確定を解除しますか", body: "本部確定を解除し、店舗確定へ1段階戻します。連動用データの作成開始後は解除できません。", permission: () => PERMISSION.HQ_REOPEN, canApply: (record) => record.confirmationStatus === "hqConfirmed" && ["notStarted", "failed"].includes(record.integration.state), nextStatus: "storeConfirmed" },
      createIntegrationData: { label: () => "連動用データを追加作成", title: "連動用データを作成しますか", body: "本部確定済みの現在値から、連動用データを追加作成します。", permission: () => PERMISSION.INTEGRATION_DATA_CREATE, canApply: (record) => record.confirmationStatus === "hqConfirmed" && record.integration.state !== "processing", nextStatus: null },
    };
    const ACTION_ORDER = ["storeConfirm", "storeReopen", "hqConfirm", "hqConfirmSelected", "hqReopen", "createIntegrationData"];

    function createSeededRandom(seed) {
      let state = Number(seed) >>> 0;
      return () => { state = (state * 1664525 + 1013904223) >>> 0; return state / 4294967296; };
    }
    function nowLabel() {
      const date = new Date();
      const pad = (value) => String(value).padStart(2, "0");
      return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }
    function generateMockSubmissions(stores, seed = Date.now()) {
      const random = createSeededRandom(seed);
      const hqConfirmedDatasetIds = new Set(TARGET_DATASETS.filter((_, index) => index % 2 === 0).map((dataset) => dataset.id));
      return stores.flatMap((store) => TARGET_DATASETS.map((dataset) => {
        const confirmationStatus = hqConfirmedDatasetIds.has(dataset.id) ? "hqConfirmed" : random() < 0.5 ? "draft" : "storeConfirmed";
        const hqConfirmedFromStatus = confirmationStatus === "hqConfirmed" ? random() < 0.35 ? "draft" : "storeConfirmed" : null;
        const datasetDate = dataset.scheduledAt.slice(0, 10);
        const hqConfirmedAt = confirmationStatus === "hqConfirmed" ? `${datasetDate} 08:30` : null;
        const hour = String(8 + Math.floor(random() * 12)).padStart(2, "0");
        const minute = String(Math.floor(random() * 60)).padStart(2, "0");
        const statusChangedAt = `${datasetDate} ${hour}:${minute}`;
        const bookInventory = Math.round((2000000 + random() * 3000000) / 1000) * 1000;
        const countedInventory = bookInventory + Math.round((-80000 + random() * 160000) / 1000) * 1000;
        const submissionId = `${dataset.id}:${store.id}`;
        let payload;
        if (dataset.dataType === "stocktake") payload = { bookInventory, countedInventory, inventoryVariance: countedInventory - bookInventory };
        else if (dataset.dataType === "returns") payload = { returnAmount: Math.round((80000 + random() * 420000) / 1000) * 1000, returnLines: 1 + Math.floor(random() * 20), returnQuantity: 1 + Math.floor(random() * 50) };
        else payload = { orderAmount: Math.round((700000 + random() * 1800000) / 1000) * 1000, orderLines: 20 + Math.floor(random() * 80), deliveryCount: 1 + Math.floor(random() * 5) };
        return {
          submissionId, datasetId: dataset.id, storeId: store.id, dataType: dataset.dataType, period: dataset.period,
          confirmationStatus, confirmationStatusChangedAt: hqConfirmedAt || statusChangedAt,
          storeConfirmedAt: confirmationStatus === "storeConfirmed" || hqConfirmedFromStatus === "storeConfirmed" ? statusChangedAt : null,
          storeConfirmedBy: confirmationStatus === "storeConfirmed" || hqConfirmedFromStatus === "storeConfirmed" ? "店舗担当者" : null,
          hqConfirmedAt,
          hqConfirmedBy: confirmationStatus === "hqConfirmed" ? "商品部 担当者" : null,
          hqConfirmedFromStatus,
          integration: confirmationStatus === "hqConfirmed" ? { state: "succeeded", attemptId: `${submissionId}:mock-hq-batch`, startedAt: hqConfirmedAt, completedAt: hqConfirmedAt, error: null, creationCount: 1 } : { state: "notStarted", attemptId: null, startedAt: null, completedAt: null, error: null, creationCount: 0 },
          updatedAt: hqConfirmedAt || statusChangedAt, revision: 1,
          history: [{ action: "mockGenerated", mode: "system", actor: "モックデータ生成", at: hqConfirmedAt || statusChangedAt, revision: 1, datasetId: dataset.id, dataNumber: dataset.dataNumber, initialConfirmationStatus: confirmationStatus, ...(hqConfirmedFromStatus ? { hqConfirmedFromStatus } : {}) }],
          payload,
        };
      }));
    }
    function hasPermission(profile, permission) { return Boolean(profile?.permissions?.includes(permission)); }
    function isStoreInScope(profile, store) {
      if (!profile || !store || !profile.scope) return false;
      if (profile.scope.type === "all") return true;
      if (profile.scope.type === "areas") return profile.scope.areas?.includes(store.area) ?? false;
      if (profile.scope.type === "stores") return profile.scope.storeIds?.includes(store.id) ?? false;
      return false;
    }
    function canViewStore(profile, store) { return hasPermission(profile, PERMISSION.VIEW) && isStoreInScope(profile, store); }
    function joinSubmission(submission) { return { ...STORE_BY_ID.get(submission.storeId), ...submission, dataset: DATASET_BY_ID.get(submission.datasetId) }; }
    function canExecute(actionType, profile, record) {
      const definition = ACTION_DEFINITIONS[actionType];
      return Boolean(definition && canViewStore(profile, record) && hasPermission(profile, definition.permission(profile)) && definition.canApply(record));
    }
    function transitionSubmission(submission, actionType, profile, timestamp) {
      const record = joinSubmission(submission);
      if (!canExecute(actionType, profile, record)) return submission;
      const definition = ACTION_DEFINITIONS[actionType];
      const revision = submission.revision + 1;
      const historyEntry = { action: actionType, mode: profile.orgType === "store" ? "self" : "proxy", actor: profile.userName, at: timestamp, revision, datasetId: submission.datasetId, dataNumber: DATASET_BY_ID.get(submission.datasetId)?.dataNumber, ...( ["hqConfirm", "hqConfirmSelected"].includes(actionType) ? { fromConfirmationStatus: submission.confirmationStatus } : {}) };
      const next = { ...submission, confirmationStatus: definition.nextStatus || submission.confirmationStatus, confirmationStatusChangedAt: definition.nextStatus ? timestamp : submission.confirmationStatusChangedAt, updatedAt: timestamp, revision, history: [...submission.history, historyEntry] };
      if (actionType === "storeConfirm") { next.storeConfirmedAt = timestamp; next.storeConfirmedBy = profile.userName; }
      if (actionType === "storeReopen") { next.storeConfirmedAt = null; next.storeConfirmedBy = null; next.hqConfirmedAt = null; next.hqConfirmedBy = null; }
      if (["hqConfirm", "hqConfirmSelected"].includes(actionType)) { const creationCount = Number(submission.integration.creationCount || 0) + 1; next.hqConfirmedAt = timestamp; next.hqConfirmedBy = profile.userName; next.hqConfirmedFromStatus = submission.confirmationStatus; next.integration = { ...submission.integration, state: "processing", attemptId: `${submission.submissionId}:hq-r${revision}`, startedAt: timestamp, completedAt: null, error: null, creationCount, mockCompleteAfter: Date.now() + APP_CONFIG.api.mockIntegrationMs }; }
      if (actionType === "hqReopen") { next.hqConfirmedAt = null; next.hqConfirmedBy = null; next.hqConfirmedFromStatus = null; next.integration = { state: "notStarted", attemptId: null, startedAt: null, completedAt: null, error: null, creationCount: 0 }; }
      if (actionType === "createIntegrationData") { const creationCount = Number(submission.integration.creationCount || 0) + 1; next.integration = { ...submission.integration, state: "processing", attemptId: `${submission.submissionId}:manual-r${revision}`, startedAt: timestamp, completedAt: null, error: null, creationCount, mockCompleteAfter: Date.now() + APP_CONFIG.api.mockIntegrationMs }; }
      return next;
    }
    function reconcileScheduledIntegrations(db, businessNow = APP_CONFIG.demoCurrentAt, runtimeNow = Date.now()) {
      let changed = false;
      const businessNowMinute = dateTimeToMinuteValue(businessNow);
      const processingSettings = readDatasetProcessingSettings();
      const submissions = db.submissions.map((submission) => {
