// JSXコードを文字列として定義
const appCode = `
const { useState, useEffect, useRef, useMemo } = React;
const {
  AppBar, Toolbar, Typography: MuiTypography, CssBaseline, Container, Box: MuiBox, Stack: MuiStack, Button,
  ThemeProvider, createTheme, useMediaQuery, Paper, Chip, TextField: MuiTextField, Dialog: MuiDialog,

/* ===== MUI 9 互換レイヤー =====
 * v9で削除された直接system propsと旧TextField propsを、画面側の既存契約を保ったまま
 * sx / slotProps / Grid sizeへ正規化する。新規実装はv9形式を直接使用する。
 */
const LEGACY_SYSTEM_PROP_NAMES = new Set([
  'm','mt','mr','mb','ml','mx','my','p','pt','pr','pb','pl','px','py',
  'border','borderTop','borderRight','borderBottom','borderLeft','borderColor','borderRadius',
  'bgcolor','boxShadow','display','overflow','overflowX','overflowY',
  'width','minWidth','maxWidth','height','minHeight','maxHeight','boxSizing',
  'position','top','right','bottom','left','zIndex',
  'flex','flexGrow','flexShrink','flexBasis','flexDirection','flexWrap',
  'gap','rowGap','columnGap','order',
  'alignContent','alignItems','alignSelf','justifyContent','justifyItems','justifySelf',
  'gridArea','gridColumn','gridRow','gridAutoColumns','gridAutoFlow','gridAutoRows',
  'gridTemplateAreas','gridTemplateColumns','gridTemplateRows',
  'color','fontFamily','fontSize','fontStyle','fontWeight','letterSpacing','lineHeight',
  'textAlign','whiteSpace','textOverflow'
]);
const LEGACY_PALETTE_COLOR_NAMES = new Set(['primary','secondary','error','info','success','warning']);

const splitLegacySystemProps = props => Object.entries(props).reduce((result, [key, value]) => {
  if (LEGACY_SYSTEM_PROP_NAMES.has(key)) {
    result.systemSx[key] = key === 'color' && LEGACY_PALETTE_COLOR_NAMES.has(value)
      ? value + '.main'
      : value;
  }
  else result.componentProps[key] = value;
  return result;
}, {componentProps:{}, systemSx:{}});

const mergeSystemSx = (systemSx, sx) => {
  if (!Object.keys(systemSx).length) return sx;
  return [systemSx, ...(Array.isArray(sx) ? sx : [sx])].filter(Boolean);
};

const withSystemPropAdapter = (Component, name) => {
  const Adapter = React.forwardRef(function SystemPropAdapter({sx, ...props}, ref) {
    const {componentProps, systemSx} = splitLegacySystemProps(props);
    return <Component ref={ref} {...componentProps} sx={mergeSystemSx(systemSx, sx)}/>;
  });
  Adapter.displayName = name;
  return Adapter;
};

const Box = withSystemPropAdapter(MuiBox, 'BoxV9Adapter');
const Stack = withSystemPropAdapter(MuiStack, 'StackV9Adapter');
const Typography = withSystemPropAdapter(MuiTypography, 'TypographyV9Adapter');

const Grid = React.forwardRef(function GridV9Adapter({item, xs, sm, md, lg, xl, size, sx, ...props}, ref) {
  const breakpointSize = {};
  if (xs !== undefined) breakpointSize.xs = xs;
  if (sm !== undefined) breakpointSize.sm = sm;
  if (md !== undefined) breakpointSize.md = md;
  if (lg !== undefined) breakpointSize.lg = lg;
  if (xl !== undefined) breakpointSize.xl = xl;
  const hasBreakpointSize = Object.keys(breakpointSize).length > 0;
  const resolvedSize = hasBreakpointSize
    ? {...(size && typeof size === 'object' ? size : {}), ...breakpointSize}
    : size;
  const {componentProps, systemSx} = splitLegacySystemProps(props);
  return (
    <MuiGrid
      ref={ref}
      {...componentProps}
      {...(resolvedSize !== undefined ? {size:resolvedSize} : {})}
      sx={mergeSystemSx(systemSx, sx)}
    />
  );
});

const mergeSlotProp = (legacyValue, currentValue) => {
  if (legacyValue == null) return currentValue;
  if (currentValue == null) return legacyValue;
  if (typeof currentValue === 'function') {
    return ownerState => ({...legacyValue, ...currentValue(ownerState)});
  }
  return {...legacyValue, ...currentValue};
};

const Dialog = React.forwardRef(function DialogV9Adapter({
  BackdropComponent,
  BackdropProps,
  PaperProps,
  TransitionComponent,
  TransitionProps,
  slots = {},
  slotProps = {},
  ...props
}, ref) {
  const resolvedSlots = {...slots};
  if (BackdropComponent && !resolvedSlots.backdrop) resolvedSlots.backdrop = BackdropComponent;
  if (TransitionComponent && !resolvedSlots.transition) resolvedSlots.transition = TransitionComponent;
  const resolvedSlotProps = {...slotProps};
  resolvedSlotProps.backdrop = mergeSlotProp(BackdropProps, resolvedSlotProps.backdrop);
  resolvedSlotProps.paper = mergeSlotProp(PaperProps, resolvedSlotProps.paper);
  resolvedSlotProps.transition = mergeSlotProp(TransitionProps, resolvedSlotProps.transition);
  Object.keys(resolvedSlotProps).forEach(key => {
    if (resolvedSlotProps[key] == null) delete resolvedSlotProps[key];
  });
  return <MuiDialog ref={ref} {...props} slots={resolvedSlots} slotProps={resolvedSlotProps}/>;
});
Dialog.displayName = 'DialogV9Adapter';

const TextField = React.forwardRef(function TextFieldV9Adapter({
  InputProps,
  inputProps,
  SelectProps,
  InputLabelProps,
  FormHelperTextProps,
  slotProps = {},
  ...props
}, ref) {
  const resolvedSlotProps = {...slotProps};
  resolvedSlotProps.input = mergeSlotProp(InputProps, resolvedSlotProps.input);
  resolvedSlotProps.htmlInput = mergeSlotProp(inputProps, resolvedSlotProps.htmlInput);
  resolvedSlotProps.select = mergeSlotProp(SelectProps, resolvedSlotProps.select);
  resolvedSlotProps.inputLabel = mergeSlotProp(InputLabelProps, resolvedSlotProps.inputLabel);
  resolvedSlotProps.formHelperText = mergeSlotProp(FormHelperTextProps, resolvedSlotProps.formHelperText);
  Object.keys(resolvedSlotProps).forEach(key => {
    if (resolvedSlotProps[key] == null) delete resolvedSlotProps[key];
  });
  return <MuiTextField ref={ref} {...props} slotProps={resolvedSlotProps}/>;
});

const GENERAL_LIST_FLOW_TASKS = {
  request:new Set(['create','accept','apply','applicant_approve']),
  proposal:new Set(['review','assign','partner_review','partner_approve','destination_review']),
  confirmed:new Set(['execute','partner_execute']),
  completed:new Set([
    'evidence','approve','after_check','complete_confirm','department_approve','manager_approve',
    'partner_result_check','destination_result_check','applicant_check','applicant_approver_check','complete'
  ])
};
const listFlowStatusOf = item => {
  if (!isStoredWorkflowItem(item)) return item?.flowStatus || 'request';
  const tasks = item.workflowTasks || [];
  if (item.workflowCaseStatus === '完了' || item.dataState === 'completed' ||
      (tasks.length > 0 && tasks.every(task => task.status === '完了' || task.status === 'スキップ'))) {
    return 'paid';
  }
  const currentTask = tasks.find(task => task.status === '進行中' || task.status === '差戻し') ||
    tasks.find(task => task.status !== '完了' && task.status !== 'スキップ');
  if (!currentTask) return 'request';
  const mappedStatus = Object.entries(GENERAL_LIST_FLOW_TASKS)
    .find(([, keys]) => keys.has(currentTask.key))?.[0];
  if (mappedStatus) return mappedStatus;
  const executionTask = tasks.find(task => task.key === 'execute' || task.key === 'partner_execute');
  if (!executionTask) return 'request';
  if (currentTask.seq < executionTask.seq) return 'proposal';
  if (currentTask.seq === executionTask.seq) return 'confirmed';
  return 'completed';
};

const createWorkflowTaskInstances = (workflowType, actorName, startNow) => {
  const definition = WORKFLOW_TYPE_DEFINITIONS[workflowType];
  const now = new Date().toISOString();
  return (definition?.steps || []).map((step, index) => ({
    ...step,
    seq:index + 1,
    group:step.group || null,
    status:startNow && index === 0 ? '完了' : startNow && index === 1 ? '進行中' : '未着手',
    assignee:index === 0
      ? actorName
      : startNow && index === 1
        ? USER_ACCOUNTS.find(account => (step.ownerAccountKeys || []).includes(account.key))?.name || step.owner
        : '',
    startedAt:startNow && index <= 1 ? now : null,
    completedAt:startNow && index === 0 ? now : null,
    completedBy:startNow && index === 0 ? actorName : null,
    executionType:startNow && index === 0 ? 'direct' : null
  }));
};

// 人による最終確認が終わったら、終端の「完了」はシステムが自動確定する。
const advanceStoredWorkflowTasks = (sourceTasks, now) => {
  let tasks = sourceTasks;
  while (!tasks.some(task => task.status === '進行中' || task.status === '差戻し')) {
    const next = tasks.find(task => task.status === '未着手');
    if (!next) break;
    if (next.type === 'terminal') {
      tasks = tasks.map(task => task.seq === next.seq ? {
        ...task,
        status:'完了',
        assignee:'システム',
        startedAt:now,
        completedAt:now,
        completedBy:'システム',
        executionType:'automatic'
      } : task);
      continue;
    }
    tasks = tasks.map(task => {
      const activate = next.group ? task.group === next.group : task.seq === next.seq;
      return activate ? {
        ...task,
        status:'進行中',
        startedAt:now,
        assignee:task.assignee || USER_ACCOUNTS.find(account => (task.ownerAccountKeys || []).includes(account.key))?.name || task.owner
      } : task;
    });
  }
  return tasks;
};

const startStoredWorkflow = (item, account) => {
  if (!isStoredWorkflowItem(item) || item.dataState !== 'draft') return null;
  const proxy = account?.key === 'service_owner_staff';
  if (!proxy && account?.key !== 'internal_user_staff') return null;
  const now = new Date().toISOString();
  const tasks = item.workflowTasks.map((task,index) => ({
    ...task,
    status:index === 0 ? '完了' : index === 1 ? '進行中' : '未着手',
    assignee:index === 0
      ? account?.name || task.assignee
      : index === 1
        ? task.assignee || USER_ACCOUNTS.find(candidate => (task.ownerAccountKeys || []).includes(candidate.key))?.name || task.owner
        : task.assignee || '',
    startedAt:index <= 1 ? now : null,
    completedAt:index === 0 ? now : null,
    completedBy:index === 0 ? account?.name : null,
    executionType:index === 0 ? (proxy ? 'proxy' : 'direct') : null
  }));
  return {
    ...item,
    workflowTasks:tasks,
    workflowCaseStatus:'申請済',
    dataState:'submitted',
    submittedAt:now,
    history:[...(item.history || []), {
      action:'start_workflow', taskName:tasks[0]?.label || '申請者', from:'下書き', to:'申請済',
      by:account?.name || account?.key, at:now, ...buildActionAudit(account, 'start_workflow')
    }]
  };
};

const completeStoredWorkflowTask = (item, account) => {
  const accountKey = account?.key;
  const proxy = accountKey === 'service_owner_staff';
  const activeTask = (item.workflowTasks || []).find(task =>
    (task.status === '進行中' || task.status === '差戻し') &&
    (proxy || (task.ownerAccountKeys || []).includes(accountKey))
  );
  if (!activeTask) return null;
  const now = new Date().toISOString();
  let tasks = item.workflowTasks.map(task => task.seq === activeTask.seq ? {
    ...task, status:'完了', completedAt:now, completedBy:account?.name || accountKey,
    executionType:proxy ? 'proxy' : 'direct'
  } : task);
  tasks = advanceStoredWorkflowTasks(tasks, now);
  const completed = tasks.every(task => task.status === '完了' || task.status === 'スキップ');
  return {
    ...item,
    workflowTasks:tasks,
    workflowCaseStatus:completed ? '完了' : '対応中',
    dataState:completed ? 'completed' : 'submitted',
    completedAt:completed ? now : item.completedAt,
    history:[...(item.history || []), {
      action:'complete_workflow_task', taskSeq:activeTask.seq, taskKey:activeTask.key,
      taskName:activeTask.label, from:item.workflowCaseStatus || '申請済', to:completed ? '完了' : '対応中',
      by:account?.name || accountKey, at:now, ...buildActionAudit(account, 'complete_workflow_task')
    }]
  };
};

const getWorkflowTransition = action => {
  const transitions = {
    submit_request: { flowStatus:'request', dataState:'submitted', timestamp:'submittedAt' },
    approve_request: { flowStatus:'request', dataState:'approved' },
    approve_partner_estimate: { flowStatus:'proposal', dataState:'submitted' },
    approve_estimate: { flowStatus:'confirmed', dataState:'approved', timestamp:'confirmedAt' },
    report_complete: { flowStatus:'completed', dataState:'submitted', timestamp:'completedAt' },
    accept_complete: { flowStatus:'billing', dataState:'reviewing', timestamp:'billingAt' },
    invoice: { flowStatus:'paying', dataState:'reviewing', timestamp:'paymentStartedAt' },
    payment: {
      flowStatus:'paid',
      dataState:'completed',
      timestamp:'paidAt',
      extra:{
        accountingSystemStatus:'linked',
        accountingSystemLinkedAt:new Date().toISOString()
      }
    }
  };
  return transitions[action] || null;
};

const buildTransitionedItem = (source, action, account) => {
  const transition = getWorkflowTransition(action);
  if (!source || !transition) return null;
  const now = new Date().toISOString();
  return {
    ...source,
    flowStatus:transition.flowStatus,
    dataState:transition.dataState,
    ...(transition.timestamp ? {[transition.timestamp]:now} : {}),
    ...(transition.extra || {}),
    rejectedAt:null,
    rejectedReason:'',
    rejectedBy:'',
    history:[...(source.history || []), {
      action,
      from:source.flowStatus,
      to:transition.flowStatus,
      by:account?.name || account?.key || 'unknown',
      at:now,
      ...buildActionAudit(account, action)
    }]
  };
};

const utils = {
  randomId: () => Math.random().toString(36).slice(2,8),
  yen: v => v ? '¥' + Number(v).toLocaleString() : '—',
  fmtDate: iso => iso ? new Date(iso).toISOString().slice(0,10) : '—',
  fmtDateTime: iso => iso ? new Date(iso).toLocaleString('ja-JP') : '—',
  nextFlowStatus: key => {
    const idx = FLOW_STATUSES.findIndex(s => s.key === key);
    return idx >= 0 && idx < FLOW_STATUSES.length - 1 ? FLOW_STATUSES[idx + 1].key : null;
  },
  prevFlowStatus: key => {
    const idx = FLOW_STATUSES.findIndex(s => s.key === key);
    return idx > 0 ? FLOW_STATUSES[idx - 1].key : null;
  },
  getFlowIndex: key => FLOW_STATUSES.findIndex(s => s.key === key),
  dataStateInfo: (flowStatus, dataState) => {
    const state = DATA_STATES[dataState];
    const contextualLabels = {
      request: {submitted:'社内承認待ち', approved:'提案待ち', rejected:'依頼差戻し', cancelled:'取消済'},
      proposal: {reviewing:'取引先承認待ち', submitted:'確定承認待ち', rejected:'提案差戻し'},
      confirmed: {approved:'実施待ち', rejected:'実施報告差戻し'},
      completed: {submitted:'検収待ち'},
      billing: {reviewing:'支払処理起票待ち'},
      paying: {reviewing:'支払承認待ち'},
      paid: {completed:'完了'}
    };
    const contextualLabel = contextualLabels[flowStatus]?.[dataState];
    if (contextualLabel && state) return {...state, label:contextualLabel};
    return state;
  },
  getAccount: accountKey => USER_ACCOUNTS.find(a => a.key === accountKey),
  hasPermission: (accountKey, permission) =>
    USER_ACCOUNTS.find(a => a.key === accountKey)?.permissions.includes(permission) || false,
  timeToMinutes: value => {
    if (!value || !/^\\d{1,2}:\\d{2}$/.test(value)) return null;
    const [hours, minutes] = value.split(':').map(Number);
    return hours * 60 + minutes;
  },
  workMinutes: work => {
    const start = utils.timeToMinutes(work?.startTime);
    const end = utils.timeToMinutes(work?.endTime);
    if (start === null || end === null || end <= start) return null;
    return Math.max(0, end - start - Math.max(0, Number(work?.breakMinutes) || 0));
  },
  isRequestReady: item => {
    const works = item?.workItems || [];
    return Boolean(
      item?.title?.trim() && item?.caseStartDate && item?.caseEndDate &&
      item.caseStartDate <= item.caseEndDate && works.length > 0 &&
      works.every(work => work.title?.trim() && work.date &&
        utils.workMinutes(work) > 0 && Number(work.hourlyRate) > 0 &&
        work.store && Number(work.heads) >= 1 &&
        work.date >= item.caseStartDate && work.date <= item.caseEndDate)
    );
  },
  estimateLineAmount: row => {
    const workMinutes = utils.workMinutes(row);
    if (workMinutes === null) return 0;
    const laborAmount = (workMinutes / 60) * (Number(row?.hourlyRate) || 0);
    return Math.round(laborAmount + (Number(row?.transport) || 0));
  },
  fmtMinutes: value => {
    if (value === null || value === undefined || !Number.isFinite(Number(value))) return '—';
    const minutes = Math.max(0, Number(value));
    const hours = Math.floor(minutes / 60);
    const rest = minutes % 60;
    return hours > 0 ? hours + '時間' + (rest ? rest + '分' : '') : rest + '分';
  },
  fmtClockMinutes: value => {
    if (value === null || value === undefined || !Number.isFinite(Number(value))) return '—';
    const minutes = Math.max(0, Math.round(Number(value)));
    return String(Math.floor(minutes / 60)).padStart(2, '0') + ':' + String(minutes % 60).padStart(2, '0');
  },
  availableActions: (item, accountKey) => {
    const account = USER_ACCOUNTS.find(a => a.key === accountKey);
    if (!item || !account) return [];
    if (isStoredWorkflowItem(item)) return [];
    return WORKFLOW_ACTIONS.filter(action =>
      account.permissions.includes(action.permission) &&
      action.flow === item.flowStatus &&
      action.states.includes(item.dataState)
    );
  },
  randPick: arr => arr[Math.floor(Math.random()*arr.length)],
  randInt: (min,max) => Math.floor(Math.random()*(max-min+1))+min,
  daysFromNow: d => new Date(Date.now()+86400000*d).toISOString().slice(0,10)
};

// APIレスポンスに旧形式や時刻未設定の作業が混在しても、表示・計算に必要な時刻を補完する
function normalizeRequestTimes(item) {
  if (!item || typeof item !== 'object') return item;
  const normalize = work => ({...work, startTime:work.startTime || '09:00', endTime:work.endTime || '18:00'});
  // 旧版の「請求待＋承認済」は、支払中を追加する前の支払起票済み状態。
  const legacyPaying = !isStoredWorkflowItem(item) && item.flowStatus === 'billing' && item.dataState === 'approved';
  const normalizedWorkflowDefinition = isStoredWorkflowItem(item) && item.workflowDefinition
    ? {...item.workflowDefinition, label:WORKFLOW_TYPE_DEFINITIONS[item.workflowType]?.label || item.workflowDefinition.label}
    : item.workflowDefinition;
  return {...item,
    flowStatus:legacyPaying ? 'paying' : item.flowStatus,
    dataState:legacyPaying ? 'reviewing' : item.dataState,
    paymentStartedAt:legacyPaying ? item.paymentStartedAt || item.billingAt || item.updatedAt || null : item.paymentStartedAt || null,
    workflowDefinition:normalizedWorkflowDefinition,
    workItems:Array.isArray(item.workItems) ? item.workItems.map(normalize) : item.workItems,
    schedules:Array.isArray(item.schedules) ? item.schedules.map(normalize) : item.schedules
  };
}

/* ===== Request API =====
 * 既定は単一HTMLで確認できるmockアダプター。
 * バックエンド接続時はHTML読込前に次を設定する。
 * window.REQUEST_API_CONFIG = { mode:'rest', baseUrl:'https://example.com/api' };
 * GET  /requests
 * POST /requests
 * POST /requests/{id}/actions/{action}
 * POST /requests/bulk-actions/{action}
 * 作業条件は request.workItems[].breakMinutes（0以上の整数、分単位）と
 * request.workItems[].hourlyRate（税抜、円単位）で送受信する。
 * 見積明細は estimate.supporters[].transport を入力値とし、
 * lineAmount = round((workMinutes / 60) * hourlyRate) + transport、
 * estimate.amount = sum(lineAmount) をAPI側でも再計算する。
 * 本番APIはユーザー権限と状態遷移を再検証し、更新後の依頼を返す。
 */
const REQUEST_API_CONFIG = {
  mode: 'mock',
  baseUrl: '/api',
  ...(window.REQUEST_API_CONFIG || {})
};
const WORK_TYPES = [
  {key:'inspection', label:'現地確認'}, {key:'repair', label:'修理'},
  {key:'parts_replacement', label:'部品交換'}, {key:'equipment_arrangement', label:'備品手配'},
  {key:'registration', label:'登録作業'}, {key:'delivery', label:'配送'},
  {key:'other', label:'その他'}
];
const workTypeLabel = key => WORK_TYPES.find(type => type.key === key)?.label || 'その他';
const makeCaseNumber = () => '案件-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + utils.randomId().toUpperCase();

let mockRequestStore = [];

const requestApi = {
  async request(path, options = {}) {
    const response = await fetch(REQUEST_API_CONFIG.baseUrl + path, {
      ...options,
      headers: {'Content-Type':'application/json', ...(options.headers || {})}
    });
    if (!response.ok) {
      throw new Error('APIエラー: ' + response.status + ' ' + response.statusText);
    }
    return response.status === 204 ? null : response.json();
  },

  async list() {
    if (REQUEST_API_CONFIG.mode === 'mock') {
      return mockRequestStore.map(normalizeRequestTimes);
    }
    return this.request('/requests');
  },

  async create(payload) {
    if (REQUEST_API_CONFIG.mode === 'mock') {
      mockRequestStore = [payload, ...mockRequestStore];
      return {...payload};
    }
    return this.request('/requests', {method:'POST', body:JSON.stringify(payload)});
  },

  async seed(count = 5) {
    if (REQUEST_API_CONFIG.mode !== 'mock') {
      throw new Error('サンプル案件の生成はモックAPIでのみ利用できます');
    }
    const created = Array.from({length:count}, (_, index) =>
      index % 2 === 0 ? makeInitialRequest() : makeInitialGeneralRequest()
    );
    mockRequestStore = [...created, ...mockRequestStore];
    return created.map(normalizeRequestTimes);
  },

  async update(id, payload, action) {
    if (REQUEST_API_CONFIG.mode === 'mock') {
      mockRequestStore = mockRequestStore.map(item => item.id === id ? payload : item);
      return {...payload};
    }
    return this.request('/requests/' + encodeURIComponent(id) + '/actions/' + encodeURIComponent(action), {
      method:'POST',
      body:JSON.stringify({request:payload})
    });
  },

  async bulkUpdate(payloads, action) {
    if (REQUEST_API_CONFIG.mode === 'mock') {
      const payloadMap = new Map(payloads.map(payload => [payload.id, payload]));
      mockRequestStore = mockRequestStore.map(item => payloadMap.get(item.id) || item);
      return payloads.map(payload => ({...payload}));
    }
    return this.request('/requests/bulk-actions/' + encodeURIComponent(action), {
      method:'POST',
      body:JSON.stringify({requests:payloads})
    });
  }
};

/* ===== CSV出力 ===== */
function exportCSV(items) {
  const headers = ['No','申請種別','ワークフロー種類','フロー状態','データ状態','作業・工程数','案件開始日','案件終了日','実施日','開始時刻','終了時刻','休憩合計(分)','作業時給','必要人数','依頼部門','取引先コード','取引先名','対象拠点','依頼日','確定日','見積金額'];
  const rows = items.map((item, idx) => [
    idx + 1, item.requestTypeLabel || REQUEST_TYPE_DEFINITIONS[item.requestType]?.label || (isStoredWorkflowItem(item) ? '申請' : '人員調達依頼'),
    item.workflowDefinition?.label || WORKFLOW_TYPE_DEFINITIONS[item.workflowType]?.label || WORKFLOW_TYPE_DEFINITIONS.labor_procurement.label,
    FLOW_STATUSES.find(s => s.key === listFlowStatusOf(item))?.label || '',
    isStoredWorkflowItem(item) ? item.workflowCaseStatus || '対応中' : utils.dataStateInfo(item.flowStatus, item.dataState)?.label || '',
    isStoredWorkflowItem(item) ? item.workflowTasks.length : item.workItems?.length || item.schedules?.length || 0,
    item.caseStartDate || '', item.caseEndDate || '',
    item.schedules?.map(s => s.date).join('、') || '', item.schedules?.[0]?.startTime || '',
    item.schedules?.[0]?.endTime || '',
    (item.workItems || item.schedules || []).reduce((sum, work) => sum + (Number(work.breakMinutes) || 0), 0),
    (item.workItems || item.schedules || []).map(work => Number(work.hourlyRate) || 0).join('、'),
    item.heads, item.department, item.partnerCode,
    item.partner, item.store, utils.fmtDate(item.createdAt), utils.fmtDate(item.confirmedAt),
    item.estimate ? item.estimate.amount : ''
  ]);
  
  const csv = [headers, ...rows].map(row => 
    row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')
  ).join('\\n');
  
  const blob = new Blob(['\\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '案件一覧_' + new Date().toISOString().slice(0,10) + '.csv';
  link.click();
}

function GeneralRequestInformation({item}) {

  const fields = item.formDefinition?.fields || definition?.fields || [];
  const urgencyLabels = {low:'低',medium:'中',high:'高',critical:'最優先'};
  const displayValue = (field, value) => {
    if (field.type === 'attachment') {
      return Array.isArray(value) && value.length ? value.map(file => file.name).join('、') : '—';
    }
    if (value === undefined || value === null || value === '') return '—';
    if (field.key === 'currentPrice' || field.key === 'newPrice') return utils.yen(value);
    return String(value).replace('T',' ');
  };
  const commonItems = [
    ['申請種別', item.requestTypeLabel || definition?.label || '申請'],
    ['申請先', item.requestDestination || common.requestDestination || definition?.destination || '—'],
    ['緊急度', urgencyLabels[common.urgency] || common.urgency || '—'],
    ['申請者', common.applicant || item.createdBy || '—'],
    ['所属部署', common.applicantDepartment || item.department || '—'],
    ['希望対応日', common.desiredDate || '—'],
    ['連絡先', common.contact || '—'],

  return (
    <Paper variant="outlined" sx={{overflow:'hidden'}}>
      <Box sx={{px:1.5,py:0.8,bgcolor:'info.light',borderBottom:'1px solid',borderColor:'divider'}}>
        <Typography variant="subtitle1" fontWeight="700">依頼情報</Typography>
      </Box>
      <Box sx={{p:1.5}}>
        <Box sx={{display:'grid',gridTemplateColumns:{xs:'repeat(2,1fr)',md:'repeat(4,1fr)'},gap:1,mb:1}}>
          {commonItems.map(([label,value]) => (
            <Box key={label}>

              <Typography variant="body2" fontWeight="600">{value}</Typography>

          <Typography variant="caption" color="text.secondary">依頼内容</Typography>
          <Typography variant="body2" sx={{whiteSpace:'pre-wrap'}}>{common.requestContent || item.content || '—'}</Typography>

          {fields.filter(field => requestFieldVisible(field, values)).map(field => (

function FlowStepStrip({steps = [], activeStep = 0, ariaLabel = '処理フロー'}) {
  const normalizedActiveStep = Math.max(0, Math.min(Number(activeStep) || 0, Math.max(steps.length - 1, 0)));
  return (
    <Box sx={{overflowX:'auto', WebkitOverflowScrolling:'touch', overscrollBehaviorX:'contain', bgcolor:'grey.50', borderRadius:1, px:{xs:0.5, sm:1}, py:1.25}}>
      <Stack
        direction="row"
        spacing={1}
        justifyContent="center"
        role="list"
        aria-label={ariaLabel}
        sx={{minWidth:{xs:Math.max(560, steps.length * 92), sm:Math.max(720, steps.length * 118)}}}
      >
        {steps.map((step, index) => {
          const completed = index < normalizedActiveStep;
          const current = index === normalizedActiveStep;
          const secondary = step.route || step.owner || '';
          return (
            <Box key={step.key || index} role="listitem" sx={{textAlign:'center', minWidth:{xs:84, sm:110}}}>
              <Box sx={{
                width:28, height:28, borderRadius:'50%', mx:'auto', mb:0.5,
                bgcolor:completed ? 'success.main' : current ? 'primary.main' : 'grey.300',
                color:'white', display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:'0.75rem', fontWeight:600
              }}>
                {completed
                  ? <span className="material-icons" style={{fontSize:16}}>check</span>
                  : index + 1}
              </Box>
              <Stack direction="row" spacing={0.4} justifyContent="center" alignItems="center">
                <Typography variant="caption" sx={{fontWeight:current ? 700 : 400, color:current ? 'primary.main' : 'text.secondary'}}>
                  {step.label}
                </Typography>
                {step.mode === 'parallel' && <Chip size="small" label="並列" variant="outlined" sx={{height:17,fontSize:'0.58rem'}}/>}

              {secondary && (
                <Typography variant="caption" display="block" sx={{fontSize:'0.62rem', color:'text.disabled', whiteSpace:'nowrap'}}>
                  {secondary}

              )}
            </Box>
          );
        })}
      </Stack>
    </Box>
  );
}

function usePersistentExpandedState(storageKey, defaultValue = true) {
  const [expanded, setExpanded] = useState(() => {
    try {
      const stored = window.localStorage.getItem(storageKey);
      return stored === null ? defaultValue : stored === 'true';
    } catch (error) {
      return defaultValue;
    }
  });
  const toggle = () => {
    setExpanded(previous => {
      const next = !previous;
      try {
        window.localStorage.setItem(storageKey, String(next));
      } catch (error) {
        // 保存できない環境でも、このセッション中の開閉状態は維持する。
      }
      return next;
    });
  };
  return [expanded, toggle];
}

function ProcurementFlowHistory({item, currentStep, viewMode = 'table', onViewModeChange}) {
  const [historyExpanded, toggleHistoryExpanded] = usePersistentExpandedState(PROCUREMENT_HISTORY_EXPANDED_STORAGE_KEY);
  const history = Array.isArray(item.history) ? item.history : [];
  const rows = FLOW_STATUSES.map((flow, index) => {
    const meta = PROCUREMENT_FLOW_HISTORY_META[flow.key];
    const events = history.filter(event => meta.actions.includes(event.action) ||
      (['reject','reject_request','cancel'].includes(event.action) && (event.from === flow.key || event.to === flow.key)));
    const lastEvent = events[events.length - 1] || null;
    const finalDone = flow.key === 'paid' && item.dataState === 'completed';
    const status = index < currentStep || finalDone
      ? '完了'
      : index === currentStep
        ? item.dataState === 'rejected'
          ? '差戻し'
          : item.dataState === 'cancelled'
            ? '取消'
            : item.dataState === 'draft'
              ? '未着手'
              : '対応中'
        : '未着手';
    const startedAt = item[PROCUREMENT_FLOW_START_KEYS[index]] || (index === 0 ? item.createdAt : null) || lastEvent?.at || null;
    const completedAt = status === '完了'
      ? index === FLOW_STATUSES.length - 1
        ? item.paidAt || lastEvent?.at || null
        : item[PROCUREMENT_FLOW_START_KEYS[index + 1]] || lastEvent?.at || null
      : null;
    return {
      ...flow,
      seq:index + 1,
      type:meta.type,
      owner:meta.owner,
      stepSecondary:flow.route,
      mode:'直列',
      assignee:index === currentStep && status !== '完了' ? meta.owner : lastEvent?.by || '—',
      status,
      startedAt,
      completedAt,
      executedBy:lastEvent?.by || '—',
      executionType:lastEvent?.executionType || 'direct'
    };
  });
  const currentRow = rows[currentStep] || rows[0];
  return (
    <Paper variant="outlined" sx={{overflow:'hidden'}}>
      <WorkflowHistoryHeader
        title="人員応援・支払フロー"
        summaryLabel={currentRow.status === '完了' ? '全工程完了' : '現在: ' + currentRow.label}
        summaryColor={currentRow.status === '完了' ? 'success' : currentRow.status === '差戻し' ? 'error' : 'primary'}
        viewMode={viewMode}
        onViewModeChange={onViewModeChange}
        expanded={historyExpanded}
        onToggle={toggleHistoryExpanded}
        contentId="procurement-flow-history-content"
        ariaLabel="人員応援工程履歴の表示形式"
      />
      <WorkflowDetailStepper rows={rows} activeStep={currentStep} allDone={currentStep === rows.length - 1 && currentRow.status === '完了'} ariaLabel="人員応援・支払フロー"/>
      <Collapse in={historyExpanded} timeout="auto">
        <Box id="procurement-flow-history-content" sx={{borderTop:'1px solid',borderColor:'divider'}}><WorkflowHistoryRecords rows={rows} viewMode={viewMode} ariaLabel="人員応援工程履歴"/></Box>
      </Collapse>
    </Paper>
  );
}

function StoredWorkflowFlow({item, viewMode = 'table', onViewModeChange}) {
  const [historyExpanded, toggleHistoryExpanded] = usePersistentExpandedState(STORED_WORKFLOW_HISTORY_EXPANDED_STORAGE_KEY);
  const tasks = item.workflowTasks || [];
  const taskTypeLabels = {action:'作業',review:'内容確認',assign:'担当割当',evidence:'結果・証跡',approve:'承認',confirm:'確認',terminal:'完了'};
  const activeIndex = tasks.findIndex(task => task.status === '進行中' || task.status === '差戻し');
  const allDone = tasks.length > 0 && tasks.every(task => task.status === '完了' || task.status === 'スキップ');
  const rows = tasks.map(task => ({
    key:task.key || task.seq,
    seq:task.seq,
    label:task.label,
    type:taskTypeLabels[task.type] || task.type,
    owner:task.owner,
    stepSecondary:task.owner,
    assignee:task.assignee || '未割当',
    mode:task.mode === 'parallel' ? '並列' : '直列',
    status:task.status === '進行中' ? '対応中' : task.status === '差戻し' ? '差戻し' : task.status,
    startedAt:task.startedAt,
    completedAt:task.completedAt,
    executedBy:task.completedBy || '—',
    executionType:task.executionType || 'direct'
  }));
  return (
    <Paper variant="outlined" sx={{overflow:'hidden'}}>
        <WorkflowHistoryHeader
          icon="account_tree"
          title="フロー"
        summaryLabel={allDone ? '全工程完了' : activeIndex >= 0 ? '現在: ' + tasks[activeIndex].label : '未開始'}
        summaryColor={allDone ? 'success' : activeIndex >= 0 ? 'primary' : 'default'}
        viewMode={viewMode}
        onViewModeChange={onViewModeChange}
        expanded={historyExpanded}
        onToggle={toggleHistoryExpanded}
        contentId="stored-workflow-history-content"
        ariaLabel="工程詳細の表示形式"
      />
      <WorkflowDetailStepper rows={rows} activeStep={activeIndex} allDone={allDone} ariaLabel="申請処理フロー"/>
      <Collapse in={historyExpanded} timeout="auto">
        <Box id="stored-workflow-history-content" sx={{borderTop:'1px solid',borderColor:'divider'}}><WorkflowHistoryRecords rows={rows} viewMode={viewMode} ariaLabel="工程詳細"/></Box>
      </Collapse>
    </Paper>
  );
}

/* ===== 詳細モーダル ===== */
function DetailDialog({open, onClose, item, role, onAction}) {
  const isCompactDetail = useMediaQuery('(max-width:599.95px)');
  const [detailViewModes, setDetailViewModes] = useState(() => {
    try {
      const stored = JSON.parse(window.localStorage.getItem(DETAIL_VIEW_MODES_STORAGE_KEY) || '{}');
      if (stored && typeof stored === 'object' && !Array.isArray(stored)) {
        const normalized = Object.fromEntries(DETAIL_VIEW_SECTIONS
          .filter(section => stored[section] === 'table' || stored[section] === 'card')
          .map(section => [section, stored[section]]));
        if (Object.keys(normalized).length) return normalized;
      }
      const legacyMode = window.localStorage.getItem(DETAIL_VIEW_MODE_LEGACY_STORAGE_KEY);
      return legacyMode === 'table' || legacyMode === 'card'
        ? Object.fromEntries(DETAIL_VIEW_SECTIONS.map(section => [section, legacyMode]))
        : {};
    } catch (error) {
      return {};
    }
  });
  const detailViewModeOf = section => detailViewModes[section] || (isCompactDetail ? 'card' : 'table');
  const changeDetailViewMode = (section, mode) => {
    setDetailViewModes(previous => {
      const next = {...previous, [section]:mode};
      try {
        window.localStorage.setItem(DETAIL_VIEW_MODES_STORAGE_KEY, JSON.stringify(next));
      } catch (error) {
        // 保存できない環境でも、このセッション中の表示切替は維持する。
      }
      return next;
    });
  };
  if (!item) return null;
  const currentStep = utils.getFlowIndex(item.flowStatus);
  const flowInfo = FLOW_STATUSES[currentStep];
  const dataStateInfo = utils.dataStateInfo(item.flowStatus, item.dataState);
  const currentAccount = utils.getAccount(role);
  const isServiceOwner = currentAccount?.key === 'service_owner_staff';
  const storedWorkflow = isStoredWorkflowItem(item);
  const activeStoredTasks = storedWorkflow
    ? item.workflowTasks.filter(task => task.status === '進行中' || task.status === '差戻し')
    : [];
  const executableStoredTask = activeStoredTasks.find(task =>
    isServiceOwner || (task.ownerAccountKeys || []).includes(currentAccount?.key)
  );
  const canStartStoredWorkflow = storedWorkflow && item.dataState === 'draft' &&
    (isServiceOwner || currentAccount?.key === 'internal_user_staff');
  const availableActions = storedWorkflow ? [] : utils.availableActions(item, role);
  const workItems = item.workItems?.length ? item.workItems : (item.schedules || []).map((schedule, index) => ({
    id:'W-' + (index + 1),
    title:item.content || '作業',
    date:schedule.date,
    startTime:schedule.startTime,
    endTime:schedule.endTime,
    breakMinutes:Number(schedule.breakMinutes) || 0,
    hourlyRate:Number(schedule.hourlyRate) || 0,
    store:item.store,
    heads:item.heads,
    status:['completed','billing','paying','paid'].includes(item.flowStatus) ? 'completed' : 'pending'
  }));
  const detailSummary = {
    workCount:workItems.length,
    totalHeads:workItems.reduce((sum, work) => sum + (Number(work.heads) || 0), 0),
    assignedHeads:(item.estimate?.supporters || []).length,
    totalPersonMinutes:workItems.reduce((sum, work) =>
      sum + ((utils.workMinutes(work) || 0) * (Number(work.heads) || 0)), 0
    ),
    workDays:new Set(workItems.map(work => work.date).filter(Boolean)).size
  };
  const canReject = !storedWorkflow && utils.hasPermission(role, 'reject') &&
    (!!item.rejectionRequest || utils.availableActions(item, role).length > 0) &&
    !['draft', 'rejected', 'cancelled'].includes(item.dataState);
  const canRequestReject = !storedWorkflow && utils.hasPermission(role, 'reject_request') &&
    !item.rejectionRequest && !['draft', 'rejected', 'cancelled'].includes(item.dataState);
  const canCancel = !storedWorkflow && utils.hasPermission(role, 'cancel') &&
    item.flowStatus === 'request' && ['draft', 'submitted', 'rejected'].includes(item.dataState);

  return (
    <Dialog open={open} onClose={onClose} fullWidth maxWidth="lg" PaperProps={{className:'dense-dialog', sx: {borderRadius: 1, height: '90vh', maxWidth: '95vw'}}}>
      <DialogTitle sx={{borderBottom:'1px solid', borderColor:'divider', py:1.5, px:3}}>
        <Box sx={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:1.5,minWidth:0}}>
          <Box sx={{display:'flex',alignItems:{xs:'flex-start',sm:'center'},flexDirection:{xs:'column',sm:'row'},gap:{xs:0.25,sm:2},minWidth:0,flex:1}}>
            <Typography variant="h6" fontWeight="600" noWrap sx={{maxWidth:'100%'}}>{item.title}</Typography>
            <Typography variant="body2" color="text.secondary" noWrap>案件ID: {item.caseNumber || item.id.toUpperCase()}</Typography>
          </Box>
          <IconButton onClick={onClose} size="small" aria-label="案件詳細を閉じる"><span className="material-icons">close</span></IconButton>
        </Box>
      </DialogTitle>
      
      <DialogContent sx={{p:3, overflow:'auto'}}>
        <Stack spacing={1.5}>
          {isServiceOwner && (
            <Alert severity="success" icon={<span className="material-icons">admin_panel_settings</span>}>
              <Typography variant="body2" fontWeight="600">運用保守モード</Typography>

              </Typography>
            </Alert>

          {/* 差し戻し警告 */}
          {item.rejectedAt && (

          {/* ステータス表示 */}
          <Box>
            <Stack direction="row" spacing={2}>

                color={storedWorkflow ? 'primary' : flowInfo?.color}

              <Chip

          {/* プログレスステップ */}

                      const subtotal = Number(s.lineAmount) || laborAmount + transport;
                      return (
                        <TableRow key={idx} hover>
                          <TableCell>{s.date}</TableCell>
                          <TableCell>{s.startTime}</TableCell>
                          <TableCell>{s.endTime}</TableCell>
                          <TableCell align="center">{utils.fmtClockMinutes(Number(s.breakMinutes) || 0)}</TableCell>
                          <TableCell align="center">{utils.fmtClockMinutes(workMinutes)}</TableCell>
                          <TableCell>{s.name}</TableCell>
                          <TableCell align="right">{utils.yen(hourlyRate)}</TableCell>
                          <TableCell align="right">{utils.yen(laborAmount)}</TableCell>
                          <TableCell align="right">{utils.yen(transport)}</TableCell>
                          <TableCell align="right" sx={{fontWeight:600}}>{utils.yen(subtotal)}</TableCell>
                        </TableRow>
                      );
                    })}
                  </TableBody>
                  <TableHead>
                    <TableRow sx={{bgcolor:'primary.light'}}>
                      <TableCell colSpan={9} align="right" sx={{fontWeight:600}}>見積金額（税抜）</TableCell>
                      <TableCell align="right" sx={{fontWeight:700}}>
                        {utils.yen(item.estimate.supporters.reduce((sum, s) => {
                          return sum + (Number(s.lineAmount) || utils.estimateLineAmount(s));
                        }, 0))}
                      </TableCell>
                    </TableRow>
                  </TableHead>
                </Table>
              </TableContainer>}
            </Box>
          )}
          </>}

          {/* 備考 */}
          {item.memo && (
            <Box>
              <Typography variant="subtitle1" fontWeight="600" sx={{mb:1}}>備考</Typography>
              <Box sx={{p:2, bgcolor:'grey.50', borderRadius:1}}>
                <Typography variant="body1">{item.memo}</Typography>
              </Box>
            </Box>
          )}
        </Stack>
      </DialogContent>
      
      <DialogActions sx={{px:3, py:2, borderTop:'1px solid', borderColor:'divider'}}>
        <Typography variant="caption" color="text.secondary">
          操作ユーザー: {currentAccount?.name}{isServiceOwner ? '（代理実行）' : ''}
        </Typography>
        {canCancel && <Button onClick={() => onAction(item.id, 'cancel')} color="error" size="medium">{isServiceOwner ? '代理: ' : ''}依頼を取消</Button>}
        {canRequestReject && <Button onClick={() => onAction(item.id, 'reject_request')} color="warning" variant="outlined" size="medium">{isServiceOwner ? '代理: ' : ''}差戻依頼</Button>}
        {canReject && <Button onClick={() => onAction(item.id, 'reject')} color="warning" size="medium">{isServiceOwner ? '代理: ' : ''}差し戻し</Button>}
        <Box flex={1}/>
        {canStartStoredWorkflow && (
          <Button onClick={() => onAction(item.id, 'start_workflow')} variant="contained" size="medium">
            {isServiceOwner ? '代理: ' : ''}申請する
          </Button>
        )}
        {executableStoredTask && (
          <Button onClick={() => onAction(item.id, 'complete_workflow_task')} variant="contained" color="success" size="medium">
            {isServiceOwner ? '代理: ' : ''}{executableStoredTask.label}を完了
          </Button>
        )}
        {availableActions.map(action => (
          <Button key={action.key} onClick={() => onAction(item.id, action.key)} variant="contained" size="medium">
            {isServiceOwner ? '代理: ' : ''}{action.label}
          </Button>
        ))}
      </DialogActions>
    </Dialog>
  );
}

/* ===== 新規案件ダイアログ ===== */
function RequestTextField({slotProps = {}, sx, ...props}) {
  return (
    <TextField
      {...props}
      variant="outlined"
      slotProps={{
        ...slotProps,
        inputLabel:{...(slotProps.inputLabel || {}), shrink:true}
      }}
      sx={sx}
    />
  );
}

const CREATE_WORK_VIEW_MODE_STORAGE_KEY = 'pj002:create-work-view-mode:v1';

function CreateDialog({open, onClose, onCreate, onSaveDraft, actor}) {
  const isMobile = useMediaQuery('(max-width:599.95px)');
  const emptyWork = () => ({
    id:'W-' + utils.randomId().toUpperCase(), title:'', date:'', startTime:'09:00',
    endTime:'18:00', workType:'other', breakMinutes:60, hourlyRate:1500,
    store:mockData.stores[0], partner:'', heads:1, status:'pending', memo:''
  });
  const [caseInfo, setCaseInfo] = useState({
    requestType:'labor_procurement', urgency:'medium', requestContent:'', desiredDate:'', contact:'',
    requestDestination:'',
    title:'', partnerCode:'P-'+utils.randInt(100,999), partner:mockData.partners[0],
    department:mockData.departments[0], caseStartDate:'', caseEndDate:'', memo:''
  });
  const [requestValues, setRequestValues] = useState({});
  const [workItems, setWorkItems] = useState([emptyWork()]);
  const [errors, setErrors] = useState({});
  const [workViewMode, setWorkViewMode] = useState(() => {
    try {
      const stored = window.localStorage.getItem(CREATE_WORK_VIEW_MODE_STORAGE_KEY);
      return stored === 'table' || stored === 'card' ? stored : null;
    } catch (error) {
      return null;
    }
  });
  const activeWorkViewMode = workViewMode || (isMobile ? 'card' : 'table');
  const lastRequestTypeByAudienceRef = useRef({
    internal:'price_change',
    external:'labor_procurement'
  });
  const requestDefinition = REQUEST_TYPE_DEFINITIONS[caseInfo.requestType] || REQUEST_TYPE_DEFINITIONS.labor_procurement;
  const requestAudience = requestAudienceOf(requestDefinition);
  const availableRequestTypes = Object.entries(REQUEST_TYPE_DEFINITIONS)
    .filter(([, definition]) => requestAudienceOf(definition) === requestAudience)
    .filter(([, definition]) => requestAudience !== 'internal' || !caseInfo.requestDestination || definition.destination === caseInfo.requestDestination);
  const isProcurement = requestDefinition.family === 'procurement';
  const resolvedWorkflowType = caseInfo.requestType === 'account_maintenance' && requestValues.externalOutsourcing === 'あり'
    ? 'internal_partner'
    : requestDefinition.workflowTemplate;
  const selectedWorkflow = WORKFLOW_TYPE_DEFINITIONS[resolvedWorkflowType] || WORKFLOW_TYPE_DEFINITIONS.labor_procurement;
  const visibleRequestFields = (requestDefinition.fields || []).filter(field => requestFieldVisible(field, requestValues));
  // 入力は1画面のまま、申請種別から決まる処理順だけを読み取り専用で俯瞰表示する。
  const flowPreviewSourceSteps = isProcurement
    ? FLOW_STATUSES.map(status => ({
        key:status.key,
        label:status.label,
        owner:status.route,
        mode:'serial'
      }))
    : (selectedWorkflow.steps || []);
  const flowPreviewSteps = flowPreviewSourceSteps.reduce((stages, step) => {
    if (!step.group) return [...stages, step];
    const groupKey = 'group-' + step.group;
    const groupedStage = stages.find(stage => stage.key === groupKey);
    if (!groupedStage) {
      return [...stages, {...step, key:groupKey, owner:'並列実行', mode:'parallel'}];
    }
    return stages.map(stage => stage.key === groupKey
      ? {...stage, label:stage.label + '／' + step.label}
      : stage
    );
  }, []);
  const createFormGridSx = {
    display:'grid',
    gridTemplateColumns:{
      xs:'minmax(0, 1fr)',
      sm:'repeat(2, minmax(0, 1fr))',
      lg:'repeat(12, minmax(0, 1fr))'
    },
    columnGap:1.5,
    rowGap:1.5,
    alignItems:'start',
    '& > *':{minWidth:0}
  };
  const requestFieldGridSx = field => {
    const defaultSpan = field.type === 'textarea' ? 8 : 4;
    const span = Math.min(12, Math.max(1, Number(field.grid) || defaultSpan));
    return {
      minWidth:0,
      gridColumn:{
        xs:'1 / -1',
        sm:span >= 8 ? '1 / -1' : 'span 1',
        lg:'span ' + span
      }
    };
  };
  const caseSummary = useMemo(() => workItems.reduce((summary, work) => {
    const heads = Math.max(0, Number(work.heads) || 0);
    const workMinutes = utils.workMinutes(work) || 0;
    const hourlyRate = Math.max(0, Number(work.hourlyRate) || 0);
    return {
      workCount:summary.workCount + 1,
      totalHeads:summary.totalHeads + heads,
      totalPersonMinutes:summary.totalPersonMinutes + (workMinutes * heads),
      estimatedLaborAmount:summary.estimatedLaborAmount +
        Math.round((workMinutes / 60) * hourlyRate * heads)
    };
  }, {
    workCount:0,
    totalHeads:0,
    totalPersonMinutes:0,
    estimatedLaborAmount:0
  }), [workItems]);
  const caseWorkDays = useMemo(
    () => new Set(workItems.map(work => work.date).filter(Boolean)).size,
    [workItems]
  );

  const addWork = () => setWorkItems(prev => [...prev, emptyWork()]);
  const removeWork = (idx) => {
    setWorkItems(prev => prev.filter((_,i) => i !== idx));
    setErrors(prev => Object.entries(prev).reduce((next, [key, value]) => {
      if (!/^\\d+$/.test(key)) {
        next[key] = value;
        return next;
      }
      const errorIndex = Number(key);
      if (errorIndex < idx) next[errorIndex] = value;
      if (errorIndex > idx) next[errorIndex - 1] = value;
      return next;
    }, {}));
  };
  const updateWork = (idx, patch) => {
    setWorkItems(prev => prev.map((work,i) => i===idx ? {...work,...patch} : work));
    if (errors[idx]) {
      setErrors(prev => {
        const newErrors = {...prev};
        delete newErrors[idx];
        return newErrors;
      });
    }
  };
  const changeWorkViewMode = mode => {
    setWorkViewMode(mode);
    try {
      window.localStorage.setItem(CREATE_WORK_VIEW_MODE_STORAGE_KEY, mode);
    } catch (error) {
      // 保存できない環境でも、このセッション中の表示切替は維持する。
    }
  };
  const changeRequestType = requestType => {
    const nextDefinition = REQUEST_TYPE_DEFINITIONS[requestType];
    if (!nextDefinition) return;
    lastRequestTypeByAudienceRef.current[requestAudienceOf(nextDefinition)] = requestType;
    setCaseInfo(prev => ({
      ...prev,
      requestType,
      requestDestination:requestAudienceOf(nextDefinition) === 'internal' ? prev.requestDestination : ''
    }));
    setRequestValues({});
    setErrors({});
  };
  const changeRequestAudience = audience => {
    if (audience === requestAudience) return;
    const rememberedType = lastRequestTypeByAudienceRef.current[audience];
    const nextType = REQUEST_TYPE_DEFINITIONS[rememberedType] &&
      requestAudienceOf(REQUEST_TYPE_DEFINITIONS[rememberedType]) === audience
      ? rememberedType
      : Object.entries(REQUEST_TYPE_DEFINITIONS)
          .find(([, definition]) => requestAudienceOf(definition) === audience)?.[0];
    if (nextType) changeRequestType(nextType);
  };
  const changeRequestDestination = requestDestination => {
    if (!requestDestination) {
      setCaseInfo(prev => ({...prev, requestDestination:''}));
      return;
    }
    const currentMatches = REQUEST_TYPE_DEFINITIONS[caseInfo.requestType]?.destination === requestDestination;
    const nextType = Object.entries(REQUEST_TYPE_DEFINITIONS)
      .find(([, definition]) => requestAudienceOf(definition) === 'internal' && definition.destination === requestDestination)?.[0];
    if (!nextType) return;
    const resolvedType = currentMatches ? caseInfo.requestType : nextType;
    lastRequestTypeByAudienceRef.current.internal = resolvedType;
    setCaseInfo(prev => ({...prev, requestDestination, requestType:resolvedType}));
    if (!currentMatches) {
      setRequestValues({});
      setErrors({});
    }
  };
  const updateRequestValue = (key, value) => {
    setRequestValues(prev => ({...prev, [key]:value}));
    setErrors(prev => {
      if (!prev.fields?.[key]) return prev;
      const fields = {...prev.fields};
      delete fields[key];
      return {...prev, fields};
    });
  };
  const updateAttachment = (key, fileList) => {
    updateRequestValue(key, Array.from(fileList || []).map(file => ({
      name:file.name, size:file.size, type:file.type, lastModified:file.lastModified
    })));
  };

  const validate = () => {
    const newErrors = {};
    const commonErrors = [];
    if (!caseInfo.title.trim()) commonErrors.push('依頼タイトルは必須です');
    if (isProcurement) {
      if (!caseInfo.caseStartDate || !caseInfo.caseEndDate) {
        commonErrors.push('案件開始日と案件終了日は必須です');
      } else if (caseInfo.caseStartDate > caseInfo.caseEndDate) {
        commonErrors.push('案件終了日は案件開始日以降にしてください');
      }
      workItems.forEach((work, idx) => {
        const rowErrors = [];
        if (!work.title.trim()) rowErrors.push('作業名は必須です');
        if (!work.date) rowErrors.push('実施日は必須です');
        if (!work.startTime) rowErrors.push('開始時刻は必須です');
        if (!work.endTime) rowErrors.push('終了時刻は必須です');
        if (work.startTime && work.endTime && work.startTime >= work.endTime) rowErrors.push('終了時刻は開始時刻より後にしてください');
        const breakMinutes = Number(work.breakMinutes);
        if (!Number.isFinite(breakMinutes) || breakMinutes < 0) rowErrors.push('休憩時間は0分以上で入力してください');
        const scheduledMinutes = work.startTime && work.endTime
          ? utils.timeToMinutes(work.endTime) - utils.timeToMinutes(work.startTime)
          : null;
        if (scheduledMinutes > 0 && breakMinutes >= scheduledMinutes) rowErrors.push('休憩時間は作業時間より短くしてください');
        if (!Number.isFinite(Number(work.hourlyRate)) || Number(work.hourlyRate) <= 0) rowErrors.push('時給は1円以上で入力してください');
        if (!work.store) rowErrors.push('対象拠点は必須です');
        if (!work.heads || work.heads < 1) rowErrors.push('人数は1名以上にしてください');
        if (work.date && caseInfo.caseStartDate && work.date < caseInfo.caseStartDate) rowErrors.push('実施日は案件開始日以降にしてください');
        if (work.date && caseInfo.caseEndDate && work.date > caseInfo.caseEndDate) rowErrors.push('実施日は案件終了日以前にしてください');
        if (rowErrors.length > 0) newErrors[idx] = rowErrors;
      });
    } else {
      if (!caseInfo.urgency) commonErrors.push('緊急度は必須です');
      if (!caseInfo.requestContent.trim()) commonErrors.push('依頼内容は必須です');
      if (!caseInfo.desiredDate) commonErrors.push('希望対応日は必須です');
      const fieldErrors = {};
      visibleRequestFields.forEach(field => {
        const value = requestValues[field.key];
        const empty = field.type === 'attachment'
          ? !Array.isArray(value) || value.length === 0
          : value === undefined || value === null || String(value).trim() === '';
        if (requestFieldRequired(field, requestValues) && empty) fieldErrors[field.key] = field.label + 'は必須です';
      });
      if (Object.keys(fieldErrors).length) newErrors.fields = fieldErrors;
    }
    if (commonErrors.length) newErrors.common = commonErrors;
    setErrors(newErrors);
    return Object.keys(newErrors).length === 0;
  };

  const canSave = isProcurement
    ? Boolean(caseInfo.title.trim() && caseInfo.caseStartDate && caseInfo.caseEndDate && workItems.length > 0)
    : Boolean(caseInfo.title.trim() && caseInfo.urgency && caseInfo.requestContent.trim() && caseInfo.desiredDate);
  const canSaveDraft = Boolean(
    caseInfo.title.trim() || caseInfo.memo.trim() || caseInfo.requestContent.trim() ||
    Object.values(requestValues).some(value => Array.isArray(value) ? value.length > 0 : String(value || '').trim()) ||
    (!isProcurement && caseInfo.desiredDate) ||
    (isProcurement &&
    workItems.some(work => work.title.trim() || work.date || work.memo.trim() ||
      work.startTime !== '09:00' || work.endTime !== '18:00' ||
      Number(work.breakMinutes) !== 60 || Number(work.hourlyRate) !== 1500 ||
      Number(work.heads) !== 1))
  );

  const buildPayload = (isDraft = false) => {
    const now = new Date().toISOString();
    const firstWork = workItems[0];
    const isGeneralWorkflow = selectedWorkflow.family === 'general';
    const sanitizedRequestValues = visibleRequestFields.reduce((values, field) => ({
      ...values,
      [field.key]:requestValues[field.key] ?? (field.type === 'attachment' ? [] : '')
    }), {});
    const normalizedWorks = isProcurement ? workItems.map(work => ({
      ...work,
      breakMinutes:Number(work.breakMinutes) || 0,
      hourlyRate:Number(work.hourlyRate) || 0
    })) : [];
    const commonRequestData = {
      urgency:caseInfo.urgency,
      applicant:actor?.name || '利用部 担当者',
      applicantDepartment:actor?.organization || caseInfo.department,
      requestDestination:requestAudience === 'internal' ? caseInfo.requestDestination : caseInfo.partner,
      requestContent:caseInfo.requestContent,
      desiredDate:caseInfo.desiredDate,
      contact:caseInfo.contact,
      attachments:requestValues.__commonAttachments || [],
      note:caseInfo.memo
    };
    return {
      id: utils.randomId(),
      caseNumber: makeCaseNumber(),
      title: caseInfo.title.trim(),
      requestType:caseInfo.requestType,
      requestAudience,
      requestDestination:requestAudience === 'internal' ? caseInfo.requestDestination : caseInfo.partner,
      requestTypeLabel:requestDefinition.label,
      formTemplate:requestDefinition.formTemplate,
      formDefinition:{
        version:1,
        label:requestDefinition.label,
        fields:(requestDefinition.fields || []).map(field => ({...field}))
      },
      requestData:{
        common:commonRequestData,
        fields:sanitizedRequestValues
      },
      partner: isProcurement ? caseInfo.partner : requestValues.targetPartner || requestValues.producer || '',
      partnerCode: isProcurement ? caseInfo.partnerCode : '',
      store: isProcurement ? firstWork?.store || '' : requestValues.applicationScope || requestValues.targetStores || '',
      caseStartDate: isProcurement ? caseInfo.caseStartDate : caseInfo.desiredDate,
      caseEndDate: isProcurement ? caseInfo.caseEndDate : caseInfo.desiredDate,
      schedules: isProcurement ? normalizedWorks.map(work => ({
        date:work.date, startTime:work.startTime, endTime:work.endTime,
        breakMinutes:Number(work.breakMinutes) || 0, hourlyRate:Number(work.hourlyRate) || 0
      })) : [],
      workItems:normalizedWorks,
      heads:isProcurement ? normalizedWorks.reduce((sum, work) => sum + (Number(work.heads) || 0), 0) : 0,
      department:isProcurement ? caseInfo.department : actor?.organization || caseInfo.department,
      category:caseInfo.requestType,
      content:isProcurement ? normalizedWorks.map(work => work.title).join('、') : caseInfo.requestContent.trim(),
      memo: caseInfo.memo,
      workflowType:resolvedWorkflowType,
      workflowDefinition:isGeneralWorkflow ? {
        type:resolvedWorkflowType,
        family:'general',
        label:selectedWorkflow.label,
        version:1,
        steps:selectedWorkflow.steps.map(step => ({...step}))
      } : null,
      workflowTasks:isGeneralWorkflow
        ? createWorkflowTaskInstances(resolvedWorkflowType, actor?.name || '利用部 担当者', !isDraft)
        : [],
      workflowCaseStatus:isGeneralWorkflow ? (isDraft ? '下書き' : '申請済') : null,
      flowStatus: 'request',
      dataState: isGeneralWorkflow && !isDraft ? 'submitted' : 'draft',
      createdAt: now,
      createdBy: actor?.name || '利用部 担当者',
      submittedAt: isGeneralWorkflow && !isDraft ? now : null,
      proposalAt: null,
      confirmedAt: null,
      completedAt: null,
      billingAt: null,
      paymentStartedAt: null,
      paidAt: null,
      accountingSystemStatus: 'not_linked',
      accountingSystemLinkedAt: null,
      estimate: null,
      rejectedAt: null,
      rejectedReason: '',
      rejectedBy: '',
      rejectedFrom: '',
      history: [{
        action:isDraft ? 'draft_save' : 'create',
        by:actor?.name || '利用部 担当者',
        at:now,
        ...buildActionAudit(actor, 'create')
      }]
    };
  };

  const resetForm = () => {
    setCaseInfo({
      requestType:'labor_procurement', urgency:'medium', requestContent:'', desiredDate:'', contact:'',
      requestDestination:'',
      title:'', partnerCode:'P-'+utils.randInt(100,999), partner:mockData.partners[0],
      department:mockData.departments[0], caseStartDate:'', caseEndDate:'', memo:''
    });
    setRequestValues({});
    setWorkItems([emptyWork()]);
    setErrors({});
  };

  const save = async () => {
    if (!validate()) return;
    await onCreate(buildPayload(false));
    resetForm();
  };

  const saveDraft = async () => {
    if (!canSaveDraft || !onSaveDraft) return;
    await onSaveDraft(buildPayload(true));
    resetForm();
  };
  const close = () => {
    resetForm();
    onClose();
  };
  const renderRequestField = field => {
    const required = requestFieldRequired(field, requestValues);
    const value = requestValues[field.key] ?? '';
    const error = errors.fields?.[field.key];
    if (field.type === 'attachment') {
      const files = Array.isArray(value) ? value : [];
      return (
        <Box key={field.key} sx={requestFieldGridSx(field)}>
          <Button component="label" nativeButton={false} variant="outlined" fullWidth color={error ? 'error' : 'primary'} startIcon={<span className="material-icons">attach_file</span>}>
            {field.label}{required ? ' *' : ''}
            <input hidden type="file" multiple onChange={event=>updateAttachment(field.key, event.target.files)}/>
          </Button>
          <Typography variant="caption" color={error ? 'error' : 'text.secondary'} sx={{display:'block',mt:0.4}}>
            {error || (files.length ? files.map(file => file.name).join('、') : '未選択')}
          </Typography>
        </Box>
      );
    }
    if (field.type === 'select') {
      return (
        <Box key={field.key} sx={requestFieldGridSx(field)}>
          <RequestTextField
            select fullWidth size="small" variant="outlined"
            required={required}
            label={field.label}
            value={value}
            onChange={event=>updateRequestValue(field.key,event.target.value)}
            error={Boolean(error)}
            helperText={error || ''}
          >
            {(field.options || []).map(option => <MenuItem key={option} value={option}>{option}</MenuItem>)}
          </RequestTextField>
        </Box>
      );
    }
    return (
      <Box key={field.key} sx={requestFieldGridSx(field)}>
        <RequestTextField
          fullWidth size="small" required={required} label={field.label}
          type={field.type === 'textarea' ? 'text' : field.type}
          value={value}
          onChange={event=>updateRequestValue(field.key,event.target.value)}
          multiline={field.type === 'textarea'} minRows={field.type === 'textarea' ? 2 : undefined}
          slotProps={field.type === 'date' || field.type === 'datetime-local'
            ? {inputLabel:{shrink:true}}
            : undefined}
          error={Boolean(error)} helperText={error || ''}
        />
      </Box>
    );
  };

  return (
    <Dialog
      open={open}
      onClose={close}
      fullWidth
      fullScreen={isMobile}
      maxWidth="xl"
      scroll="paper"
      PaperProps={{
        className:'dense-dialog create-dialog',
        sx:{
          borderRadius:{xs:0, sm:1},
          width:{xs:'100%', sm:'calc(100vw - 24px)'},
          height:{xs:'100dvh', sm:'92vh'},
          maxHeight:{xs:'100dvh', sm:'92vh'},
          maxWidth:{xs:'100vw', sm:'calc(100vw - 24px)'},
          m:{xs:0, sm:1.5},
          overflow:'hidden'
        }
      }}
    >
      <DialogTitle sx={{borderBottom:'1px solid', borderColor:'divider', py:1.5, px:3, flexShrink:0}}>
        <Stack direction="row" justifyContent="space-between" alignItems="center" spacing={2}>
          <Box>
            <Typography variant="h6" fontWeight="600">新規依頼</Typography>
          </Box>
          <IconButton onClick={close} size="small"><span className="material-icons">close</span></IconButton>
        </Stack>
      </DialogTitle>
      
      <DialogContent sx={{p:3, display:'flex', flexDirection:'column', minHeight:0, overflowY:'auto', overflowX:'hidden', overscrollBehavior:'contain', WebkitOverflowScrolling:'touch'}}>
        {/* 申請設定：申請先区分、社内申請先、申請種別の順で対象を絞り込む */}
        <Paper variant="outlined" sx={{p:1.25, mb:1.25, flexShrink:0}}>
          <Typography variant="subtitle2" fontWeight="700" sx={{mb:1}}>申請設定</Typography>
          <Box sx={{
            display:'grid',
            gridTemplateColumns:{
              xs:'minmax(0, 1fr)',
              md:requestAudience === 'internal'
