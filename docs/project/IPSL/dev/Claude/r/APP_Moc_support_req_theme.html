                    <Typography variant="caption" color="error" sx={{display:'block', mt:1}}>
                      {workErrors.join('、')}
                    </Typography>
                  )}
                </Paper>
              );
            })}
          </Box>
          )}
        </Box>}
        
        {/* エラー表示 */}
        {Object.keys(errors).length > 0 && (
          <Alert severity="error" sx={{mt:2}}>
            {(errors.common || []).map((message,index) => <Typography key={'common-'+index} variant="caption" display="block">{message}</Typography>)}
            {Object.entries(errors.fields || {}).map(([key,message]) => <Typography key={key} variant="caption" display="block">{message}</Typography>)}
            {Object.entries(errors).filter(([key]) => /^\\d+$/.test(key)).map(([key,messages]) => (
              <Typography key={key} variant="caption" display="block">作業{Number(key)+1}: {messages.join(', ')}</Typography>
            ))}
          </Alert>
        )}
      </DialogContent>
      
      <DialogActions sx={{
        px:3,
        py:2,
        borderTop:'1px solid',
        borderColor:'divider',
        flexShrink:0,
        display:'grid',
        gridTemplateColumns:{xs:'repeat(2, minmax(0, 1fr))', sm:'minmax(0, 1fr) auto auto auto'},
        gap:1,
        '& > :not(style) ~ :not(style)':{ml:0}
      }}>
        <Typography variant="body1" color="text.secondary" sx={{minWidth:0, display:{xs:'none', sm:'block'}}}>
          {isProcurement
            ? '1案件・' + workItems.length + '作業を作成'
            : selectedWorkflow.label + '・' + (selectedWorkflow.steps || []).length + '工程を自動生成'}
        </Typography>
        <Button onClick={close} size="medium" sx={{width:{xs:'100%', sm:'auto'}}}>キャンセル</Button>
        <Button onClick={saveDraft} variant="outlined" size="medium" disabled={!canSaveDraft} sx={{width:{xs:'100%', sm:'auto'}}}>下書き保存</Button>
        <Button onClick={save} variant="contained" size="medium" disabled={!canSave} sx={{gridColumn:{xs:'1 / -1', sm:'auto'}, width:{xs:'100%', sm:'auto'}}}>{isProcurement ? '案件を作成' : '申請する'}</Button>
      </DialogActions>
    </Dialog>
  );
}

/* ===== 見積もりダイアログ ===== */
function EstimateDialog({open, onClose, item, onSubmit, onAction, canDirectReject}) {
  const [note, setNote] = useState('');
  const [agree, setAgree] = useState(false);
  const [supporters, setSupporters] = useState([]);
  const [errors, setErrors] = useState({});
  const estimateWorks = useMemo(() => {
    if (item?.workItems?.length) return item.workItems;
    return (item?.schedules || []).map((schedule, index) => ({
      ...schedule,
      id:'W-' + (index + 1),
      title:item?.content || '作業',
      heads:1
    }));
  }, [item]);

  useEffect(() => {
    if (!item) return;
    if (item.estimate?.supporters?.length) {
      setSupporters(item.estimate.supporters.map((row, index) => {
        const sourceWork = estimateWorks.find(work =>
          work.id === row.workId ||
          (work.date === row.date && work.startTime === row.startTime && work.endTime === row.endTime)
        ) || estimateWorks[index] || estimateWorks[0] || {};
        return {
          ...row,
          workId:row.workId || sourceWork.id || 'W-' + (index + 1),
          workTitle:row.workTitle || sourceWork.title || item.content || '作業',
          breakMinutes:Number(row.breakMinutes ?? sourceWork.breakMinutes) || 0,
          hourlyRate:Number(sourceWork.hourlyRate ?? row.hourlyRate) || 0,
          transport:Number(row.transport) || 0
        };
      }));
    } else {
      const rows = [];
      estimateWorks.forEach((work, workIndex) => {
        const rowCount = Math.max(1, Number(work.heads) || 1);
        for (let i = 0; i < rowCount; i++) {
          rows.push({
            workId:work.id || 'W-' + (workIndex + 1),
            workTitle:work.title || item.content || '作業',
            date:work.date,
            startTime:work.startTime,
            endTime:work.endTime,
            breakMinutes:Number(work.breakMinutes) || 0,
            name:'',
            hourlyRate:Number(work.hourlyRate) || 0,
            transport:0,
            email:'',
            phone:''
          });
        }
      });
      setSupporters(rows);
    }
    setNote(item.estimate?.note || '');
    setAgree(false);
    setErrors({});
  }, [item, estimateWorks]);

  const amount = useMemo(
    () => supporters.reduce((sum, supporter) => sum + utils.estimateLineAmount(supporter), 0),
    [supporters]
  );
  const estimateSummary = useMemo(() => ({
    workCount:item?.workItems?.length || new Set(supporters.map(row => row.workId).filter(Boolean)).size,
    totalHeads:supporters.length,
    totalPersonMinutes:supporters.reduce((sum, row) => sum + (utils.workMinutes(row) || 0), 0),
    workDays:new Set(supporters.map(row => row.date).filter(Boolean)).size
  }), [item, supporters]);

  const addRow = () => {
    const work = estimateWorks[0] || {};
    setSupporters(prev => [...prev, {
      workId:work.id || 'W-1',
      workTitle:work.title || item?.content || '作業',
      date:work.date || '',
      startTime:work.startTime || '09:00',
      endTime:work.endTime || '18:00',
      breakMinutes:Number(work.breakMinutes) || 0,
      name:'',
      hourlyRate:Number(work.hourlyRate) || 0,
      transport:0
    }]);
  };
  const removeRow = (idx) => setSupporters(prev => prev.filter((_,i)=>i!==idx));
  const updateRow = (idx, patch) => {
    setSupporters(prev => prev.map((r,i)=> i===idx ? {...r, ...patch} : r));
    // エラーをクリア
    if (errors['supporter_' + idx]) {
      setErrors(prev => {
        const newErrors = {...prev};
        delete newErrors['supporter_' + idx];
        delete newErrors.amount;
        return newErrors;
      });
    }
  };
  const selectWork = (idx, workId) => {
    const work = estimateWorks.find(candidate => candidate.id === workId);
    if (!work) return;
    updateRow(idx, {
      workId:work.id,
      workTitle:work.title || item?.content || '作業',
      date:work.date,
      startTime:work.startTime,
      endTime:work.endTime,
      breakMinutes:Number(work.breakMinutes) || 0,
      hourlyRate:Number(work.hourlyRate) || 0
    });
  };

  const validateForm = () => {
    const newErrors = {};

    supporters.forEach((s, idx) => {
      const supporterErrors = [];
      if (!s.date) supporterErrors.push('日付は必須です');
      if (!s.startTime) supporterErrors.push('開始時刻は必須です');
      if (!s.endTime) supporterErrors.push('終了時刻は必須です');
      if (s.startTime && s.endTime && s.startTime >= s.endTime) {
        supporterErrors.push('終了時刻は開始時刻より後にしてください');
      }
      if (utils.workMinutes(s) === 0) supporterErrors.push('休憩控除後の実働時間が必要です');
      if (!s.name.trim()) supporterErrors.push('氏名は必須です');
      if (!Number.isFinite(Number(s.hourlyRate)) || Number(s.hourlyRate) <= 0) {
        supporterErrors.push('依頼作成時の時給が設定されていません');
      }
      if (!Number.isFinite(Number(s.transport)) || Number(s.transport) < 0) {
        supporterErrors.push('交通費は0円以上で入力してください');
      }
      
      if (supporterErrors.length > 0) {
        newErrors['supporter_' + idx] = supporterErrors;
      }
    });
    
    if (!agree) {
      newErrors.agree = '取引先応援に伴う同意事項の確認が必要です';
    }
    if (amount <= 0) newErrors.amount = '明細の時給・実働時間・交通費を確認してください';
    
    setErrors(newErrors);
    return Object.keys(newErrors).length === 0;
  };

  const ok = amount > 0 && supporters.length > 0 && supporters.every(s =>
    s.date && s.startTime && s.endTime && s.name.trim() &&
    utils.workMinutes(s) > 0 && Number(s.hourlyRate) > 0 && Number(s.transport) >= 0
  ) && agree;

  const submit = () => {
    if (!validateForm()) return;
    const calculatedSupporters = supporters.map(supporter => {
      const workMinutes = utils.workMinutes(supporter) || 0;
      const laborAmount = Math.round((workMinutes / 60) * (Number(supporter.hourlyRate) || 0));
      const transport = Number(supporter.transport) || 0;
      return {
        ...supporter,
        breakMinutes:Number(supporter.breakMinutes) || 0,
        hourlyRate:Number(supporter.hourlyRate) || 0,
        transport,
        workMinutes,
        laborAmount,
        lineAmount:laborAmount + transport
      };
    });
    onSubmit({amount, note, supporters:calculatedSupporters});
  };

  return (
    <Dialog open={open} onClose={onClose} fullWidth maxWidth="xl" PaperProps={{className:'dense-dialog', sx: {borderRadius: 1, height: '90vh'}}}>
      <DialogTitle sx={{borderBottom:'1px solid', borderColor:'divider', py:2, px:3}}>
        <Stack direction="row" justifyContent="space-between" alignItems="center">
          <Typography variant="h6" fontWeight="600">見積もり登録 - {item?.title}</Typography>
          <IconButton onClick={onClose} size="small"><span className="material-icons">close</span></IconButton>
        </Stack>
      </DialogTitle>
      
      <DialogContent sx={{p:3, overflow:'auto'}}>
        {/* 取引先応援に伴う同意事項 */}
        <Alert severity="warning" sx={{mb:3}}>
          <Typography variant="body1" fontWeight="600">取引先応援に伴う同意事項</Typography>
          <Typography variant="body2">作業内容・日程・必要人数・時給・交通費などの条件を確認し、記載内容に基づいて応援作業を実施することに同意してください。</Typography>
        </Alert>

        {/* 作業時間サマリー */}
        <Box sx={{
          mb:2, p:1.25, border:'1px solid', borderColor:'divider', borderRadius:1,
          display:'grid', gridTemplateColumns:{xs:'repeat(2, 1fr)', md:'repeat(4, 1fr)'}, gap:1
        }}>
          {[
            ['作業数', estimateSummary.workCount + '件'],
            ['必要人数', estimateSummary.totalHeads + '名'],
            ['延べ実働', utils.fmtClockMinutes(estimateSummary.totalPersonMinutes)],
            ['稼働日数', estimateSummary.workDays + '日']
          ].map(([label, value]) => (
            <Box key={label} sx={{px:1, py:0.5, bgcolor:'grey.50', borderRadius:1}}>
              <Typography variant="caption" color="text.secondary">{label}</Typography>
              <Typography variant="subtitle2" fontWeight="700">{value}</Typography>
            </Box>
          ))}
        </Box>

        {/* 見積情報 */}
        <Stack spacing={1.5} sx={{mb:2}}>
          <Typography variant="h6" fontWeight="600">見積情報</Typography>
          <Stack direction="row" spacing={2}>
            <TextField 
              label="見積金額（税抜）" 
              value={utils.yen(amount)}
              size="small"
              error={!!errors.amount}
              helperText={errors.amount || '各行の「実働×時給＋交通費」の合計'}
              InputProps={{readOnly:true}}
              sx={{width:230}}
            />
            <TextField 
              label="備考" 
              value={note} 
              onChange={e=>setNote(e.target.value)} 
              size="medium"
              fullWidth
              placeholder="例：2名×4時間、交通費込み"
            />
          </Stack>
        </Stack>
        
        {/* 作業者リスト */}
        <Box sx={{mb:3}}>
          <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{mb:2}}>
            <Typography variant="h6" fontWeight="600">作業者リスト</Typography>
            <Button onClick={addRow} size="medium" variant="outlined" startIcon={<span className="material-icons" style={{fontSize:18}}>add</span>}>
              作業者追加
            </Button>
          </Stack>
          
          {supporters.length === 0 ? (
            <Typography variant="body1" color="text.secondary" sx={{p:4, textAlign:'center', bgcolor:'grey.50', borderRadius:1}}>
              作業者を追加してください
            </Typography>
          ) : (
            <TableContainer sx={{border:'1px solid', borderColor:'divider', borderRadius:1, maxHeight:430, overflowX:'auto'}}>
              <Table size="small" className="dense-table estimate-supporters-table" sx={{minWidth:1320}}>
                <TableHead>
                  <TableRow sx={{bgcolor:'grey.50'}}>
                    <TableCell sx={{minWidth:120}}>作業</TableCell>
                    <TableCell sx={{minWidth:130}}>実施日</TableCell>
                    <TableCell sx={{minWidth:95}}>開始</TableCell>
                    <TableCell sx={{minWidth:95}}>終了</TableCell>
                    <TableCell sx={{minWidth:75}}>休憩</TableCell>
                    <TableCell sx={{minWidth:75}}>実働</TableCell>
                    <TableCell sx={{minWidth:130}}>氏名</TableCell>
                    <TableCell sx={{minWidth:180}}>メール</TableCell>
                    <TableCell sx={{minWidth:130}}>電話</TableCell>
                    <TableCell align="right" sx={{minWidth:85}}>時給</TableCell>
                    <TableCell sx={{minWidth:105}}>交通費</TableCell>
                    <TableCell align="right" sx={{minWidth:95}}>行小計</TableCell>
                    <TableCell sx={{width:48}}></TableCell>
                  </TableRow>
                </TableHead>
                <TableBody>
                  {supporters.map((s, idx) => (
                    <TableRow key={idx} sx={{bgcolor: errors['supporter_' + idx] ? 'error.light' : 'inherit'}}>
                      <TableCell>
                        <Select
                          size="small"
                          fullWidth
                          value={s.workId || ''}
                          onChange={e=>selectWork(idx, e.target.value)}
                        >
                          {estimateWorks.map((work, workIndex) => (
                            <MenuItem key={work.id || workIndex} value={work.id || 'W-' + (workIndex + 1)}>
                              {work.title || item?.content || '作業'}
                            </MenuItem>
                          ))}
                        </Select>
                      </TableCell>
                      <TableCell>
                        <TextField type="date" size="small" fullWidth InputLabelProps={{shrink:true}} 
                          value={s.date} onChange={e=>updateRow(idx,{date:e.target.value})}
                          error={errors['supporter_' + idx]?.some(e => e.includes('日付'))}/>
                      </TableCell>
                      <TableCell>
                        <TextField type="time" size="small" fullWidth InputLabelProps={{shrink:true}} 
                          value={s.startTime} onChange={e=>updateRow(idx,{startTime:e.target.value})}
                          error={errors['supporter_' + idx]?.some(e => e.includes('開始'))}/>
                      </TableCell>
                      <TableCell>
                        <TextField type="time" size="small" fullWidth InputLabelProps={{shrink:true}} 
                          value={s.endTime} onChange={e=>updateRow(idx,{endTime:e.target.value})}
                          error={errors['supporter_' + idx]?.some(e => e.includes('終了'))}/>
                      </TableCell>
                      <TableCell sx={{textAlign:'center', whiteSpace:'nowrap'}}>
                        {utils.fmtClockMinutes(Number(s.breakMinutes) || 0)}
                      </TableCell>
                      <TableCell sx={{textAlign:'center', whiteSpace:'nowrap', fontWeight:600}}>
                        {utils.fmtClockMinutes(utils.workMinutes(s))}
                      </TableCell>
                      <TableCell>
                        <TextField size="small" fullWidth placeholder="山田太郎"
                          value={s.name} onChange={e=>updateRow(idx,{name:e.target.value})}
                          error={errors['supporter_' + idx]?.some(e => e.includes('氏名'))}/>
                      </TableCell>
                      <TableCell>
                        <TextField size="small" fullWidth type="email" placeholder="メール（任意）"
                          value={s.email || ''} onChange={e=>updateRow(idx,{email:e.target.value})}/>
                      </TableCell>
                      <TableCell>
                        <TextField size="small" fullWidth placeholder="電話（任意）"
                          value={s.phone || ''} onChange={e=>updateRow(idx,{phone:e.target.value})}/>
                      </TableCell>
                      <TableCell align="right" sx={{fontWeight:600, whiteSpace:'nowrap'}}>
                        {utils.yen(Number(s.hourlyRate) || 0)}
                      </TableCell>
                      <TableCell>
                        <TextField type="number" size="small" fullWidth placeholder="0"
                          value={s.transport} onChange={e=>updateRow(idx,{transport:e.target.value.replace(/[^\\d]/g,'')})}
                          inputProps={{min:0, step:10, style:{textAlign:'right'}}}
                          InputProps={{startAdornment: <Typography sx={{mr:0.5, fontSize:'0.75rem'}}>¥</Typography>}}/>
                      </TableCell>
                      <TableCell align="right" sx={{fontWeight:700, whiteSpace:'nowrap'}}>
                        {utils.yen(utils.estimateLineAmount(s))}
                      </TableCell>
                      <TableCell>
                        <IconButton size="small" color="error" onClick={()=>removeRow(idx)}>
                          <span className="material-icons" style={{fontSize:16}}>delete</span>
                        </IconButton>
                      </TableCell>
                    </TableRow>
                  ))}
                </TableBody>
                <TableHead>
                  <TableRow sx={{bgcolor:'primary.light'}}>
                    <TableCell colSpan={11} align="right" sx={{fontWeight:700}}>見積金額（税抜）</TableCell>
                    <TableCell align="right" sx={{fontWeight:800, whiteSpace:'nowrap'}}>{utils.yen(amount)}</TableCell>
                    <TableCell/>
                  </TableRow>
                </TableHead>
              </Table>
            </TableContainer>
          )}
        </Box>

        {/* 同意チェック */}
        <Box sx={{mt:4, p:3, bgcolor:'grey.50', borderRadius:1}}>
          <FormControlLabel
            control={<Checkbox checked={agree} onChange={e=>setAgree(e.target.checked)} size="medium"/>}
            label={<Typography variant="body1">取引先応援に伴う同意事項を確認し、同意のうえ回答を登録します</Typography>}
          />
          {errors.agree && <Typography variant="body2" color="error" sx={{mt:1}}>{errors.agree}</Typography>}
        </Box>
      </DialogContent>
      
      <DialogActions sx={{px:3, py:2, borderTop:'1px solid', borderColor:'divider'}}>
        <Button onClick={onClose} size="medium">キャンセル</Button>
        {item && <Button color="warning" variant="outlined" size="medium" onClick={()=>onAction(item.id, (canDirectReject || item.rejectionRequest) ? 'reject' : 'reject_request')}>
          {(canDirectReject || item.rejectionRequest) ? '差し戻し' : '差戻依頼'}
        </Button>}
        <Button variant="contained" disabled={!ok} onClick={submit} size="medium">見積もり提出</Button>
      </DialogActions>
    </Dialog>
  );
}

/* ===== 実施報告ダイアログ ===== */
function ReportDialogV2({open, onClose, item, onSubmit}) {
  const [rows, setRows] = useState([]), [reason, setReason] = useState(''), [errors, setErrors] = useState({});
  useEffect(() => {
    if (!item) return;
    const works = item.workItems?.length ? item.workItems : (item.schedules || []).map((s,i)=>({id:'W-'+(i+1), title:item.content || '作業', ...s, heads:item.heads}));
    const supporters = item.estimate?.supporters || [], next=[];
    works.forEach(work => { const people=supporters.filter(p=>!p.workId || p.workId===work.id), count=people.length || Math.max(1,Number(work.heads)||1); for(let i=0;i<count;i++){const p=people[i]||{}; const validTime=value=>/^\d{1,2}:\d{2}$/.test(String(value||'')) ? value : ''; next.push({workId:work.id,workTitle:work.title||'作業',plannedDate:work.date||'',plannedStartTime:validTime(work.startTime)||'09:00',plannedEndTime:validTime(work.endTime)||'18:00',plannedBreakMinutes:Number(work.breakMinutes)||0,plannedTransport:Number(p.transport)||0,date:p.date||work.date||'',startTime:validTime(p.startTime)||validTime(work.startTime)||'09:00',endTime:validTime(p.endTime)||validTime(work.endTime)||'18:00',breakMinutes:Number(p.breakMinutes ?? work.breakMinutes)||0,name:p.name||'',hourlyRate:Number(p.hourlyRate||work.hourlyRate)||0,transport:Number(p.transport)||0,memo:''});}});
    setRows(next); setReason(''); setErrors({});
  }, [item]);
  const updateRow=(index,patch)=>{setRows(prev=>prev.map((r,i)=>i===index?{...r,...patch}:r));setErrors(prev=>{const n={...prev};delete n[index];delete n.reason;return n;});};
  const addPerson=()=>{const base=rows[rows.length-1];if(base)setRows(prev=>[...prev,{...base,name:'',transport:0,memo:''}]);};
  const changed=rows.some(r=>r.date!==r.plannedDate||r.startTime!==r.plannedStartTime||r.endTime!==r.plannedEndTime||Number(r.breakMinutes)!==Number(r.plannedBreakMinutes)||Number(r.transport)!==Number(r.plannedTransport||0));
  const totalActualMinutes=rows.reduce((s,r)=>s+(utils.workMinutes(r)||0),0);
  const validate=()=>{const n={};rows.forEach((r,i)=>{const m=[];if(!r.name.trim())m.push('作業者名を入力してください');if(!r.date)m.push('実績日を入力してください');if(utils.workMinutes(r)===null||utils.workMinutes(r)<=0)m.push('実績時間を正しく入力してください');if(Number(r.transport)<0)m.push('交通費は0以上で入力してください');if(m.length)n[i]=m;});if(changed&&!reason.trim())n.reason=['予定から変更した理由を入力してください'];setErrors(n);return !Object.keys(n).length;};
  const submit=mode=>{if(!validate())return;onSubmit({mode,changed,reason:reason.trim(),totalActualMinutes,plannedWorkItems:item?.workItems||item?.schedules||[],actualWorkItems:rows.map(r=>({workId:r.workId,title:r.workTitle,date:r.date,startTime:r.startTime,endTime:r.endTime,breakMinutes:Number(r.breakMinutes)||0,workMinutes:utils.workMinutes(r),name:r.name.trim(),hourlyRate:Number(r.hourlyRate)||0,transport:Number(r.transport)||0,heads:1,memo:r.memo}))});};
  return <Dialog open={open} onClose={onClose} fullWidth maxWidth="xl" PaperProps={{className:'dense-dialog',sx:{borderRadius:1,height:'88vh'}}}><DialogTitle sx={{borderBottom:'1px solid',borderColor:'divider',py:1.5,px:3}}><Stack direction="row" justifyContent="space-between" alignItems="center"><Box><Typography variant="h6" fontWeight="600">作業完了報告 - {item?.title}</Typography><Typography variant="caption" color="text.secondary">作業者ごとの実績時間・交通費を確認、訂正して報告します</Typography></Box><IconButton onClick={onClose} size="small"><span className="material-icons">close</span></IconButton></Stack></DialogTitle><DialogContent sx={{p:2,overflow:'auto'}}><Box sx={{mb:1.5,p:1.25,border:'1px solid',borderColor:'divider',borderRadius:1,display:'grid',gridTemplateColumns:{xs:'repeat(2,1fr)',md:'repeat(3,1fr)'},gap:1}}><Box><Typography variant="caption" color="text.secondary">作業数</Typography><Typography variant="subtitle2" fontWeight="700">{new Set(rows.map(r=>r.workId)).size}件</Typography></Box><Box><Typography variant="caption" color="text.secondary">実施人数</Typography><Typography variant="subtitle2" fontWeight="700">{rows.length}名</Typography></Box><Box><Typography variant="caption" color="text.secondary">実績延べ実働</Typography><Typography variant="subtitle2" fontWeight="700">{utils.fmtClockMinutes(totalActualMinutes)}</Typography></Box></Box><TableContainer sx={{border:'1px solid',borderColor:'divider',borderRadius:1}}><Table size="small" className="dense-table"><TableHead><TableRow sx={{bgcolor:'grey.50'}}><TableCell>作業（予定）</TableCell><TableCell>作業者名*</TableCell><TableCell>実績日</TableCell><TableCell>開始</TableCell><TableCell>終了</TableCell><TableCell>休憩(分)</TableCell><TableCell>実働</TableCell><TableCell>交通費</TableCell><TableCell>メモ</TableCell></TableRow></TableHead><TableBody>{rows.map((r,i)=><TableRow key={r.workId+'-'+i} sx={{bgcolor:errors[i]?'error.light':'inherit'}}><TableCell><Typography variant="caption" fontWeight="600">{r.workTitle}</Typography><Typography variant="caption" display="block" color="text.secondary">予定 {r.plannedDate||'—'} {r.plannedStartTime}–{r.plannedEndTime} / 休憩 {r.plannedBreakMinutes}分</Typography></TableCell><TableCell><TextField required size="small" value={r.name} onChange={e=>updateRow(i,{name:e.target.value})} placeholder="氏名"/></TableCell><TableCell><TextField type="date" size="small" value={r.date} onChange={e=>updateRow(i,{date:e.target.value})}/></TableCell><TableCell><TextField type="time" size="small" value={r.startTime} onChange={e=>updateRow(i,{startTime:e.target.value})}/></TableCell><TableCell><TextField type="time" size="small" value={r.endTime} onChange={e=>updateRow(i,{endTime:e.target.value})}/></TableCell><TableCell><TextField type="number" size="small" value={r.breakMinutes} onChange={e=>updateRow(i,{breakMinutes:Math.max(0,Number(e.target.value)||0)})} inputProps={{min:0,step:15}}/></TableCell><TableCell sx={{whiteSpace:'nowrap',fontWeight:600}}>{utils.fmtClockMinutes(utils.workMinutes(r))}</TableCell><TableCell><TextField type="number" size="small" value={r.transport} onChange={e=>updateRow(i,{transport:Math.max(0,Number(e.target.value)||0)})} inputProps={{min:0,step:1}}/></TableCell><TableCell><TextField size="small" value={r.memo} onChange={e=>updateRow(i,{memo:e.target.value})} placeholder="実績メモ"/></TableCell></TableRow>)}</TableBody></Table></TableContainer><Button size="small" sx={{mt:1}} onClick={addPerson} startIcon={<span className="material-icons">person_add</span>}>作業者を追加</Button>{changed&&<TextField fullWidth size="small" label="変更理由*" value={reason} onChange={e=>setReason(e.target.value)} error={!!errors.reason} helperText={errors.reason?.[0]||'予定から変更した理由を入力してください'} sx={{mt:1.5}}/>}</DialogContent><DialogActions sx={{px:2,py:1,borderTop:'1px solid',borderColor:'divider'}}><Button onClick={onClose} size="small">キャンセル</Button><Box flex={1}/><Button variant="outlined" size="small" onClick={()=>submit('as_planned')} disabled={!rows.length||changed}>予定どおり報告</Button><Button variant="contained" size="small" onClick={()=>submit('adjusted')} disabled={!rows.length}>実績を修正して報告</Button></DialogActions></Dialog>;
}

function ReportDialog({open, onClose, item, onSubmit}) {
  const [rows, setRows] = useState([]);
  const [reason, setReason] = useState('');
  const [errors, setErrors] = useState({});

  useEffect(() => {
    if (!item) return;
    const sourceWorks = item.workItems?.length ? item.workItems : (item.schedules || []).map((schedule, index) => ({
      id:'W-' + (index + 1), title:item.content || '作業', ...schedule, heads:item.heads
    }));
    setRows(sourceWorks.map(work => ({
      workId:work.id,
      workTitle:work.title || '作業',
      plannedDate:work.date || '',
      plannedStartTime:work.startTime || '09:00',
      plannedEndTime:work.endTime || '18:00',
      plannedBreakMinutes:Number(work.breakMinutes) || 0,
      plannedHeads:Number(work.heads) || 1,
      date:work.date || '',
      startTime:work.startTime || '09:00',
      endTime:work.endTime || '18:00',
      breakMinutes:Number(work.breakMinutes) || 0,
      heads:Number(work.heads) || 1,
      memo:''
    })));
    setReason('');
    setErrors({});
  }, [item]);

  const updateRow = (index, patch) => {
    setRows(prev => prev.map((row, rowIndex) => rowIndex === index ? {...row, ...patch} : row));
    setErrors(prev => {
      const next = {...prev};
      delete next[index];
      delete next.reason;
      return next;
    });
  };

  const changed = rows.some(row =>
    row.date !== row.plannedDate ||
    row.startTime !== row.plannedStartTime ||
    row.endTime !== row.plannedEndTime ||
    Number(row.breakMinutes) !== Number(row.plannedBreakMinutes) ||
    Number(row.heads) !== Number(row.plannedHeads)
  );
  const totalActualMinutes = rows.reduce((sum, row) =>
    sum + ((utils.workMinutes(row) || 0) * (Number(row.heads) || 0)), 0
  );

  const validate = () => {
    const nextErrors = {};
    rows.forEach((row, index) => {
      const rowErrors = [];
      if (!row.date) rowErrors.push('実施日は必須です');
      if (!row.startTime || !row.endTime || utils.workMinutes(row) === null) {
        rowErrors.push('開始・終了時刻を正しく入力してください');
      } else if (utils.workMinutes(row) <= 0) {
        rowErrors.push('休憩控除後の実働時間が必要です');
      }
      if (Number(row.heads) < 1) rowErrors.push('実施人数は1名以上にしてください');
      if (rowErrors.length) nextErrors[index] = rowErrors;
    });
    if (changed && !reason.trim()) nextErrors.reason = ['変更理由を入力してください'];
    setErrors(nextErrors);
    return Object.keys(nextErrors).length === 0;
  };

  const submit = mode => {
    if (!validate()) return;
    onSubmit({
      mode,
      changed,
      reason:reason.trim(),
      totalActualMinutes,
      plannedWorkItems:item?.workItems || item?.schedules || [],
      actualWorkItems:rows.map(row => ({
        workId:row.workId,
        title:row.workTitle,
        date:row.date,
        startTime:row.startTime,
        endTime:row.endTime,
        breakMinutes:Number(row.breakMinutes) || 0,
        heads:Number(row.heads) || 0,
        memo:row.memo
      }))
    });
  };

  const canSubmit = rows.length > 0 && Object.keys(errors).length === 0;

  return (
    <Dialog open={open} onClose={onClose} fullWidth maxWidth="xl" PaperProps={{className:'dense-dialog', sx:{borderRadius:1, height:'88vh'}}}>
      <DialogTitle sx={{borderBottom:'1px solid', borderColor:'divider', py:1.5, px:3}}>
        <Stack direction="row" justifyContent="space-between" alignItems="center">
          <Box>
            <Typography variant="h6" fontWeight="600">作業完了報告 - {item?.title}</Typography>
            <Typography variant="caption" color="text.secondary">予定値を確認し、実績値で報告してください</Typography>
          </Box>
          <IconButton onClick={onClose} size="small"><span className="material-icons">close</span></IconButton>
        </Stack>
      </DialogTitle>
      <DialogContent sx={{p:2, overflow:'auto'}}>
        <Box sx={{mb:1.5, p:1.25, border:'1px solid', borderColor:'divider', borderRadius:1, display:'grid', gridTemplateColumns:{xs:'repeat(2, 1fr)', md:'repeat(3, 1fr)'}, gap:1}}>
          <Box><Typography variant="caption" color="text.secondary">作業数</Typography><Typography variant="subtitle2" fontWeight="700">{rows.length}件</Typography></Box>
          <Box><Typography variant="caption" color="text.secondary">実施人数合計</Typography><Typography variant="subtitle2" fontWeight="700">{rows.reduce((sum,row)=>sum + (Number(row.heads)||0),0)}名</Typography></Box>
          <Box><Typography variant="caption" color="text.secondary">実績延べ実働</Typography><Typography variant="subtitle2" fontWeight="700">{utils.fmtClockMinutes(totalActualMinutes)}</Typography></Box>
        </Box>
        <TableContainer sx={{border:'1px solid', borderColor:'divider', borderRadius:1}}>
          <Table size="small" className="dense-table">
            <TableHead>
              <TableRow sx={{bgcolor:'grey.50'}}>
                <TableCell>作業（予定）</TableCell><TableCell>実績日</TableCell><TableCell>実績開始</TableCell><TableCell>実績終了</TableCell>
                <TableCell>実績休憩(分)</TableCell><TableCell>実働</TableCell><TableCell>実績人数</TableCell><TableCell>実績メモ</TableCell>
              </TableRow>
            </TableHead>
            <TableBody>
              {rows.map((row,index) => (
                <TableRow key={row.workId || index} sx={{bgcolor:errors[index] ? 'error.light' : 'inherit'}}>
                  <TableCell>
                    <Typography variant="caption" fontWeight="600">{row.workTitle}</Typography>
                    <Typography variant="caption" display="block" color="text.secondary">
                      {row.plannedDate || '—'} {row.plannedStartTime}〜{row.plannedEndTime} / 休憩{row.plannedBreakMinutes}分
                    </Typography>
                  </TableCell>
                  <TableCell><TextField type="date" size="small" value={row.date} onChange={e=>updateRow(index,{date:e.target.value})} InputLabelProps={{shrink:true}}/></TableCell>
                  <TableCell><TextField type="time" size="small" value={row.startTime} onChange={e=>updateRow(index,{startTime:e.target.value})} InputLabelProps={{shrink:true}}/></TableCell>
                  <TableCell><TextField type="time" size="small" value={row.endTime} onChange={e=>updateRow(index,{endTime:e.target.value})} InputLabelProps={{shrink:true}}/></TableCell>
                  <TableCell><TextField type="number" size="small" value={row.breakMinutes} onChange={e=>updateRow(index,{breakMinutes:Math.max(0,Number(e.target.value)||0)})} inputProps={{min:0,step:15}}/></TableCell>
                  <TableCell sx={{whiteSpace:'nowrap', fontWeight:600}}>{utils.fmtClockMinutes(utils.workMinutes(row))}</TableCell>
                  <TableCell><TextField type="number" size="small" value={row.heads} onChange={e=>updateRow(index,{heads:Math.max(0,Number(e.target.value)||0)})} inputProps={{min:1}}/></TableCell>
                  <TableCell><TextField size="small" value={row.memo} onChange={e=>updateRow(index,{memo:e.target.value})} placeholder="変更内容・実績メモ"/></TableCell>
                </TableRow>
              ))}
            </TableBody>
          </Table>
        </TableContainer>
        {changed && (
          <TextField fullWidth size="small" label="変更理由*" value={reason} onChange={e=>setReason(e.target.value)} error={!!errors.reason} helperText={errors.reason?.[0] || '予定値から変更した理由を入力してください'} sx={{mt:1.5}}/>
        )}
      </DialogContent>
      <DialogActions sx={{px:2, py:1, borderTop:'1px solid', borderColor:'divider'}}>
        <Button onClick={onClose} size="small">キャンセル</Button>
        <Box flex={1}/>
        <Button variant="outlined" size="small" onClick={()=>submit('as_planned')} disabled={!canSubmit || changed}>予定どおり報告</Button>
        <Button variant="contained" size="small" onClick={()=>submit('adjusted')} disabled={!canSubmit}>実績を修正して報告</Button>
      </DialogActions>
    </Dialog>
  );
}

/* ===== 差し戻しダイアログ ===== */
function RejectDialog({open, onClose, item, onSubmit}) {
  const [reason, setReason] = useState('');
  const [selectedReason, setSelectedReason] = useState('');
  const [targetFlow, setTargetFlow] = useState('');
  const targetOptions = item ? FLOW_STATUSES.filter((status, index) => index < FLOW_STATUSES.findIndex(current => current.key === item.flowStatus)) : [];
  useEffect(() => {
    setTargetFlow(targetOptions[targetOptions.length - 1]?.key || item?.flowStatus || '');
  }, [item]);
  
  const commonReasons = [
    '情報が不足しています',
    '日程の調整が必要です',
    '人数の見直しが必要です',
    '作業内容の詳細確認が必要です',
    '見積金額の再検討が必要です',
    'その他'
  ];

  const handleReasonChange = (value) => {
    setSelectedReason(value);
    if (value !== 'その他') {
      setReason(value);
    } else {
      setReason('');
    }
  };

  const submit = () => {
    onSubmit(reason || selectedReason, targetFlow);
    setReason('');
    setSelectedReason('');
  };

  return (
    <Dialog open={open} onClose={onClose} maxWidth="sm" fullWidth PaperProps={{className:'dense-dialog', sx: {borderRadius: 1}}}>
      <DialogTitle sx={{borderBottom:'1px solid', borderColor:'divider', py:2, px:3}}>
        <Stack direction="row" justifyContent="space-between" alignItems="center">
          <Typography variant="h6" fontWeight="600">差し戻し理由</Typography>
          <IconButton onClick={onClose} size="small"><span className="material-icons">close</span></IconButton>
        </Stack>
      </DialogTitle>
      
      <DialogContent sx={{p:3}}>
        <Alert severity="info" sx={{mb:3}}>
          <Typography variant="body2">差し戻し理由は相手方に通知され、案件は前のステップに戻ります。</Typography>
        </Alert>
        <Stack spacing={1.5}>
          <FormControl fullWidth size="medium">
            <InputLabel>戻し先工程</InputLabel>
            <Select value={targetFlow} label="戻し先工程" onChange={e=>setTargetFlow(e.target.value)}>
              {targetOptions.length ? targetOptions.map(status => <MenuItem key={status.key} value={status.key}>{status.label}</MenuItem>) : <MenuItem value={item?.flowStatus || ''}>{FLOW_STATUSES.find(status => status.key === item?.flowStatus)?.label || '現在の工程'}</MenuItem>}
            </Select>
          </FormControl>
          <FormControl fullWidth size="medium">
            <Select value={selectedReason} onChange={e=>handleReasonChange(e.target.value)} displayEmpty>
              <MenuItem value="" disabled>理由を選択</MenuItem>
              {commonReasons.map(r => <MenuItem key={r} value={r}>{r}</MenuItem>)}
            </Select>
          </FormControl>
          
          {selectedReason === 'その他' && (
            <TextField
              value={reason}
              onChange={e=>setReason(e.target.value)}
              fullWidth
              size="medium"
              multiline
              rows={4}
              placeholder="詳細理由を入力"
            />
          )}
        </Stack>
      </DialogContent>
      
      <DialogActions sx={{px:3, py:2, borderTop:'1px solid', borderColor:'divider'}}>
        <Button onClick={onClose} size="medium">キャンセル</Button>
        <Button onClick={submit} variant="contained" color="warning" size="medium" disabled={!reason && !selectedReason}>
          差し戻し
        </Button>
      </DialogActions>
    </Dialog>
  );
}
/* ===== ダッシュボード ===== */
function Dashboard({items, role}) {
  const currentAccount = USER_ACCOUNTS.find(a => a.key === role);
  
  // 統計データの計算
  const stats = useMemo(() => {
    const now = new Date();
    const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const thisWeek = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
    
    const thisMonthItems = items.filter(i => new Date(i.createdAt) >= thisMonth);
    const lastMonthItems = items.filter(i => new Date(i.createdAt) >= lastMonth && new Date(i.createdAt) < thisMonth);
    const thisWeekItems = items.filter(i => new Date(i.createdAt) >= thisWeek);
    
    // フロー別集計
    const flowStats = FLOW_STATUSES.map(status => ({
      ...status,
      count: items.filter(i => listFlowStatusOf(i) === status.key).length,
      thisMonth: thisMonthItems.filter(i => listFlowStatusOf(i) === status.key).length,
      amount: items.filter(i => listFlowStatusOf(i) === status.key && i.estimate?.amount).reduce((sum, i) => sum + i.estimate.amount, 0)
    }));
    
    // データ状態別集計
    const stateStats = Object.entries(DATA_STATES).map(([key, state]) => ({
      key,
      ...state,
      count: items.filter(i => i.dataState === key).length
    }));
    
    // 取引先別集計（金額含む）
    const partnerData = items.reduce((acc, item) => {
      if (!item.partner) return acc;
      if (!acc[item.partner]) acc[item.partner] = { count: 0, amount: 0, completed: 0 };
      acc[item.partner].count++;
      if (item.estimate?.amount) acc[item.partner].amount += item.estimate.amount;
      if (listFlowStatusOf(item) === 'paid') acc[item.partner].completed++;
      return acc;
    }, {});
    const topPartners = Object.entries(partnerData)
      .sort(([,a], [,b]) => b.count - a.count)
      .slice(0, 5)
      .map(([partner, data]) => ({partner, ...data}));
    
    // 対象拠点別集計（金額含む）
    const storeData = items.reduce((acc, item) => {
      if (!acc[item.store]) acc[item.store] = { count: 0, amount: 0 };
      acc[item.store].count++;
      if (item.estimate?.amount) acc[item.store].amount += item.estimate.amount;
      return acc;
    }, {});
    const topStores = Object.entries(storeData)
      .sort(([,a], [,b]) => b.count - a.count)
      .slice(0, 5)
      .map(([store, data]) => ({store, ...data}));
    
    // 依頼部門別集計
    const deptData = items.reduce((acc, item) => {
      if (!acc[item.department]) acc[item.department] = { count: 0, amount: 0 };
      acc[item.department].count++;
      if (item.estimate?.amount) acc[item.department].amount += item.estimate.amount;
      return acc;
    }, {});
    const topDepts = Object.entries(deptData)
      .sort(([,a], [,b]) => b.count - a.count)
      .map(([dept, data]) => ({dept, ...data}));
    
    // 見積金額統計
    const estimatedItems = items.filter(i => i.estimate?.amount);
    const totalAmount = estimatedItems.reduce((sum, i) => sum + i.estimate.amount, 0);
    const avgAmount = estimatedItems.length > 0 ? totalAmount / estimatedItems.length : 0;
    const maxAmount = estimatedItems.length > 0 ? Math.max(...estimatedItems.map(i => i.estimate.amount)) : 0;
    const minAmount = estimatedItems.length > 0 ? Math.min(...estimatedItems.map(i => i.estimate.amount)) : 0;
    
    // 完了率・差し戻し率
    const completedCount = items.filter(i => listFlowStatusOf(i) === 'paid').length;
    const completionRate = items.length > 0 ? (completedCount / items.length * 100) : 0;
    const rejectedCount = items.filter(i => i.dataState === 'rejected').length;
    const rejectionRate = items.length > 0 ? (rejectedCount / items.length * 100) : 0;
    
    // 平均処理日数
    const completedItems = items.filter(i => listFlowStatusOf(i) === 'paid' && i.createdAt && (i.paidAt || i.completedAt));
    const avgProcessDays = completedItems.length > 0 
      ? completedItems.reduce((sum, i) => sum + (new Date(i.paidAt || i.completedAt) - new Date(i.createdAt)) / (1000 * 60 * 60 * 24), 0) / completedItems.length 
      : 0;
    
    // 月別推移（12ヶ月）
    const monthlyTrend = [];
    for (let i = 11; i >= 0; i--) {
      const month = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const nextMonth = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
      const monthItems = items.filter(item => {
        const date = new Date(item.createdAt);
        return date >= month && date < nextMonth;
      });
      monthlyTrend.push({
        month: month.toLocaleDateString('ja-JP', {month:'short'}),
        count: monthItems.length,
        amount: monthItems.filter(item => item.estimate?.amount).reduce((sum, item) => sum + item.estimate.amount, 0)
      });
    }
    
    // 曜日別集計
    const weekdayData = [0,1,2,3,4,5,6].map(day => ({
      day: ['日','月','火','水','木','金','土'][day],
      count: items.filter(i => new Date(i.schedules?.[0]?.date).getDay() === day).length
    }));
    
    return {
      total: items.length,
      thisMonth: thisMonthItems.length,
      lastMonth: lastMonthItems.length,
      thisWeek: thisWeekItems.length,
      monthGrowth: lastMonthItems.length > 0 ? ((thisMonthItems.length - lastMonthItems.length) / lastMonthItems.length * 100) : 0,
      flowStats,
      stateStats,
      topPartners,
      topStores,
      topDepts,
      totalAmount,
      avgAmount,
      maxAmount,
      minAmount,
      completedCount,
      completionRate,
      rejectedCount,
      rejectionRate,
      avgProcessDays,
      monthlyTrend,
      weekdayData
    };
  }, [items]);
  
  const maxMonthlyCount = Math.max(...stats.monthlyTrend.map(m => m.count), 1);
  const maxMonthlyAmount = Math.max(...stats.monthlyTrend.map(m => m.amount), 1);
  const maxFlowCount = Math.max(...stats.flowStats.map(f => f.count), 1);
  const maxWeekdayCount = Math.max(...stats.weekdayData.map(w => w.count), 1);
  
  return (
    <Box>
      {/* KPIサマリーカード */}
      <Grid container spacing={2} sx={{mb:2}}>
        <Grid item xs={6} sm={4} md={2}>
          <Paper sx={{p:1.5, textAlign:'center', height:100, display:'flex', flexDirection:'column', justifyContent:'center'}}>
            <Typography variant="h4" fontWeight="700">{stats.total}</Typography>
            <Typography variant="body2" color="text.secondary">総依頼数</Typography>
          </Paper>
        </Grid>
        <Grid item xs={6} sm={4} md={2}>
          <Paper sx={{p:1.5, textAlign:'center', height:100, display:'flex', flexDirection:'column', justifyContent:'center'}}>
            <Typography variant="h4" fontWeight="700">{stats.thisMonth}</Typography>
            <Typography variant="body2" color="text.secondary">今月</Typography>
            <Typography variant="caption" color={stats.monthGrowth >= 0 ? 'success.main' : 'error.main'}>
              {stats.monthGrowth >= 0 ? '+' : ''}{stats.monthGrowth.toFixed(0)}%
            </Typography>
          </Paper>
        </Grid>
        <Grid item xs={6} sm={4} md={2}>
          <Paper sx={{p:1.5, textAlign:'center', height:100, display:'flex', flexDirection:'column', justifyContent:'center'}}>
            <Typography variant="h4" fontWeight="700">{stats.completedCount}</Typography>
            <Typography variant="body2" color="text.secondary">完了</Typography>
            <Typography variant="caption" color="text.secondary">{stats.completionRate.toFixed(1)}%</Typography>
          </Paper>

function RequestCalendar({items, onSelect}) {
  const calendarRef = useRef(null);
  useEffect(() => {
    if (!calendarRef.current || !window.FullCalendar) return;
    const events = items.flatMap(item => (item.workItems || item.schedules || []).filter(work => work.date).map((work, index) => ({
      id: item.id + '-' + (work.id || index),
      title: (item.title || '案件') + ' / ' + (work.title || '作業'),
      start: work.startTime ? work.date + 'T' + work.startTime : work.date,
      end: work.endTime ? work.date + 'T' + work.endTime : undefined,
      backgroundColor: FLOW_STATUSES.find(status => status.key === listFlowStatusOf(item))?.color === 'warning' ? '#ed6c02' : '#1976d2',
      extendedProps: {item}
    })));
    const calendar = new window.FullCalendar.Calendar(calendarRef.current, {
      initialView: 'dayGridMonth', locale: 'ja', height: 'auto', contentHeight: 'auto', expandRows: false, dayMaxEvents: 3,
      headerToolbar: {left:'prev,next today', center:'title', right:'dayGridMonth,timeGridWeek,listWeek'},
      buttonText: {today:'今日', month:'月', week:'週', list:'一覧'},
      events,
      eventClick: info => onSelect(info.event.extendedProps.item),
      eventTimeFormat: {hour:'2-digit', minute:'2-digit', hour12:false}
    });
    calendar.render();
    return () => calendar.destroy();
  }, [items, onSelect]);
  return <Paper sx={{mb:2, p:1.5, border:'1px solid', borderColor:'divider'}}><Box ref={calendarRef} /></Paper>;
}

const listRequestTypeLabel = item => item.requestTypeLabel || REQUEST_TYPE_DEFINITIONS[item.requestType]?.label || (isStoredWorkflowItem(item) ? '申請' : '人員調達依頼');
const listWorkflowLabel = item => item.workflowDefinition?.label || WORKFLOW_TYPE_DEFINITIONS[item.workflowType]?.label || FLOW_STATUSES.find(status => status.key === listFlowStatusOf(item))?.label || '—';
const LIST_VIEW_MODE_STORAGE_KEY = 'pj002:list-view-modes:v1';

function ListCardMeta({label, children}) {
  return (
    <Box sx={{minWidth:0}}>
      <Typography variant="caption" color="text.secondary" display="block">{label}</Typography>
      <Typography variant="body2" sx={{fontWeight:600, overflowWrap:'anywhere'}}>{children || '—'}</Typography>
    </Box>
  );
}

function CaseCardList({items, page, rowsPerPage, selected, onSelect, onDetail, expandedCases, onToggleExpand}) {
  if (!items.length) return <Typography variant="body2" color="text.secondary" sx={{p:3, textAlign:'center'}}>該当する案件はありません</Typography>;
  return (
    <Box sx={{p:{xs:1, sm:1.5}, display:'grid', gridTemplateColumns:'minmax(0, 1fr)', gap:1.25}}>
      {items.map((item, index) => {
        const storedWorkflow = isStoredWorkflowItem(item);
        const flow = FLOW_STATUSES.find(status => status.key === listFlowStatusOf(item));
        const stateInfo = storedWorkflow
          ? {label:item.workflowCaseStatus || '対応中', color:item.workflowCaseStatus === '完了' ? 'success' : 'info'}
          : utils.dataStateInfo(item.flowStatus, item.dataState) || DATA_STATES[item.dataState];
        const works = item.workItems?.length ? item.workItems : item.schedules || [];
        const startDate = item.caseStartDate || works[0]?.date || '—';
        const endDate = item.caseEndDate || works[works.length - 1]?.date || '—';
        const activeTask = storedWorkflow ? (item.workflowTasks || []).find(task => task.status === '進行中' || task.status === '差戻し') : null;
        const currentAction = storedWorkflow ? null : WORKFLOW_ACTIONS.find(action => action.flow === item.flowStatus && action.states.includes(item.dataState));
        const currentOwner = activeTask?.assignee || activeTask?.owner || ACTION_OWNER_LABELS[currentAction?.key] || (flow?.key === 'paid' ? '完了' : '—');
        const expanded = Boolean(expandedCases[item.id]);
        return (
          <Paper key={item.id} component="article" className="list-card" variant="outlined" sx={{p:1.5, minWidth:0, borderColor:selected.includes(item.id) ? 'primary.main' : item.rejectedAt ? 'error.main' : 'divider', bgcolor:selected.includes(item.id) ? 'action.selected' : 'background.paper'}}>
            <Stack direction="row" spacing={1} alignItems="flex-start">
              <Checkbox checked={selected.includes(item.id)} onChange={()=>onSelect(item.id)} size="small" slotProps={{input:{'aria-label':(item.title || '案件') + 'を選択'}}} sx={{mt:-0.5, ml:-0.5}}/>
              <Box sx={{flex:1, minWidth:0}}>
                <Stack direction="row" spacing={0.75} alignItems="center" sx={{mb:0.5, flexWrap:'wrap', rowGap:0.5}}>
                  <Typography variant="caption" color="text.secondary">No.{page * rowsPerPage + index + 1}</Typography>
                  <Chip size="small" label={flow?.label || '—'} color={flow?.color || 'default'} sx={{height:22}}/>
                  <Chip size="small" label={stateInfo?.label || item.dataState} color={stateInfo?.color || 'default'} variant="outlined" sx={{height:22}}/>
                </Stack>
                <Typography variant="subtitle2" fontWeight="700" sx={{overflowWrap:'anywhere'}}>{item.title || listRequestTypeLabel(item)}</Typography>
                <Typography variant="caption" color="text.secondary" display="block" sx={{overflowWrap:'anywhere'}}>{listRequestTypeLabel(item)} ／ {listWorkflowLabel(item)}</Typography>
              </Box>
            </Stack>

            <Box sx={{display:'grid', gridTemplateColumns:{xs:'minmax(0, 1fr)',sm:'repeat(2, minmax(0, 1fr))',lg:'repeat(5, minmax(0, 1fr))'}, gap:1, mt:1.25, pt:1.25, borderTop:'1px solid', borderColor:'divider'}}>
              <ListCardMeta label="案件ID">{item.caseNumber || item.id}</ListCardMeta>
              <ListCardMeta label="作業／工程">{storedWorkflow ? (item.workflowTasks || []).length + '工程' : works.length + '件'}</ListCardMeta>
              <ListCardMeta label="期間">{startDate} ～ {endDate}</ListCardMeta>
              <ListCardMeta label="必要人数">{Number(item.heads) || 0}名</ListCardMeta>
              <ListCardMeta label="申請先／取引先">{item.requestDestination || item.partner || '—'}</ListCardMeta>
              <ListCardMeta label="依頼部門">{item.department || '—'}</ListCardMeta>
              <ListCardMeta label="現在担当">{currentOwner}</ListCardMeta>
              <ListCardMeta label="依頼日">{utils.fmtDate(item.createdAt)}</ListCardMeta>
              <ListCardMeta label="確定日">{utils.fmtDate(item.confirmedAt)}</ListCardMeta>
              <ListCardMeta label="見積金額">{utils.yen(item.estimate?.amount)}</ListCardMeta>
            </Box>

            <Stack direction="row" spacing={1} justifyContent="flex-end" sx={{mt:1.25}}>
              <Button size="small" onClick={()=>onDetail(item)} startIcon={<span className="material-icons" style={{fontSize:16}}>visibility</span>}>詳細</Button>
              <Button size="small" onClick={()=>onToggleExpand(item.id)} endIcon={<span className="material-icons" style={{fontSize:16}}>{expanded ? 'expand_less' : 'expand_more'}</span>}>
                {storedWorkflow ? '工程' : '作業'}
              </Button>
            </Stack>

            <Collapse in={expanded} timeout="auto" unmountOnExit>
              <Stack spacing={0.75} sx={{mt:1.25, pt:1.25, borderTop:'1px solid', borderColor:'divider'}}>
                {storedWorkflow
                  ? (item.workflowTasks || []).map(task => (
                      <Box key={task.seq} sx={{display:'grid', gridTemplateColumns:'32px minmax(0, 1fr) auto', gap:0.75, alignItems:'center', p:0.75, bgcolor:'grey.50', borderRadius:1}}>
                        <Typography variant="caption" color="text.secondary">{task.seq}</Typography>
                        <Box sx={{minWidth:0}}><Typography variant="body2" fontWeight="600">{task.label}</Typography><Typography variant="caption" color="text.secondary">{task.owner} ／ {task.mode === 'parallel' ? '並列' : '直列'}</Typography></Box>
                        <Chip size="small" label={task.status} variant="outlined" sx={{height:22}}/>
                      </Box>
                    ))
                  : works.map((work, workIndex) => (
                      <Box key={work.id || workIndex} sx={{p:0.75, bgcolor:'grey.50', borderRadius:1}}>
                        <Stack direction="row" spacing={1} justifyContent="space-between"><Typography variant="body2" fontWeight="600">{work.title || item.content || '作業'}</Typography><Typography variant="caption">{work.status === 'completed' ? '完了' : work.status || item.dataState}</Typography></Stack>
                        <Typography variant="caption" color="text.secondary">{workTypeLabel(work.workType)} ／ {work.date || '—'} {work.startTime || '—'}–{work.endTime || '—'} ／ {utils.fmtClockMinutes(utils.workMinutes(work))}</Typography>
                      </Box>
                    ))}
              </Stack>
            </Collapse>
          </Paper>
        );
      })}
    </Box>
  );
}

            <Box sx={{display:'grid', gridTemplateColumns:{xs:'minmax(0, 1fr)',sm:'repeat(2, minmax(0, 1fr))',lg:'repeat(4, minmax(0, 1fr))'}, gap:1, mt:1.25}}>
              <ListCardMeta label="実施日時">{work.date || '—'} {work.startTime || '—'}–{work.endTime || '—'}</ListCardMeta>
              <ListCardMeta label="実働／休憩">{utils.fmtClockMinutes(utils.workMinutes(work))} ／ {utils.fmtClockMinutes(Number(work.breakMinutes) || 0)}</ListCardMeta>
              <ListCardMeta label="対象拠点">{work.store || '—'}</ListCardMeta>
              <ListCardMeta label="必要人数">{Number(work.heads) || 0}名</ListCardMeta>
              <ListCardMeta label="時給">{utils.yen(Number(work.hourlyRate) || 0)}</ListCardMeta>
              <ListCardMeta label="進捗">{flow?.label || '—'}</ListCardMeta>
              <ListCardMeta label="取引先">{work.partner || '—'}</ListCardMeta>
              <ListCardMeta label="依頼部門">{work.department || '—'}</ListCardMeta>
            </Box>
            <Box sx={{display:'flex', justifyContent:'flex-end', mt:1.25}}><Button size="small" onClick={()=>onDetail(work.caseItem)} startIcon={<span className="material-icons" style={{fontSize:16}}>visibility</span>}>案件詳細</Button></Box>
          </Paper>
        );
      })}
    </Box>
  );
}

/* ===== メインApp ===== */
function App() {
  const prefersDark = useMediaQuery('(prefers-color-scheme: dark)');
  const isCompactList = useMediaQuery('(max-width:599.95px)');
  const dark = prefersDark;
  const theme = useMemo(() => createTheme({palette:{mode: dark?'dark':'light'}}), [dark]);

  const [role, setRole] = useState('internal_user_staff');
  const [items, setItems] = useState([]);
  const [apiStatus, setApiStatus] = useState('loading');
  const [apiError, setApiError] = useState('');
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [filterYear, setFilterYear] = useState('');
  const [filterMonth, setFilterMonth] = useState('');
  const [filterStartDate, setFilterStartDate] = useState('');
  const [filterEndDate, setFilterEndDate] = useState('');
  const [filterStore, setFilterStore] = useState('');
  const [filterDept, setFilterDept] = useState('');
  const [dlgCreate, setDlgCreate] = useState(false);
  const [detail, setDetail] = useState(null);
  const [estimateTarget, setEstimateTarget] = useState(null);
  const [reportTarget, setReportTarget] = useState(null);
  const [dlgReject, setDlgReject] = useState(null);
  const [dlgRejectMode, setDlgRejectMode] = useState('execute');
  const [snack, setSnack] = useState(null);
  const [actionBusy, setActionBusy] = useState(false);
  const [selected, setSelected] = useState([]);
  const [page, setPage] = useState(0);
  const [rowsPerPage, setRowsPerPage] = useState(25);
  const [helpOpen, setHelpOpen] = useState(false);
  const [orderBy, setOrderBy] = useState('createdAt');
  const [order, setOrder] = useState('desc');
  const [workOrderBy, setWorkOrderBy] = useState('date');
  const [workOrder, setWorkOrder] = useState('asc');
  const [columnWidths, setColumnWidths] = useState({});
  const [currentView, setCurrentView] = useState('list'); // 'list' or 'dashboard'
  const [listUnit, setListUnit] = useState('case'); // 'case' or 'work'
  const [calendarOpen, setCalendarOpen] = useState(false);
  const [expandedCases, setExpandedCases] = useState({});
  const [listViewModes, setListViewModes] = useState(() => {
    try {
      const stored = JSON.parse(window.localStorage.getItem(LIST_VIEW_MODE_STORAGE_KEY) || '{}');
      return {
        case:['table','card'].includes(stored.case) ? stored.case : null,
        work:['table','card'].includes(stored.work) ? stored.work : null
      };
    } catch (error) {
      return {case:null, work:null};
    }
  });

  const currentAccount = USER_ACCOUNTS.find(a => a.key === role);
  const activeListViewMode = listViewModes[listUnit] || (isCompactList ? 'card' : 'table');
  const changeListViewMode = mode => {
    const next = {...listViewModes, [listUnit]:mode};
    setListViewModes(next);
    try {
      window.localStorage.setItem(LIST_VIEW_MODE_STORAGE_KEY, JSON.stringify(next));
    } catch (error) {
      // 保存できない環境でも、現在の画面では選択した表示を維持する。
    }
  };

  useEffect(() => {
    if (currentView === 'dashboard' && !currentAccount?.permissions.includes('dashboard')) {
      setCurrentView('list');
    }
    setSelected([]);
  }, [role]);

  useEffect(() => {
    setSelected([]);
    setPage(0);
  }, [filter, search, filterStartDate, filterEndDate, filterStore, filterDept]);

  useEffect(() => {
    let active = true;
    requestApi.list()
      .then(data => {
        if (!active) return;
        setItems(Array.isArray(data) ? data : []);
        setApiStatus('ready');
      })
      .catch(error => {
        if (!active) return;
        setApiStatus('error');
        setApiError(error.message || '依頼データを取得できませんでした');
      });
    return () => { active = false; };
  }, []);

  const handleSort = (property) => {
    const isAsc = orderBy === property && order === 'asc';
    setOrder(isAsc ? 'desc' : 'asc');
    setOrderBy(property);
  };
  const handleWorkSort = property => {
    const isAsc = workOrderBy === property && workOrder === 'asc';
    setWorkOrderBy(property);
    setWorkOrder(isAsc ? 'desc' : 'asc');
    setPage(0);
  };

  const getComparator = (order, orderBy) => {
    return order === 'desc'
      ? (a, b) => descendingComparator(a, b, orderBy)
      : (a, b) => -descendingComparator(a, b, orderBy);
  };

  const descendingComparator = (a, b, orderBy) => {
    let aVal = a[orderBy];
    let bVal = b[orderBy];
    
    if (orderBy === 'schedules') {
      aVal = a.schedules?.[0]?.date || '';
      bVal = b.schedules?.[0]?.date || '';
    }
    
    if (bVal < aVal) return -1;
    if (bVal > aVal) return 1;
    return 0;
  };

  // 年月選択時に日付範囲を自動設定
  const handleYearChange = (year) => {
    setFilterYear(year);
    if (year && filterMonth) {
      const startDate = year + '-' + filterMonth.padStart(2, '0') + '-01';
      const lastDay = new Date(parseInt(year), parseInt(filterMonth), 0).getDate();
      const endDate = year + '-' + filterMonth.padStart(2, '0') + '-' + lastDay.toString().padStart(2, '0');
      setFilterStartDate(startDate);
      setFilterEndDate(endDate);
    } else if (year && !filterMonth) {
      setFilterStartDate(year + '-01-01');
      setFilterEndDate(year + '-12-31');
    } else {
      setFilterStartDate('');
      setFilterEndDate('');
    }
  };

  const handleMonthChange = (month) => {
    setFilterMonth(month);
    if (filterYear && month) {
      const startDate = filterYear + '-' + month.padStart(2, '0') + '-01';
      const lastDay = new Date(parseInt(filterYear), parseInt(month), 0).getDate();
      const endDate = filterYear + '-' + month.padStart(2, '0') + '-' + lastDay.toString().padStart(2, '0');
      setFilterStartDate(startDate);
      setFilterEndDate(endDate);
    } else if (filterYear && !month) {
      setFilterStartDate(filterYear + '-01-01');
      setFilterEndDate(filterYear + '-12-31');
    }
  };

  const clearFilters = () => {
    setFilterYear('');
    setFilterMonth('');
    setFilterStartDate('');
    setFilterEndDate('');
    setFilterStore('');
    setFilterDept('');
    setSearch('');
    setFilter('all');
  };

  const filtered = useMemo(() => {
    return items
      .filter(i => {
        if (filter === 'all') return true;
        return listFlowStatusOf(i) === filter;
      })
      .filter(i => {
        const text = [
          i.title, i.requestTypeLabel, i.requestDestination, i.partner, i.partnerCode, i.store, i.department, i.content,
          i.requestData?.common?.contact, JSON.stringify(i.requestData?.fields || {})
        ].filter(Boolean).join(' ').toLowerCase();
        return text.includes(search.toLowerCase());
      })
      .filter(i => {
        if (!filterStartDate && !filterEndDate) return true;
        const itemStartDate = i.caseStartDate || i.schedules?.[0]?.date;
        const itemEndDate = i.caseEndDate || i.schedules?.[i.schedules.length - 1]?.date || itemStartDate;
        if (!itemStartDate) return true;
        if (filterStartDate && itemEndDate < filterStartDate) return false;
        if (filterEndDate && itemStartDate > filterEndDate) return false;
        return true;
      })
      .filter(i => !filterStore || i.store === filterStore)
      .filter(i => !filterDept || i.department === filterDept)
      .sort(getComparator(order, orderBy));
  }, [items, filter, search, filterStartDate, filterEndDate, filterStore, filterDept, order, orderBy]);

  const paged = filtered.slice(page * rowsPerPage, page * rowsPerPage + rowsPerPage);
  const attentionItems = useMemo(() => items.flatMap(item => {
    if (isStoredWorkflowItem(item)) {
      if (item.dataState === 'draft' && (role === 'internal_user_staff' || role === 'service_owner_staff')) {
        return [{item, action:{key:'start_workflow', label:'申請する'}}];
      }
      const task = (item.workflowTasks || []).find(candidate =>
        (candidate.status === '進行中' || candidate.status === '差戻し') &&
        (role === 'service_owner_staff' || (candidate.ownerAccountKeys || []).includes(role))
      );
      return task ? [{item, action:{key:'complete_workflow_task', label:task.label + 'を完了'}}] : [];
    }
    if (item.rejectionRequest && utils.hasPermission(role, 'reject')) {
      return [{item, action:{key:'reject', label:'差し戻し'}}];
    }
    const actions = utils.availableActions(item, role).filter(action => action.key !== 'reject' && action.key !== 'cancel');
    return actions.length ? [{item, action:actions[0]}] : [];
  }), [items, role]);
  const workRows = useMemo(() => filtered.flatMap(item => {
    const works = item.workItems?.length ? item.workItems : (item.schedules || []).map((schedule, index) => ({
      id:'W-' + (index + 1),
      title:item.content || '作業',
      date:schedule.date,
      startTime:schedule.startTime,
      endTime:schedule.endTime,
      store:item.store,
      heads:item.heads,
      status:['completed','billing','paying','paid'].includes(item.flowStatus) ? 'completed' : 'pending'
    }));
    return works.map(work => ({
      ...work,
      caseId:item.id,
      caseTitle:item.title,
      caseFlowStatus:item.flowStatus,
      caseDataState:item.dataState,
      partner:work.partner || item.partner,
      department:item.department,
      caseItem:item
    }));
  }), [filtered]);
  const sortedWorkRows = useMemo(() => [...workRows].sort((a,b) => {
    const av = a[workOrderBy] ?? ''; const bv = b[workOrderBy] ?? '';
    const result = String(av).localeCompare(String(bv), 'ja', {numeric:true});
    return workOrder === 'asc' ? result : -result;
  }), [workRows, workOrderBy, workOrder]);
  const pagedWorks = sortedWorkRows.slice(page * rowsPerPage, page * rowsPerPage + rowsPerPage);
  const activeRowCount = listUnit === 'case' ? filtered.length : workRows.length;
  const inProgressCount = items.filter(item =>
    listFlowStatusOf(item) !== 'paid' && !['draft','cancelled'].includes(item.dataState)
  ).length;
  const completedCount = items.filter(item => listFlowStatusOf(item) === 'paid').length;
  const selectedItems = useMemo(
    () => selected.map(id => items.find(item => item.id === id)).filter(Boolean),
    [selected, items]
  );
  const singleSelectedItem = selectedItems.length === 1 ? selectedItems[0] : null;
  const selectedSameState = selectedItems.length > 0 && selectedItems.every(item =>
    item.flowStatus === selectedItems[0].flowStatus &&
    item.dataState === selectedItems[0].dataState
  );
  const selectedActions = singleSelectedItem
    ? utils.availableActions(singleSelectedItem, role)
    : [];
  const selectedCanReject = !!singleSelectedItem &&
    !isStoredWorkflowItem(singleSelectedItem) &&
    utils.hasPermission(role, 'reject') &&
    (!!singleSelectedItem.rejectionRequest || utils.availableActions(singleSelectedItem, role).length > 0) &&
    !['draft', 'rejected', 'cancelled'].includes(singleSelectedItem.dataState);
  const selectedCanRequestReject = !!singleSelectedItem &&
    !isStoredWorkflowItem(singleSelectedItem) &&
    utils.hasPermission(role, 'reject_request') &&
    !singleSelectedItem.rejectionRequest &&
    !['draft', 'rejected', 'cancelled'].includes(singleSelectedItem.dataState);
  const selectedCanCancel = !!singleSelectedItem &&
    !isStoredWorkflowItem(singleSelectedItem) &&
    utils.hasPermission(role, 'cancel') &&
    singleSelectedItem.flowStatus === 'request' &&
    ['draft', 'submitted', 'rejected'].includes(singleSelectedItem.dataState);
  const commonBulkActions = useMemo(() => {
    if (selectedItems.length < 2 || !selectedSameState) return [];
    const availableKeySets = selectedItems.map(item =>
      new Set(utils.availableActions(item, role).map(action => action.key))
    );
    return WORKFLOW_ACTIONS.filter((action, index, actions) =>
      BULK_SAFE_ACTIONS.includes(action.key) &&
      actions.findIndex(candidate => candidate.key === action.key) === index &&
      availableKeySets.every(keys => keys.has(action.key))
    );
  }, [selectedItems, selectedSameState, role]);
  const toolbarActions = useMemo(() => {
    const workflowActions = WORKFLOW_ACTIONS.filter(action =>
      currentAccount?.permissions.includes(action.permission)
    ).filter((action, index, actions) =>
      actions.findIndex(candidate => candidate.key === action.key) === index
    );
    const extras = [
      {key:'reject_request', permission:'reject_request', label:'差戻依頼'},
      {key:'reject', permission:'reject', label:'差し戻し'}
    ];
    // 差し戻しは権限がない場合もフッターに非活性表示する
    if (currentAccount?.permissions.includes('cancel')) extras.push({key:'cancel', label:'取消'});
    return [...workflowActions, ...extras];
  }, [currentAccount]);
  const isToolbarActionEnabled = actionKey => {
    if (actionKey === 'reject_request') return selectedCanRequestReject;
    if (actionKey === 'reject') return selectedCanReject;
    if (selectedItems.length === 1) {
      return selectedActions.some(action => action.key === actionKey) ||
        (actionKey === 'reject' && selectedCanReject) ||
        (actionKey === 'cancel' && selectedCanCancel);
    }
    if (selectedItems.length > 1) return commonBulkActions.some(action => action.key === actionKey);
    return false;
  };

  const createItem = async (data) => {
    try {
      const created = await requestApi.create(data);
      setItems(prev => [created, ...prev]);
      setDlgCreate(false);
      setSnack({severity:'success', msg:'案件を作成しました'});
    } catch (error) {
      setSnack({severity:'error', msg:error.message || '依頼を作成できませんでした'});
    }
  };

  const saveDraftItem = async (data) => {
    try {
      const saved = await requestApi.create(data);
      setItems(prev => [saved, ...prev]);
      setDlgCreate(false);
      setSnack({severity:'success', msg:'下書きを保存しました'});
    } catch (error) {
      setSnack({severity:'error', msg:error.message || '下書きを保存できませんでした'});
    }
  };

  const createMockCases = async () => {
    try {
      const created = await requestApi.seed(5);
      setItems(prev => [...created, ...prev]);
      setSnack({severity:'success', msg:'サンプル案件を5件生成しました'});
    } catch (error) {
      setSnack({severity:'error', msg:error.message || 'サンプル案件を生成できませんでした'});
    }
  };

  const persistItem = async (nextItem, action) => {
    const saved = await requestApi.update(nextItem.id, nextItem, action);
    setItems(prev => prev.map(item => item.id === saved.id ? saved : item));
    return saved;
  };

  const handleAction = async (id, action) => {
    const source = items.find(item => item.id === id);
    if (!source) return;
    if (action === 'start_workflow') {
      const nextItem = startStoredWorkflow(source, currentAccount);
      if (!nextItem) {
        setSnack({severity:'error', msg:'このユーザーまたは案件状態では申請できません'});
        return;
      }
      setActionBusy(true);
      try {
        await persistItem(nextItem, action);
        setSelected(prev => prev.filter(selectedId => selectedId !== id));
        setDetail(null);
        setSnack({severity:'success', msg:'申請し、受付工程を開始しました'});
      } catch (error) {
        setSnack({severity:'error', msg:error.message || '申請できませんでした'});
      } finally {
        setActionBusy(false);
      }
      return;
    }
    if (action === 'complete_workflow_task') {
      if (!isStoredWorkflowItem(source)) {
        setSnack({severity:'error', msg:'この案件には申請処理フローが設定されていません'});
        return;
      }
      const nextItem = completeStoredWorkflowTask(source, currentAccount);
      if (!nextItem) {
        setSnack({severity:'error', msg:'このユーザーが完了できる現在工程はありません'});
        return;
      }
      const completedTask = (source.workflowTasks || []).find(task =>
        (task.status === '進行中' || task.status === '差戻し') &&
        (currentAccount?.key === 'service_owner_staff' || (task.ownerAccountKeys || []).includes(currentAccount?.key))
      );
      setActionBusy(true);
      try {
        await persistItem(nextItem, action);
        setSelected(prev => prev.filter(selectedId => selectedId !== id));
        setDetail(null);
        setSnack({severity:'success', msg:(completedTask?.label || '現在工程') + 'を完了しました'});
      } catch (error) {
        setSnack({severity:'error', msg:error.message || '工程を更新できませんでした'});
      } finally {
        setActionBusy(false);
      }
      return;
    }
    if (action === 'submit_request' && !utils.isRequestReady(source)) {
      setSnack({severity:'error', msg:'必須項目を入力してから依頼を申請してください'});
      return;
    }
    if (action === 'estimate') {
      if (!utils.availableActions(source, role).some(candidate => candidate.key === 'estimate')) {
        setSnack({severity:'error', msg:'このユーザーでは見積もりを登録できません'});
        return;
      }
      setEstimateTarget(source);
      return;
    }
    if (action === 'report_complete') {
      if (!utils.availableActions(source, role).some(candidate => candidate.key === 'report_complete')) {
        setSnack({severity:'error', msg:'このユーザーでは作業完了報告を登録できません'});
        return;
      }
      setReportTarget(source);
      return;
    }
    if (action === 'reject_request') {
      const canRequest = utils.hasPermission(role, 'reject_request') &&
        !source.rejectionRequest && !['draft', 'rejected', 'cancelled'].includes(source.dataState);
      if (!canRequest) {
        setSnack({severity:'error', msg:'現在の状態では差戻依頼できません'});
        return;
      }
      setDlgRejectMode('request');
      setDlgReject(source);
      return;
    }
    if (action === 'reject') {
      const canReject = utils.hasPermission(role, 'reject') &&
        (!!source.rejectionRequest || utils.availableActions(source, role).length > 0) &&
        !['draft', 'rejected', 'cancelled'].includes(source.dataState);
      if (!canReject) {
        setSnack({severity:'error', msg:'現在の状態では差し戻しできません'});
        return;
      }
      setDlgRejectMode('execute');
      setDlgReject(source);
      return;
    }

    if (getWorkflowTransition(action)) {
      const allowed = source && utils.availableActions(source, role).some(a => a.key === action);
      if (!allowed) {
        setSnack({severity:'error', msg:'このユーザーでは現在の操作を実行できません'});
        return;
      }
      const nextItem = buildTransitionedItem(source, action, currentAccount);
      setActionBusy(true);
      try {
        await persistItem(nextItem, action);
        setSelected(prev => prev.filter(selectedId => selectedId !== id));
        setDetail(null);
        setSnack({severity:'success', msg:WORKFLOW_ACTIONS.find(a => a.key === action)?.label + 'を実行しました'});
      } catch (error) {
        setSnack({severity:'error', msg:error.message || '依頼を更新できませんでした'});
      } finally {
        setActionBusy(false);
      }
    } else if (action === 'cancel' && utils.hasPermission(role, 'cancel')) {
      const canCancel = source.flowStatus === 'request' &&
        ['draft', 'submitted', 'rejected'].includes(source.dataState);
      if (!canCancel) {
        setSnack({severity:'error', msg:'現在の状態では依頼を取り消せません'});
        return;
      }
      const accountLabel = currentAccount?.name || role;
      setActionBusy(true);
      try {
        await persistItem({
          ...source,
          dataState:'cancelled',
          history:[...(source.history || []), {
            action:'cancel',
            from:source.flowStatus,
            to:source.flowStatus,
            by:accountLabel,
            at:new Date().toISOString(),
            ...buildActionAudit(currentAccount, 'cancel')
          }]
        }, 'cancel');
        setSelected(prev => prev.filter(selectedId => selectedId !== id));
        setDetail(null);
        setSnack({severity:'warning', msg:'依頼を取り消しました'});
      } catch (error) {
        setSnack({severity:'error', msg:error.message || '依頼を更新できませんでした'});
      } finally {
        setActionBusy(false);
      }
    }
  };

  const handleBulkAction = async action => {
    const actionDefinition = commonBulkActions.find(candidate => candidate.key === action);
    if (!actionDefinition || selectedItems.length < 2) {
      setSnack({severity:'error', msg:'選択案件に共通して実行できる操作ではありません'});
      return;
    }
    const targets = selectedItems.filter(item =>
      utils.availableActions(item, role).some(candidate => candidate.key === action)
    );
    if (targets.length !== selectedItems.length) {
      setSnack({severity:'error', msg:'案件の状態が変わりました。選択し直してください'});
      return;
    }
    const nextItems = targets.map(item => buildTransitionedItem(item, action, currentAccount));
    setActionBusy(true);
    try {
      const savedItems = await requestApi.bulkUpdate(nextItems, action);
      const savedMap = new Map(savedItems.map(item => [item.id, item]));
      setItems(prev => prev.map(item => savedMap.get(item.id) || item));
      setSelected([]);
      setSnack({
        severity:'success',
        msg:targets.length + '件の「' + actionDefinition.label + '」を実行しました'
      });
    } catch (error) {
      setSnack({severity:'error', msg:error.message || '一括操作を実行できませんでした'});
    } finally {
      setActionBusy(false);
    }
  };

  const submitReport = async payload => {
    if (!reportTarget) return;
    const nextItem = buildTransitionedItem(reportTarget, 'report_complete', currentAccount);
    if (!nextItem) return;
    const reportedAt = new Date().toISOString();
    const executionReport = {
      reportedAt,
      reportedBy:currentAccount?.name || role,
      mode:payload.mode,
      changed:payload.changed,
      reason:payload.reason,
      totalActualMinutes:payload.totalActualMinutes,
      plannedWorkItems:payload.plannedWorkItems,
      actualWorkItems:payload.actualWorkItems
    };
    nextItem.executionReport = executionReport;
    nextItem.completedAt = reportedAt;
    nextItem.history = (nextItem.history || []).map((entry, index, history) =>
      index === history.length - 1
        ? {...entry, changed:payload.changed, varianceReason:payload.reason, actualMinutes:payload.totalActualMinutes}
        : entry
    );
    setActionBusy(true);
    try {
      await persistItem(nextItem, 'report_complete');
      setSelected(prev => prev.filter(id => id !== reportTarget.id));
      setReportTarget(null);
      setDetail(null);
      setSnack({severity:'success', msg:payload.changed ? '実績を修正して作業完了を報告しました' : '予定どおり作業完了を報告しました'});
    } catch (error) {
      setSnack({severity:'error', msg:error.message || '作業完了報告を保存できませんでした'});
    } finally {
      setActionBusy(false);

        setDlgReject(null);
        setSnack({severity:'info', msg:'差戻依頼を登録しました'});
      } catch (error) {
        setSnack({severity:'error', msg:error.message || '差戻依頼を登録できませんでした'});
      }
      return;
    }
    const rejectTargets = {
      request: {flowStatus:'request', dataState:'rejected'},
      proposal: {flowStatus:'proposal', dataState:'rejected'},
      confirmed: {flowStatus:'proposal', dataState:'rejected'},
      completed: {flowStatus:'confirmed', dataState:'rejected'},
      billing: {flowStatus:'billing', dataState:'reviewing'},
      paying: {flowStatus:'billing', dataState:'reviewing'},
      paid: {flowStatus:'paying', dataState:'reviewing'}
    };
    const selectedTarget = requestedTargetFlow || dlgReject.rejectionRequest?.targetFlow;
    const target = selectedTarget
      ? {flowStatus:selectedTarget, dataState:['billing','paying'].includes(selectedTarget) ? 'reviewing' : 'rejected'}
      : rejectTargets[dlgReject.flowStatus];
    if (!target) return;
    const nextItem = {
        ...dlgReject,
        flowStatus: target.flowStatus,
        dataState: target.dataState,
        rejectedAt: new Date().toISOString(),
        rejectedReason: reason,
        rejectedBy: roleLabel,
        rejectedFrom: dlgReject.flowStatus,
        rejectionRequest: null,
        history: [...(dlgReject.history || []), {
          action: 'reject',
          from: dlgReject.flowStatus,
          to: target.flowStatus,
          reason: reason,
          by: roleLabel,
          at: new Date().toISOString(),
          ...buildActionAudit(currentAccount, 'reject')
        }]
    };
    try {
      await persistItem(nextItem, 'reject');
      setSelected(prev => prev.filter(id => id !== dlgReject.id));
      setDlgReject(null);
      setDetail(null);
      setSnack({severity:'warning', msg:'前のステップに差し戻しました'});
    } catch (error) {
      setSnack({severity:'error', msg:error.message || '依頼を更新できませんでした'});

  };

      startX.current = e.clientX;
      e.preventDefault();

      if (!isResizing) return;

      const handleMouseMove = (e) => {
        const delta = e.clientX - startX.current;
        handleResize(columnKey, delta);
        startX.current = e.clientX;
      };

      const handleMouseUp = () => {
        setIsResizing(false);
      };

      document.addEventListener('mousemove', handleMouseMove);
      document.addEventListener('mouseup', handleMouseUp);

      return () => {
        document.removeEventListener('mousemove', handleMouseMove);
        document.removeEventListener('mouseup', handleMouseUp);
      };
    }, [isResizing]);

                    </TableCell>
                  </TableRow>
                </React.Fragment>

            <WorkCardList works={pagedWorks} page={page} rowsPerPage={rowsPerPage} onDetail={setDetail}/>

            <CaseCardList
              items={paged}
              page={page}
              rowsPerPage={rowsPerPage}
              selected={selected}
              onSelect={handleSelect}

            />

          <Box component="div" sx={{display:'flex', justifyContent:{xs:'stretch', sm:'flex-end'}, borderTop:'1px solid', borderColor:'divider'}}>
            <Stack direction="row" spacing={1} alignItems="center" sx={{py:1, px:{xs:1, sm:2}, width:{xs:'100%', sm:'auto'}, flexWrap:'wrap'}}>
              <Typography variant="body2" sx={{display:{xs:'none', sm:'block'}}}>ページあたりの行数:</Typography>

              >
                <span className="material-icons">chevron_left</span>
              </IconButton>
              <IconButton
                onClick={() => setPage(p => Math.min(Math.ceil(activeRowCount / rowsPerPage) - 1, p + 1))}

                <span className="material-icons">chevron_right</span>
              </IconButton>

          </Box>
        </Paper>
          </>

        open={!!detail}

    </ThemeProvider>

}

const root = createRoot(document.getElementById('root'));
root.render(<App/>);
