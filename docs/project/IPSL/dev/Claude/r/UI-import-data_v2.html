const toCSV = (filename, rows)=>{
  const csv = rows.map(r=>r.map(v=>{
    const s = v==null ? '' : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url;
  a.download=filename;
  a.click();
  URL.revokeObjectURL(url);
};

const parseCSV = (text)=>{
  const rows=[];
  let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; }
        else inQuotes=false;
      } else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c!=='\r') field+=c;
    }
    i++;
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1)
    .filter(r=>r.some(x=>String(x||'').trim()!==''))
    .map(r=>Object.fromEntries(headers.map((h,idx)=>[h,r[idx]??''])));
};

const fmtDateTime = (d)=> new Date(d).toLocaleString('ja-JP');

/* =========================
   システム個体識別 / JobID
   - SystemInstanceID: 初回起動時に1回だけ生成するGUID
   - WorkerID: SystemInstanceID全体から固定導出する10桁Base36
   - JobID: J-yyyyMMddHHmmss-WorkerID-同一秒内2桁Base36連番
   - 旧形式JobID: 起動時に現行形式へ再発番しlegacyJobIdへ保存
========================= */
const SYSTEM_INSTANCE_STORAGE_KEY='estimate_schedule_system_instance_v1';
const WORKER_ID_LENGTH=10;
const JOB_SEQUENCE_LENGTH=2;
const JOB_SEQUENCE_LIMIT=36 ** JOB_SEQUENCE_LENGTH;
const RESERVED_JOB_IDS=new Set();

const createSystemInstanceId=()=>{
  const c=globalThis.crypto;
  if(c?.randomUUID) return c.randomUUID();

  if(c?.getRandomValues){
    const bytes=new Uint8Array(16);
    c.getRandomValues(bytes);
    bytes[6]=(bytes[6]&0x0f)|0x40;
    bytes[8]=(bytes[8]&0x3f)|0x80;
    const hex=[...bytes].map(v=>v.toString(16).padStart(2,'0'));
    return `${hex.slice(0,4).join('')}-${hex.slice(4,6).join('')}-${hex.slice(6,8).join('')}-${hex.slice(8,10).join('')}-${hex.slice(10,16).join('')}`;
  }

  // crypto非対応環境向けの最終フォールバック。通常ブラウザでは使用されない。
  return `fallback-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,14)}`;
};

const deriveWorkerId=(systemInstanceId)=>{
  // GUID全体を64bit FNV-1aで固定変換し、Base36の10桁へ圧縮する。
  // Jobごとの乱数ではなく、システム個体のランダム性だけをWorkerIDへ引き継ぐ。
  const value=String(systemInstanceId||'').trim().toLowerCase();
  let hash=BigInt('14695981039346656037');
  const prime=BigInt('1099511628211');
  const mask=BigInt('0xFFFFFFFFFFFFFFFF');
  for(let i=0;i<value.length;i++){
    hash=hash ^ BigInt(value.charCodeAt(i));
    hash=(hash*prime)&mask;
  }
  return hash.toString(36).toUpperCase().padStart(WORKER_ID_LENGTH,'0').slice(-WORKER_ID_LENGTH);
};

const getOrCreateSystemIdentity=()=>{
  try{
    const raw=localStorage.getItem(SYSTEM_INSTANCE_STORAGE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed?.systemInstanceId){
        const normalized={
          systemInstanceId:String(parsed.systemInstanceId),
          workerId:deriveWorkerId(parsed.systemInstanceId),
          createdAt:parsed.createdAt || Date.now()
        };
        localStorage.setItem(SYSTEM_INSTANCE_STORAGE_KEY,JSON.stringify(normalized));
        return normalized;
      }
    }
  }catch(e){}

  const systemInstanceId=createSystemInstanceId();
  const identity={
    systemInstanceId,
    workerId:deriveWorkerId(systemInstanceId),
    createdAt:Date.now()
  };
  try{localStorage.setItem(SYSTEM_INSTANCE_STORAGE_KEY,JSON.stringify(identity));}catch(e){}
  return identity;
};

const SYSTEM_IDENTITY=getOrCreateSystemIdentity();

const formatJobTimestamp=(value=Date.now())=>{
  const d=new Date(value);
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
};

const recordJobId=(record)=>String(record?.jobId || record?.id || '');
const CURRENT_JOB_ID_PATTERN=new RegExp(`^J-\\d{14}-[0-9A-Z]{${WORKER_ID_LENGTH}}-[0-9A-Z]{${JOB_SEQUENCE_LENGTH}}$`);
const isCurrentJobId=(jobId)=>CURRENT_JOB_ID_PATTERN.test(String(jobId||''));

const extractWorkerIdFromJobId=(jobId)=>{
  const m=String(jobId||'').match(new RegExp(`^J-\\d{14}-([0-9A-Z]{${WORKER_ID_LENGTH}})-[0-9A-Z]{${JOB_SEQUENCE_LENGTH}}$`));
  return m?.[1] || '';
};

const makeJobId=(existingRecords=[],createdAt=Date.now())=>{
  const timestamp=formatJobTimestamp(createdAt);
  const prefix=`J-${timestamp}-${SYSTEM_IDENTITY.workerId}-`;
  const used=new Set((Array.isArray(existingRecords)?existingRecords:[]).map(recordJobId).filter(Boolean));

  for(let seq=0;seq<JOB_SEQUENCE_LIMIT;seq++){
    const suffix=seq.toString(36).toUpperCase().padStart(JOB_SEQUENCE_LENGTH,'0');
    const jobId=`${prefix}${suffix}`;
    if(!used.has(jobId) && !RESERVED_JOB_IDS.has(jobId)){
      RESERVED_JOB_IDS.add(jobId);
      return jobId;
    }
  }
  throw new Error(`同一秒内のJob発番上限（${JOB_SEQUENCE_LIMIT}件）を超えました`);
};

/* =========================
   サンプル & テンプレート
========================= */
const sampleEstCSV=`項目,数量,単価,小計,メモ
開発一式,1,100000,,一括見積`;

2026-10-08,09:00,12:00,東京店,什器入替,山田,正常データ

見積,EST001,開発一式,1,100000,,一括見積,,,,,,
見積,EST002,保守,12,5000,,月次対応,,,,,,
スケジュール,EST001,,,,,,2026-10-08,09:00,12:00,東京店,設計,山田

/* =========================
   データモデル / 検証 / ロールバック
========================= */
const SCHEDULE_FIELDS=['日付','開始','終了','場所','作業内容','担当','メモ'];
const deepClone=(value)=>JSON.parse(JSON.stringify(value ?? null));
const makeRowId=()=>`ROW-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;

const createEmptyScheduleRow = ()=>(
  {日付:'',開始:'',終了:'',場所:'',作業内容:'',担当:'',メモ:'',__rowId:makeRowId(),__createdAfterImport:true,__deleted:false,__deletedAt:null,__rollbackReady:false,__no:null}
);

const normalizeScheduleRows=(rows=[],referenceRows=[])=>{
  let maxNo=0;
  const normalized=(Array.isArray(rows)?rows:[]).map((row,index)=>{
    const ref=referenceRows[index]||{};
    const no=Number(row?.__no || ref?.__no || index+1);
    maxNo=Math.max(maxNo,no);
    return {
      ...row,
      __rowId:row?.__rowId || ref?.__rowId || makeRowId(),
      __no:no,
      __createdAfterImport:Boolean(row?.__createdAfterImport),
      __deleted:Boolean(row?.__deleted),
      __deletedAt:row?.__deletedAt || null,
      __rollbackReady:Boolean(row?.__rollbackReady)
    };
  });
  normalized.forEach((row,index)=>{ if(!row.__no) row.__no=++maxNo || index+1; });
  return normalized;
};

const rowData=(row)=>Object.fromEntries(SCHEDULE_FIELDS.map(f=>[f,row?.[f]??'']));
const sameRowData=(a,b)=>JSON.stringify(rowData(a))===JSON.stringify(rowData(b));

const validateScheduleRow = (row)=>{
  if(row?.__deleted) return [];
  const errors=[];
  ['日付','開始','終了','場所','作業内容','担当'].forEach(field=>{
    if(!String(row?.[field] ?? '').trim()){
      errors.push({field,value:row?.[field]??'',message:`${field}が入力されていません`});
    }
  });
  if(row?.['開始'] && row?.['終了'] && row['開始'] >= row['終了']){
    errors.push({field:'終了',value:row['終了'],message:'終了時刻は開始時刻より後にしてください'});
  }
  return errors;
};

const activeScheduleRows=(record)=>(record?.sch||[]).filter(row=>!row.__deleted);
const countImportErrors = (record)=>activeScheduleRows(record).reduce((n,row)=>n+(validateScheduleRow(row).length?1:0),0);

const makeBaseline=(record)=>({
  importId:record.importId,
  est:deepClone(record.est||[]),
  sch:deepClone((record.sch||[]).map(row=>({...row,__createdAfterImport:false,__deleted:false,__deletedAt:null,__rollbackReady:false})))
});

const addAudit=(record,action,scope='import',detail='')=>({
  ...record,
  audit:[...(record.audit||[]),{
    id:`AUD-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
    at:Date.now(),action,scope,detail
  }]
});

const ensureRecordModel=(rec,index=0,existingRecords=[])=>{
  const currentRows=normalizeScheduleRows(rec?.sch||[]);
  const createdAt=rec?.createdAt || Date.now();

  // JobIDは現行仕様を唯一の内部キーとする。
  // 旧形式のJobID/idは新仕様へ再発番し、監査・追跡用にlegacyJobId/legacyIdへ退避する。
  const sourceJobId=String(rec?.jobId||'').trim();
  const sourceId=String(rec?.id||'').trim();
  const keepCurrentJobId=isCurrentJobId(sourceJobId);
  const jobId=keepCurrentJobId ? sourceJobId : makeJobId(existingRecords,createdAt);
  const legacyJobId=rec?.legacyJobId || (!keepCurrentJobId && sourceJobId ? sourceJobId : null);
  const legacyId=rec?.legacyId || (sourceId && sourceId!==jobId ? sourceId : null);

  // WorkerIDはJobID内の値を正とする。旧形式から再発番した場合は現在のSystemInstance由来WorkerIDになる。
  const workerId=extractWorkerIdFromJobId(jobId) || SYSTEM_IDENTITY.workerId;
  const systemInstanceId=
    keepCurrentJobId && rec?.systemInstanceId
      ? rec.systemInstanceId
      : (workerId===SYSTEM_IDENTITY.workerId ? SYSTEM_IDENTITY.systemInstanceId : null);
  let baseline;
  if(rec?.baseline){
    const baselineRows=normalizeScheduleRows(rec.baseline.sch||[],currentRows);
    baseline={
      importId:rec.baseline.importId ?? rec.importId ?? '',
      est:deepClone(rec.baseline.est||[]),
      sch:baselineRows.map(r=>({...r,__createdAfterImport:false,__deleted:false,__deletedAt:null,__rollbackReady:false}))
    };
  }else{
    baseline={
      importId:rec?.importId ?? rec?.setId ?? '',
      est:deepClone(rec?.est||[]),
      sch:deepClone(currentRows.map(r=>({...r,__createdAfterImport:false,__deleted:false,__deletedAt:null,__rollbackReady:false})))
    };
  }
  return {
    ...rec,
    // jobId/id は現行JobIDへ統一。旧識別子は監査用フィールドとして保持する。
    jobId,
    id:jobId,
    legacyJobId,
    legacyId,
    systemInstanceId,
    workerId,
    importId:rec?.importId ?? rec?.setId ?? baseline.importId ?? '',
    createdAt,
    updatedAt:rec?.updatedAt || null,
    status:rec?.status || 'Active',
    mode:rec?.mode || 'two',
    source:rec?.source || null,
    __rollbackReady:Boolean(rec?.__rollbackReady) || rec?.status==='RolledBack',
    est:Array.isArray(rec?.est)?deepClone(rec.est):[],
    sch:currentRows,
    baseline,
    audit:Array.isArray(rec?.audit)?rec.audit:[]
  };
};

const createImportRecord=(payload,existingRecords=[])=>{
  const createdAt=payload?.createdAt || Date.now();
  const jobId=payload?.jobId || makeJobId(existingRecords,createdAt);
  const workerId=payload?.workerId || SYSTEM_IDENTITY.workerId;
  const systemInstanceId=payload?.systemInstanceId || SYSTEM_IDENTITY.systemInstanceId;
  const sch=normalizeScheduleRows(payload.sch||[]).map(r=>({...r,__createdAfterImport:false,__deleted:false,__deletedAt:null,__rollbackReady:false}));
  let rec={
    ...payload,
    jobId,
    id:jobId,
    legacyJobId:null,
    legacyId:null,
    systemInstanceId,
    workerId,
    importId:payload?.importId ?? '',
    createdAt,
    __rollbackReady:false,
    est:deepClone(payload.est||[]),
    sch,
    audit:[]
  };
  rec.baseline=makeBaseline(rec);
  return rec;
};

const isRowChanged=(record,row)=>{
  const base=(record?.baseline?.sch||[]).find(r=>r.__rowId===row.__rowId);
  if(!base) return true;
  return Boolean(row.__deleted) || !sameRowData(row,base);
};

const isRecordChanged=(record)=>{
  if(!record?.baseline) return false;
  const current={
    importId:record.importId,
    est:record.est||[],
    sch:(record.sch||[]).map(r=>({id:r.__rowId,deleted:Boolean(r.__deleted),data:rowData(r)}))
  };
  const base={
    importId:record.baseline.importId,
    est:record.baseline.est||[],
    sch:(record.baseline.sch||[]).map(r=>({id:r.__rowId,deleted:false,data:rowData(r)}))
  };
  return JSON.stringify(current)!==JSON.stringify(base);
};

// 削除ルール:
// 1) 正常データは、baselineと同じ状態でも直接削除できない。必ず明示的なロールバック操作を通す
// 2) 「取込時に戻す」を実行済みの正常データだけ削除を許可する
// 3) 初回取込時点からエラーのデータは、ロールバックしても同じため直接削除を許可する
// 4) 取込後に追加した明細はbaselineに存在しないため、ロールバックで追加自体を取り消す
const getBaselineRow=(record,rowOrId)=>{
  const rowId=typeof rowOrId==='string' ? rowOrId : rowOrId?.__rowId;
  return (record?.baseline?.sch||[]).find(r=>r.__rowId===rowId) || null;
};

const hasBaselineRowError=(record,rowOrId)=>{
  const base=getBaselineRow(record,rowOrId);
  return Boolean(base && validateScheduleRow(base).length>0);
};

const hasBaselineImportError=(record)=>
  (record?.baseline?.sch||[]).some(row=>validateScheduleRow(row).length>0);

const canDeleteRow=(record,row)=>{
  if(!row) return false;
  const base=getBaselineRow(record,row);
  if(!base) return false;
  if(hasBaselineRowError(record,row)) return true;
  return Boolean(row.__rollbackReady) && !isRowChanged(record,row);
};

const canDeleteImport=(record)=>{
  if(!record) return false;
  // 初回取込時点からエラーを含むものは例外として直接削除可能。
  if(hasBaselineImportError(record)) return true;
  // 正常取込は「取込前に戻す」を明示的に実行した後だけ削除可能。
  return record.status==='RolledBack' && Boolean(record.__rollbackReady);
};

const rollbackWholeImport=(record)=>{
  if(!record) return record;
  // インポート単位のロールバックは、データ内容をbaselineへ書き戻すのではなく
  // 「この取込自体を有効データとして扱わない」状態へ遷移させる。
  // record/baseline/audit は監査のため保持する。
  const rolledBack={
    ...record,
    status:'RolledBack',
    __rollbackReady:true,
    updatedAt:Date.now()
  };
  return addAudit(rolledBack,'取込前に戻す','import','このインポートを取込前状態として扱うよう無効化。履歴・取込内容は監査のため保持');
};

const rollbackSelectedRows=(record,rowIds)=>{
  const ids=new Set(rowIds||[]);
  const baseMap=new Map((record?.baseline?.sch||[]).map(r=>[r.__rowId,r]));
  const current=[];
  (record.sch||[]).forEach(row=>{
    if(!ids.has(row.__rowId)){ current.push(row); return; }
    const base=baseMap.get(row.__rowId);
    if(base) current.push({...deepClone(base),__deleted:false,__deletedAt:null,__createdAfterImport:false,__rollbackReady:true});
    // 初回取込後に追加された明細は、取込時点には存在しないため除去
  });
  // 削除済みかつ現在配列から消えているケースに備えてbaselineから補完
  (record?.baseline?.sch||[]).forEach(base=>{
    if(ids.has(base.__rowId) && !current.some(r=>r.__rowId===base.__rowId)){
      current.push({...deepClone(base),__deleted:false,__deletedAt:null,__createdAfterImport:false,__rollbackReady:true});
    }
  });
  current.sort((a,b)=>(a.__no||0)-(b.__no||0));
  return addAudit({...record,sch:current,__rollbackReady:false,updatedAt:Date.now()},'取込時に戻す','detail',`${ids.size}件を取込時点へ復元。対象作業を削除可能状態へ移行`);
};

const recordSearchText=(record)=>{
  const source=record.source || (record.mode==='two'?'CSV（2ファイル）':record.mode==='one'?'CSV（1ファイル）':'API');
  const values=[recordJobId(record),record.legacyJobId,record.legacyId,record.workerId,record.importId,fmtDateTime(record.createdAt),source,record.status];
  (record.est||[]).forEach(r=>values.push(...Object.values(r||{})));
  activeScheduleRows(record).forEach(r=>values.push(...SCHEDULE_FIELDS.map(f=>r[f])));
  return values.map(v=>String(v??'')).join(' ').toLowerCase();
};

const rowSearchText=(row)=>SCHEDULE_FIELDS.map(f=>String(row?.[f]??'')).join(' ').toLowerCase();

/* =========================
   旧データ互換
   旧: history[] -> record.sets[]
   新: history[] -> 1 record = 1 import
========================= */
const migrateHistory = (value)=>{
  if(!Array.isArray(value)) return [];
  const migrated=[];
  value.forEach((rec,recIndex)=>{
    if(Array.isArray(rec?.sets)){
      rec.sets.forEach((set,setIndex)=>{
        migrated.push(ensureRecordModel({
          id:`${rec.id||Date.now()}-${setIndex}`,
          importId:set.id || `SET${String(setIndex+1).padStart(3,'0')}`,
          createdAt:rec.createdAt || Date.now(),
          updatedAt:rec.updatedAt || null,
          status:rec.status || 'Active',
          mode:rec.mode || 'two',
          source:rec.source || null,
          est:Array.isArray(set.est)?set.est:[],
          sch:Array.isArray(set.sch)?set.sch:[]
        },migrated.length,migrated));
      });
      return;
    }
    migrated.push(ensureRecordModel(rec,recIndex,migrated));
  });
  return migrated;
};

function FileImport({label,hint,rows,onRows}){
  const [over,setOver]=React.useState(false);
  const inputRef=React.useRef(null);

  const readFiles=async(files)=>{
    const readText=(file)=>new Promise((res,rej)=>{
      const fr=new FileReader();
      fr.onload=()=>res(fr.result);
      fr.onerror=rej;
      fr.readAsText(file,'utf-8');
    });
    const texts=await Promise.all(files.map(readText));
    onRows(texts.flatMap(t=>parseCSV(t)));
  };

  const onDrop=(e)=>{
    e.preventDefault();
    setOver(false);
    const files=Array.from(e.dataTransfer.files||[]).filter(f=>f.name.toLowerCase().endsWith('.csv'));
    if(files.length) readFiles(files);
  };

  return <Paper className="business-card" sx={{p:{xs:2,md:2},flex:1}}>
    <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{mb:1.5}}>
      <Typography variant="subtitle2" sx={{color:'#1e293b'}}>{label}</Typography>
      {rows?.length
        ? <Chip size="small" color="primary" label={`${rows.length} 行`}/>
        : <Chip size="small" variant="outlined" label="未読込"/>}
    </Stack>

    {hint && <Typography className="muted" sx={{mb:1.5}}>{hint}</Typography>}

    <Box
      className={`dropzone ${over?'dragover':''}`}
      onClick={()=>inputRef.current?.click()}
      onDragOver={e=>{e.preventDefault();setOver(true);}}
      onDragLeave={()=>setOver(false)}
      onDrop={onDrop}
    >
      <Stack alignItems="center" spacing={.5}>
        <span className="material-icons" style={{fontSize:'2rem',color:'#64748b'}}>cloud_upload</span>
        <Typography variant="body2" sx={{fontWeight:500,color:'#475569'}}>CSVをドラッグ＆ドロップ</Typography>
        <Typography variant="caption" color="text.secondary">またはクリックして選択</Typography>
      </Stack>
      <input
        type="file"
        ref={inputRef}
        hidden
        accept=".csv"
        multiple
        onChange={e=>{
          const files=Array.from(e.target.files||[]);
          if(files.length) readFiles(files);
          e.target.value='';
        }}
      />
    </Box>

    <Box sx={{mt:2}}><CsvPreview rows={rows}/></Box>
  </Paper>;
}

/* =========================
   1インポート詳細
   systemInstanceId = システム個体GUID / workerId = GUID由来の固定発番元ID
   jobId = 時刻 + workerId + 連番による一意キー / importId = ユーザー設定タグ
   record = 1インポート
   record.sch[] = 明細
========================= */
function ImportDetailDialog({record,onClose,setHistory,notify,requestConfirm,onEditSource,onDelete,onCancel,onRestore}){
  const [errorOnly,setErrorOnly]=React.useState(false);
  const [query,setQuery]=React.useState('');
  const [selectedRows,setSelectedRows]=React.useState([]);
  const [editRow,setEditRow]=React.useState(null);
  const [idEdit,setIdEdit]=React.useState(false);
  const [importId,setImportId]=React.useState('');
  const [actionAnchor,setActionAnchor]=React.useState(null);
  const [auditOpen,setAuditOpen]=React.useState(false);
  const [deletedOpen,setDeletedOpen]=React.useState(false);
  const [rowDetailId,setRowDetailId]=React.useState(null);

  React.useEffect(()=>{
    setErrorOnly(false);
    setQuery('');
    setSelectedRows([]);
    setEditRow(null);
    setIdEdit(false);
    setActionAnchor(null);
    setAuditOpen(false);
    setDeletedOpen(false);
    setRowDetailId(null);
    setImportId(record?.importId||'');
  },[record?.jobId,record?.id]);

  if(!record) return null;

  const rows=activeScheduleRows(record);
  const deletedRows=(record.sch||[]).filter(r=>r.__deleted);
  const errorCount=countImportErrors(record);
  const rollbackReadyCount=rows.filter(r=>r.__rollbackReady).length;
  const q=query.trim().toLowerCase();
  const filteredRows=rows.filter(r=>(!errorOnly || validateScheduleRow(r).length) && (!q || rowSearchText(r).includes(q)));
  const source=record.source || (record.mode==='two'?'CSV（2ファイル）':record.mode==='one'?'CSV（1ファイル）':'API');
  const allVisibleIds=filteredRows.map(r=>r.__rowId);
  const allChecked=allVisibleIds.length>0 && allVisibleIds.every(id=>selectedRows.includes(id));
  const someChecked=allVisibleIds.some(id=>selectedRows.includes(id));
  const selectedRowObjects=(record.sch||[]).filter(r=>selectedRows.includes(r.__rowId));
  const selectedRowsCanDelete=selectedRowObjects.length>0 && selectedRowObjects.every(r=>canDeleteRow(record,r));
  const storedEditRow=editRow?.mode==='edit'
    ? (record.sch||[]).find(r=>r.__rowId===editRow.row.__rowId) || null
    : null;
  const editRowCanDelete=Boolean(storedEditRow && canDeleteRow(record,storedEditRow));
  const importCanDelete=canDeleteImport(record);
  const rowDetail=(record.sch||[]).find(r=>r.__rowId===rowDetailId) || null;
  const rowDetailErrors=rowDetail?validateScheduleRow(rowDetail):[];

  const mutate=(fn,msg,action='更新',scope='detail',detailText='')=>{
    setHistory(prev=>prev.map(r=>{
      if(recordJobId(r)!==recordJobId(record)) return r;
      const clone={...r,est:deepClone(r.est||[]),sch:deepClone(r.sch||[]),baseline:deepClone(r.baseline),audit:deepClone(r.audit||[])};
      let next=fn(clone) || clone;
      next={...next,__rollbackReady:false,updatedAt:Date.now()};
      if(action) next=addAudit(next,action,scope,detailText||msg||'');
      return next;
    }));
    if(msg) notify(msg,{severity:'success'});
  };

  const saveImportId=()=>{
    const v=String(importId||'').trim();
    mutate(rec=>({...rec,importId:v}),'インポートID（タグ）を更新しました','タグ変更','import',`${record.importId||'(未設定)'} → ${v||'(未設定)'}`);
    setIdEdit(false);
  };

  const saveRow=()=>{
    if(!editRow) return;
    mutate(rec=>{
      if(editRow.mode==='add'){
        const maxNo=Math.max(0,...(rec.sch||[]).map(r=>Number(r.__no)||0));
        rec.sch=[...(rec.sch||[]),{...editRow.row,__rowId:editRow.row.__rowId||makeRowId(),__no:maxNo+1,__createdAfterImport:true,__deleted:false,__deletedAt:null,__rollbackReady:false}];
      }else{
        rec.sch=rec.sch.map(r=>r.__rowId===editRow.row.__rowId?{...r,...editRow.row,__rollbackReady:false}:r);
      }
      return rec;
    },editRow.mode==='add'?'作業を追加しました':'作業を更新しました',editRow.mode==='add'?'作業追加':'作業編集','detail',`No.${editRow.row.__no||'新規'}`);
    setEditRow(null);
  };

  const softDeleteRows=async(rowIds)=>{
    const ids=new Set(rowIds||[]);
    if(!ids.size) return;

    const targets=(record.sch||[]).filter(r=>ids.has(r.__rowId));
    if(!targets.length) return;

    const blocked=targets.filter(r=>!canDeleteRow(record,r));
    if(blocked.length){
      const added=blocked.some(r=>!getBaselineRow(record,r));
      notify(added
        ? '取込後に追加した作業は「取込時に戻す」で追加自体を取り消してください'
        : '正常な作業は直接削除できません。先に「取込時に戻す」を実行してください',{severity:'warning',title:'削除できません'});
      return;
    }

    const originalErrorCount=targets.filter(r=>hasBaselineRowError(record,r)).length;
    const note=originalErrorCount>0
      ? `（初回取込時エラー ${originalErrorCount}件を含む）`
      : '';
    if(!(await requestConfirm(`${targets.length}件の作業を削除しますか？${note}`,{title:'作業の削除',confirmLabel:'削除する',severity:'warning'}))) return;

    mutate(rec=>{
      rec.sch=rec.sch.map(r=>ids.has(r.__rowId)?{...r,__deleted:true,__deletedAt:Date.now(),__rollbackReady:false}:r);
      return rec;
    },`${targets.length}件の作業を削除しました`,'作業削除','detail',`${targets.length}件${note}`);
    setSelectedRows([]);
    if(editRow && ids.has(editRow.row.__rowId)) setEditRow(null);
  };

  const rollbackRows=async(rowIds)=>{
    const ids=[...(rowIds||[])];
    if(!ids.length) return;
    if(!(await requestConfirm(`${ids.length}件の作業を取込時の状態へ戻しますか？\n初回取り込み時点へ復元し、削除可能状態にします。`,{title:'取込時に戻す',confirmLabel:'戻す',severity:'warning'}))) return;
    setHistory(prev=>prev.map(r=>recordJobId(r)===recordJobId(record)?rollbackSelectedRows(r,ids):r));
    setSelectedRows([]);
    setEditRow(null);
    notify(`${ids.length}件の作業を取込時に戻しました`,{severity:'success'});
  };

  const rollbackImport=async()=>{
    if(!(await requestConfirm('このインポートを「取込前に戻す」状態にしますか？\n取込内容と操作履歴は監査のため保持しますが、有効な取込としては扱わなくなります。',{title:'取込前に戻す',confirmLabel:'取込前に戻す',severity:'warning'}))) return;
    setHistory(prev=>prev.map(r=>recordJobId(r)===recordJobId(record)?rollbackWholeImport(r):r));
    setSelectedRows([]);
    notify('インポートを取込前に戻しました',{severity:'success'});
  };

  const restoreDeleted=(rowId)=>{
    mutate(rec=>{
      rec.sch=rec.sch.map(r=>r.__rowId===rowId?{...r,__deleted:false,__deletedAt:null,__rollbackReady:false}:r);
      return rec;
    },'削除済み作業を復元しました','作業復元','detail',rowId);
  };

  const closeActions=()=>setActionAnchor(null);

  return <>
    <Dialog open={!!record} onClose={onClose} fullWidth maxWidth="lg">
      <DialogTitle sx={{pb:1.25}}>
        <Stack direction="row" justifyContent="space-between" alignItems="flex-start" spacing={2}>
          <Box sx={{minWidth:0}}>
            <Stack direction="row" spacing={1} alignItems="center" flexWrap="wrap">
              <Typography variant="h6" sx={{fontWeight:600}}>{record.importId || 'タグ未設定'}</Typography>
              {record.status==='RolledBack'
                ? <Chip size="small" color="warning" variant="outlined" label="取込前に戻し済"/>
                : record.status==='Canceled'
                  ? <Chip size="small" variant="outlined" label="取消"/>
                  : errorCount>0
                    ? <Chip size="small" color="error" label={`要修正 ${errorCount}件`}/>
                    : <Chip size="small" color="success" variant="outlined" label="正常"/>}
            </Stack>
            <Typography variant="caption" color="text.secondary" title={record.systemInstanceId?`SystemInstanceID ${record.systemInstanceId}`:''}>
              JobID {recordJobId(record)} ・ WorkerID {record.workerId || '-'} ・ {fmtDateTime(record.createdAt)} ・ {source}{record.updatedAt?` ・ 更新 ${fmtDateTime(record.updatedAt)}`:''}
            </Typography>
          </Box>
          <IconButton size="small" aria-label="管理操作" onClick={e=>setActionAnchor(e.currentTarget)}>
            <span className="material-icons">more_vert</span>
          </IconButton>
        </Stack>
      </DialogTitle>

      <DialogContent sx={{pt:1,pb:1}}>
        <Stack spacing={1.5}>
          <Paper variant="outlined" sx={{p:{xs:1.25,sm:1.5},boxShadow:'none',background:'#fbfdff'}}>
            <Stack direction={{xs:'column',sm:'row'}} justifyContent="space-between" alignItems={{xs:'flex-start',sm:'center'}} spacing={1} sx={{mb:(record.est||[]).length?1:0}}>
              <Box>
                <Typography variant="subtitle1" sx={{fontWeight:600}}>案件（見積）</Typography>
                <Typography variant="caption" color="text.secondary">
                  インポートID（タグ） {record.importId || '未設定'} ・ 見積明細 {(record.est||[]).length}件
                </Typography>
              </Box>
              <Stack direction="row" spacing={.75} flexWrap="wrap" useFlexGap>
                {record.status==='RolledBack' && <Chip size="small" color="warning" variant="outlined" label="取込前に戻し済"/>}
                <Chip size="small" variant="outlined" label={`作業 ${rows.length}件`}/>
              </Stack>
            </Stack>

            {(record.est||[]).length>0
              ? <Box sx={{overflowX:'auto',borderTop:'1px solid',borderColor:'divider'}}>
                  <Table>
                    <TableHead>

                      onClick={()=>setEditRow({mode:'edit',row:{...row}})}
                      title="クリックして作業を編集"
                      sx={{cursor:'pointer',...(errors.length?{background:'#fff7f7'}:{})}}
                    >
                      <TableCell padding="checkbox" onClick={e=>e.stopPropagation()}>
                        <Checkbox
                          size="small"
                          checked={selectedRows.includes(row.__rowId)}
                          onChange={e=>setSelectedRows(prev=>e.target.checked?[...prev,row.__rowId]:prev.filter(id=>id!==row.__rowId))}
                        />
                      </TableCell>
                      <TableCell sx={{verticalAlign:'top',whiteSpace:'nowrap'}}>
                        <Stack direction="row" spacing={.5} alignItems="center" flexWrap="wrap">
                          <span>{row.__no}</span>
                          {changed && <Typography component="span" variant="caption" color="warning.main">•</Typography>}
                          {row.__rollbackReady && <Chip size="small" color="warning" variant="outlined" label="戻済" sx={{height:20,'& .MuiChip-label':{px:.75,fontSize:'.68rem'}}}/>} 
                        </Stack>
                      </TableCell>
                      <TableCell sx={{verticalAlign:'middle',whiteSpace:'nowrap'}}>{row['日付']||'-'}</TableCell>
                      <TableCell sx={{verticalAlign:'middle',whiteSpace:'nowrap'}}>{row['開始']||'-'}–{row['終了']||'-'}</TableCell>
                      <TableCell sx={{verticalAlign:'middle'}}>{row['場所']||'-'}</TableCell>
                      <TableCell sx={{verticalAlign:'middle'}}>{row['作業内容']||'-'}</TableCell>
                      <TableCell sx={{verticalAlign:'middle'}}>{row['担当']||'-'}</TableCell>
                      <TableCell sx={{verticalAlign:'middle'}} onClick={e=>e.stopPropagation()}>
                        <Stack direction="row" spacing={.5} alignItems="center" flexWrap="wrap" useFlexGap>
                          {errors.length>0
                            ? <Chip
                                size="small"
                                color="error"
                                label={`要修正 ${errors.length}`}
                                onClick={()=>setRowDetailId(row.__rowId)}
                                sx={{cursor:'pointer'}}
                              />
                            : <Chip size="small" color="success" variant="outlined" label="正常"/>}
                          {String(row['メモ']||'').trim() && <IconButton
                            size="small"
                            aria-label="メモを表示"
                            title="メモを表示"
                            onClick={()=>setRowDetailId(row.__rowId)}
                            sx={{p:.25}}
                          >
                            <span className="material-icons" style={{fontSize:'1.1rem'}}>comment</span>
                          </IconButton>}
                        </Stack>
                      </TableCell>
                    </TableRow>;
                  })}
                  {filteredRows.length===0 && <TableRow><TableCell colSpan={8} className="muted" sx={{py:3,textAlign:'center'}}>該当する作業はありません。</TableCell></TableRow>}
                </TableBody>
              </Table>
            </Box>
          </Box>
        </Stack>
      </DialogContent>

      <DialogActions sx={{px:3,py:1.5,borderTop:'1px solid',borderColor:'divider'}}>
        <Button onClick={onClose}>閉じる</Button>
      </DialogActions>

      <Menu anchorEl={actionAnchor} open={Boolean(actionAnchor)} onClose={closeActions} anchorOrigin={{vertical:'bottom',horizontal:'right'}} transformOrigin={{vertical:'top',horizontal:'right'}}>
        <MenuItem onClick={()=>{closeActions();setIdEdit(true);}}>インポートID（タグ）変更</MenuItem>
        {record.mode!=='api' && <MenuItem onClick={()=>{closeActions();onEditSource(record);}}>元データ編集</MenuItem>}
        {record.status==='Active' && <MenuItem onClick={()=>{closeActions();rollbackImport();}}>取込前に戻す</MenuItem>}
        {(record.audit||[]).length>0 && <MenuItem onClick={()=>{closeActions();setAuditOpen(true);}}>変更履歴</MenuItem>}
        {deletedRows.length>0 && <MenuItem onClick={()=>{closeActions();setDeletedOpen(true);}}>削除済み作業 ({deletedRows.length})</MenuItem>}
        {record.status==='Active'
          ? <MenuItem onClick={()=>{closeActions();onCancel(recordJobId(record));}}>取消</MenuItem>
          : <MenuItem onClick={()=>{closeActions();onRestore(recordJobId(record));}}>復元</MenuItem>}
        <Divider/>
        <MenuItem
          disabled={!importCanDelete}
          sx={importCanDelete?{color:'error.main'}:{}}
          title={importCanDelete
            ? (hasBaselineImportError(record)?'初回取込時点からエラーがあるため直接削除できます':'取込前に戻し済みのため削除できます')
            : '正常な案件は直接削除できません。先に「取込前に戻す」を実行してください'}
          onClick={()=>{if(!importCanDelete)return;closeActions();onDelete(recordJobId(record));}}
        >
          削除
        </MenuItem>
      </Menu>
    </Dialog>

    <Dialog open={!!rowDetail} onClose={()=>setRowDetailId(null)} fullWidth maxWidth="sm">
      <DialogTitle>作業詳細{rowDetail?.__no?` No.${rowDetail.__no}`:''}</DialogTitle>
      <DialogContent dividers>
        {rowDetail && <Stack spacing={2}>
          <Box>
            <Stack direction={{xs:'column',sm:'row'}} spacing={{xs:.5,sm:2}} flexWrap="wrap" useFlexGap>
              <Typography variant="body2"><b>日付：</b>{rowDetail['日付']||'-'}</Typography>
              <Typography variant="body2"><b>時間：</b>{rowDetail['開始']||'-'}–{rowDetail['終了']||'-'}</Typography>
              <Typography variant="body2"><b>場所：</b>{rowDetail['場所']||'-'}</Typography>
              <Typography variant="body2"><b>担当：</b>{rowDetail['担当']||'-'}</Typography>
            </Stack>
            <Typography variant="body2" sx={{mt:.75}}><b>作業内容：</b>{rowDetail['作業内容']||'-'}</Typography>
          </Box>

          {rowDetailErrors.length>0 && <Box>
            <Stack direction="row" spacing={1} alignItems="center" sx={{mb:1}}>
              <Typography variant="subtitle2" sx={{fontWeight:600}}>エラー</Typography>
              <Chip size="small" color="error" label={`${rowDetailErrors.length}件`}/>
            </Stack>
            <Stack spacing={.75}>
              {rowDetailErrors.map((err,i)=><Alert key={`${err.field}-${i}`} severity="error" variant="outlined" sx={{py:.25}}>
                <Typography variant="body2"><b>{err.field}</b>：{err.message}</Typography>
              </Alert>)}
            </Stack>
          </Box>}

          {String(rowDetail['メモ']||'').trim() && <Box>
            <Typography variant="subtitle2" sx={{fontWeight:600,mb:.75}}>メモ</Typography>
            <Paper variant="outlined" sx={{p:1.25,boxShadow:'none',background:'#fafafa'}}>
              <Typography variant="body2" sx={{whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{rowDetail['メモ']}</Typography>
            </Paper>
          </Box>}

          {rowDetailErrors.length===0 && !String(rowDetail['メモ']||'').trim() &&
            <Typography variant="body2" color="text.secondary">確認事項はありません。</Typography>}
        </Stack>}
      </DialogContent>
      <DialogActions>
        <Button onClick={()=>setRowDetailId(null)}>閉じる</Button>
        {rowDetail && <Button variant="contained" onClick={()=>{const row={...rowDetail};setRowDetailId(null);setEditRow({mode:'edit',row});}}>作業を編集</Button>}
      </DialogActions>
    </Dialog>

    <Dialog open={!!editRow} onClose={()=>setEditRow(null)} fullWidth maxWidth="sm">
      <DialogTitle>{editRow?.mode==='add'?'作業追加':`作業編集 No.${editRow?.row?.__no||''}`}</DialogTitle>
      <DialogContent sx={{pt:1}}>
        {editRow && <Stack spacing={2} sx={{pt:1}}>
          <Stack direction={{xs:'column',sm:'row'}} spacing={2}>
            <TextField fullWidth size="small" type="date" label="日付" value={editRow.row['日付']||''} InputLabelProps={{shrink:true}} onChange={e=>setEditRow({...editRow,row:{...editRow.row,日付:e.target.value}})}/>
            <TextField fullWidth size="small" type="time" label="開始" value={editRow.row['開始']||''} InputLabelProps={{shrink:true}} onChange={e=>setEditRow({...editRow,row:{...editRow.row,開始:e.target.value}})}/>
            <TextField fullWidth size="small" type="time" label="終了" value={editRow.row['終了']||''} InputLabelProps={{shrink:true}} onChange={e=>setEditRow({...editRow,row:{...editRow.row,終了:e.target.value}})}/>
          </Stack>
          <Stack direction={{xs:'column',sm:'row'}} spacing={2}>
            <TextField fullWidth size="small" label="場所" value={editRow.row['場所']||''} onChange={e=>setEditRow({...editRow,row:{...editRow.row,場所:e.target.value}})}/>
            <TextField fullWidth size="small" label="担当" value={editRow.row['担当']||''} onChange={e=>setEditRow({...editRow,row:{...editRow.row,担当:e.target.value}})}/>
          </Stack>
          <TextField fullWidth size="small" label="作業内容" value={editRow.row['作業内容']||''} onChange={e=>setEditRow({...editRow,row:{...editRow.row,作業内容:e.target.value}})}/>
          <TextField fullWidth size="small" label="メモ" value={editRow.row['メモ']||''} onChange={e=>setEditRow({...editRow,row:{...editRow.row,メモ:e.target.value}})}/>
          {validateScheduleRow(editRow.row).length>0 && <Box sx={{pt:.5}}>{validateScheduleRow(editRow.row).map((e,i)=><Typography key={i} variant="caption" color="error" display="block">{e.message}</Typography>)}</Box>}
        </Stack>}
      </DialogContent>
      <DialogActions sx={{justifyContent:'space-between'}}>
        <Stack direction="row" spacing={1}>
          {editRow?.mode==='edit' && storedEditRow && !hasBaselineRowError(record,storedEditRow) && !storedEditRow.__rollbackReady && <Button onClick={()=>rollbackRows([editRow.row.__rowId])}>取込時に戻す</Button>}
          {editRow?.mode==='edit' && <Button
            color="error"
            disabled={!editRowCanDelete}
            title={editRowCanDelete
              ? (hasBaselineRowError(record,storedEditRow)?'初回取込時点からエラーの作業なので直接削除できます':'取込時に戻し済みのため削除できます')
              : (!storedEditRow || !getBaselineRow(record,storedEditRow)
                  ? '取込後に追加した作業は「取込時に戻す」で追加自体を取り消してください'
                  : '正常な作業は直接削除できません。先に「取込時に戻す」を実行してください')}
            onClick={()=>softDeleteRows([editRow.row.__rowId])}
          >削除</Button>}
        </Stack>
        <Stack direction="row" spacing={1}>
          <Button onClick={()=>setEditRow(null)}>キャンセル</Button>
          <Button variant="contained" onClick={saveRow}>保存</Button>
        </Stack>
      </DialogActions>
    </Dialog>

    <Dialog open={idEdit} onClose={()=>setIdEdit(false)} fullWidth maxWidth="xs">
      <DialogTitle>インポートID（タグ）変更</DialogTitle>
      <DialogContent sx={{pt:1}}><TextField fullWidth size="small" label="インポートID（タグ）" value={importId} onChange={e=>setImportId(e.target.value)} sx={{mt:1}}/></DialogContent>
      <DialogActions><Button onClick={()=>setIdEdit(false)}>キャンセル</Button><Button variant="contained" onClick={saveImportId}>保存</Button></DialogActions>
    </Dialog>

    <Dialog open={auditOpen} onClose={()=>setAuditOpen(false)} fullWidth maxWidth="sm">
      <DialogTitle>変更履歴</DialogTitle>
      <DialogContent dividers>
        {(record.audit||[]).length===0
          ? <Typography className="muted">変更履歴はありません。</Typography>
          : <Stack divider={<Divider flexItem/>}>{[...(record.audit||[])].reverse().map(a=><Box key={a.id} sx={{py:1}}>
              <Typography variant="body2" sx={{fontWeight:500}}>{a.action}</Typography>
              <Typography variant="caption" color="text.secondary">{fmtDateTime(a.at)} ・ {a.scope}{a.detail?` ・ ${a.detail}`:''}</Typography>
            </Box>)}</Stack>}
      </DialogContent>
      <DialogActions><Button onClick={()=>setAuditOpen(false)}>閉じる</Button></DialogActions>
    </Dialog>

    <Dialog open={deletedOpen} onClose={()=>setDeletedOpen(false)} fullWidth maxWidth="md">
      <DialogTitle>削除済み作業</DialogTitle>
      <DialogContent dividers>
        <Table>
          <TableHead><TableRow><TableCell width={64}>No.</TableCell><TableCell>作業内容</TableCell><TableCell>削除日時</TableCell><TableCell align="right">操作</TableCell></TableRow></TableHead>
          <TableBody>
            {deletedRows.map(row=><TableRow key={row.__rowId}>
              <TableCell>{row.__no}</TableCell>
              <TableCell>{row['日付']} {row['開始']}–{row['終了']} / {row['場所']} / {row['作業内容']} / {row['担当']}</TableCell>
              <TableCell>{row.__deletedAt?fmtDateTime(row.__deletedAt):'-'}</TableCell>
              <TableCell align="right"><Button size="small" onClick={()=>restoreDeleted(row.__rowId)}>復元</Button></TableCell>
            </TableRow>)}
          </TableBody>
        </Table>
      </DialogContent>
      <DialogActions><Button onClick={()=>setDeletedOpen(false)}>閉じる</Button></DialogActions>
    </Dialog>
  </>;
}

/* =========================
   メインアプリ
========================= */
function App(){
  const [tab,setTab]=React.useState(0);
  const [mode,setMode]=React.useState('two');
  const [twoSets,setTwoSets]=React.useState([{importId:'SET001',est:[],sch:[]}]);
  const [oneRawRows,setOneRawRows]=React.useState([]);
  const [oneSets,setOneSets]=React.useState([]);
  const [activeImport,setActiveImport]=React.useState(false);
  const [editTargetId,setEditTargetId]=React.useState(null);
  const [messageDialog,setMessageDialog]=React.useState(null);
  const messageDialogResolver=React.useRef(null);
  const [mockApiLoading,setMockApiLoading]=React.useState(false);
  const [detailId,setDetailId]=React.useState(null);
  const [historyQuery,setHistoryQuery]=React.useState('');
  const [selectedImports,setSelectedImports]=React.useState([]);
  const [importResult,setImportResult]=React.useState(null);
  const [systemError,setSystemError]=React.useState(null);

  const notify=React.useCallback((message,options={})=>{
    setMessageDialog({
      mode:'notice',
      title:options.title || (options.severity==='error'?'エラー':options.severity==='warning'?'確認':'お知らせ'),
      message:String(message??''),
      severity:options.severity || 'info',
      confirmLabel:options.confirmLabel || '閉じる'
    });
  },[]);

  const requestConfirm=React.useCallback((message,options={})=>new Promise(resolve=>{
    if(messageDialogResolver.current){
      messageDialogResolver.current(false);
      messageDialogResolver.current=null;
    }
    messageDialogResolver.current=resolve;
    setMessageDialog({
      mode:'confirm',
      title:options.title || '確認',
      message:String(message??''),
      severity:options.severity || 'warning',
      confirmLabel:options.confirmLabel || '実行する',
      cancelLabel:options.cancelLabel || 'キャンセル'
    });
  }),[]);

  const closeMessageDialog=(result=false)=>{
    const resolver=messageDialogResolver.current;
    messageDialogResolver.current=null;
    setMessageDialog(null);
    if(resolver) resolver(Boolean(result));
  };

  const HISTORY_KEY='estimate_schedule_history_v13';
  const LEGACY_KEYS=['estimate_schedule_history_v12','estimate_schedule_history_v11','estimate_schedule_history_v10','estimate_schedule_history_v9','estimate_schedule_history_v8','estimate_schedule_history_v6','estimate_schedule_history_v3'];

  const [history,setHistory]=React.useState(()=>{
    try{
      const current=localStorage.getItem(HISTORY_KEY);
      if(current) return migrateHistory(JSON.parse(current));
      for(const key of LEGACY_KEYS){
        const legacy=localStorage.getItem(key);
        if(legacy) return migrateHistory(JSON.parse(legacy));
      }
      return [];
    }catch(e){
      return [];
    }
  });

  React.useEffect(()=>{
    try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history));}catch(e){}
  },[history]);

  const detail=history.find(r=>recordJobId(r)===String(detailId))||null;

  const groupOneRows=(rows)=>{
    const grouped={};
    rows.forEach(r=>{
      const id=String(r['見積ID']||'').trim();
      if(!id) return;
      if(!grouped[id]) grouped[id]={importId:id,est:[],sch:[]};
      if(r['種別']==='見積'){
        grouped[id].est.push({項目:r['項目'],数量:r['数量'],単価:r['単価'],小計:r['小計'],メモ:r['メモ']});
      }else if(r['種別']==='スケジュール'){
        grouped[id].sch.push({日付:r['日付'],開始:r['開始'],終了:r['終了'],場所:r['場所'],作業内容:r['作業内容'],担当:r['担当'],メモ:r['メモ']});
      }
    });
    setOneSets(Object.values(grouped));
  };

  const currentCandidates=()=>mode==='two'
    ? twoSets.filter(s=>(s.est||[]).length || (s.sch||[]).length)
    : oneSets;

  const showImportOutcome=(records,kind='import')=>{
    const errors=records.reduce((n,r)=>n+countImportErrors(r),0);
    if(errors>0){
      const firstError=records.find(r=>countImportErrors(r)>0);
      setImportResult({imports:records.length,errors,firstErrorJobId:firstError?recordJobId(firstError):null,kind});
    }else{
      notify(kind==='api'?`API受信完了：${records.length}件`:`${records.length}件のインポートが完了しました`,{severity:'success'});
    }
  };

  const handleImport=()=>{
    try{
      const active=currentCandidates();
      if(!active.length){notify('取り込むデータがありません',{severity:'warning'});return;}

      if(editTargetId){
        const first=active[0];
        setHistory(prev=>prev.map(rec=>{
          if(recordJobId(rec)!==String(editTargetId)) return rec;
          const reference=rec.sch||[];
          const sch=normalizeScheduleRows(first.sch||[],reference).map((row,index)=>{
            const original=(rec.baseline?.sch||[]).find(b=>b.__rowId===row.__rowId);
            return {...row,__createdAfterImport:!original,__deleted:false,__deletedAt:null,__rollbackReady:false};
          });
          let next={...rec,importId:first.importId??rec.importId,est:deepClone(first.est||[]),sch,mode,source:null,status:'Active',__rollbackReady:false,updatedAt:Date.now()};
          next=addAudit(next,'元データ編集','import','CSV入力画面から更新');
          return next;
        }));
        notify('インポートを更新しました',{severity:'success'});
        setActiveImport(false);setEditTargetId(null);setTab(1);
        return;
      }

      const now=Date.now();
      const records=active.map((item,idx)=>createImportRecord({
        importId:item.importId ?? `IMPORT${String(idx+1).padStart(3,'0')}`,
        createdAt:now+idx,
        updatedAt:null,
        status:'Active',
        mode,
        source:null,
        est:item.est||[],
        sch:item.sch||[]
      },history));
      setHistory(prev=>[...records,...prev]);
      setActiveImport(false);setEditTargetId(null);setTab(1);
      showImportOutcome(records,'import');
    }catch(e){
      const errorId=`ERR-${Date.now()}`;
      setSystemError({errorId,message:'インポート処理中に問題が発生しました。',detail:String(e?.stack||e?.message||e)});
    }
  };

  const startNewImport=()=>{
    setActiveImport(true);setEditTargetId(null);setMode('two');
    setTwoSets([{importId:'SET001',est:[],sch:[]}]);setOneRawRows([]);setOneSets([]);setTab(0);
    notify('新規取り込みを開始しました',{severity:'info'});
  };

  const editHistory=(rec)=>{
    setMode(rec.mode==='one'?'one':'two');
    const candidate={importId:rec.importId,est:deepClone(rec.est||[]),sch:activeScheduleRows(rec).map(row=>rowData(row))};
    if(rec.mode==='one'){
      setOneRawRows([]);setOneSets([candidate]);setTwoSets([{importId:'SET001',est:[],sch:[]}]);
    }else{
      setTwoSets([candidate]);setOneRawRows([]);setOneSets([]);
    }
    setActiveImport(true);setEditTargetId(recordJobId(rec));setDetailId(null);setTab(0);
    notify('インポートを編集モードで読み込みました',{severity:'info'});
  };

  const cancelHistory=(jobId)=>{
    setHistory(prev=>prev.map(r=>recordJobId(r)===String(jobId)?addAudit({...r,status:'Canceled',__rollbackReady:false,updatedAt:Date.now()},'取消','import','インポートを論理取消'):r));
    notify('インポートを取消しました',{severity:'success'});
  };

  const restoreHistory=(jobId)=>{
    const target=history.find(r=>recordJobId(r)===String(jobId));
    const restoredFrom=target?.status || 'Canceled';
    setHistory(prev=>prev.map(r=>{
      if(recordJobId(r)!==String(jobId)) return r;
      const action=r.status==='RolledBack'?'取込前状態から復元':'取消復元';
      const detail=r.status==='RolledBack'?'取込前に戻したインポートを再度有効化':'取消状態を復元';
      return addAudit({...r,status:'Active',__rollbackReady:false,updatedAt:Date.now()},action,'import',detail);
    }));
    notify(restoredFrom==='RolledBack'?'インポートを再度有効化しました':'取消を復元しました',{severity:'success'});
  };

  const deleteHistory=async(jobId)=>{
    const target=history.find(r=>recordJobId(r)===String(jobId));
    if(!target){
      notify('削除対象のインポートが見つかりません',{severity:'warning'});
      return;
    }
    if(!canDeleteImport(target)){
      notify('正常な案件は直接削除できません。先に「取込前に戻す」を実行してください',{severity:'warning',title:'削除できません'});
      return;
    }

    const initialError=hasBaselineImportError(target);
    const message=initialError
      ? 'この案件は初回取込時点からエラーを含みます。削除しますか？'
      : `JobID ${recordJobId(target)} の取込を削除しますか？`;
    if(!(await requestConfirm(message,{title:'インポートの削除',confirmLabel:'削除する',severity:'warning'}))) return;

    setHistory(prev=>prev.filter(r=>recordJobId(r)!==String(jobId)));
    if(String(detailId)===String(jobId)) setDetailId(null);
    setSelectedImports(prev=>prev.filter(x=>String(x)!==String(jobId)));
    notify(initialError?'取込エラーの案件を削除しました':'取込前に戻した案件を削除しました',{severity:'success'});
  };

  const rollbackImports=async(jobIds)=>{
    const target=[...(jobIds||[])];
    if(!target.length) return;
    if(!(await requestConfirm(`${target.length}件のインポートを「取込前に戻す」状態にしますか？\n取込内容と操作履歴は監査のため保持します。`,{title:'取込前に戻す',confirmLabel:'取込前に戻す',severity:'warning'}))) return;
    const idSet=new Set(target.map(String));
    setHistory(prev=>prev.map(r=>idSet.has(recordJobId(r))?rollbackWholeImport(r):r));
    setSelectedImports([]);
    notify(`${target.length}件のインポートを取込前に戻しました`,{severity:'success'});
  };

  const cancelImports=(jobIds)=>{
    const target=[...(jobIds||[])];
    if(!target.length) return;
    const idSet=new Set(target.map(String));
    setHistory(prev=>prev.map(r=>idSet.has(recordJobId(r))?addAudit({...r,status:'Canceled',__rollbackReady:false,updatedAt:Date.now()},'一括取消','import',`${target.length}件選択`):r));
    setSelectedImports([]);
    notify(`${target.length}件を取消しました`,{severity:'success'});
  };

  const runMockApi=async()=>{
    if(mockApiLoading) return;
    setMockApiLoading(true);
    try{
      const imports=await mockApiFetch();
      const now=Date.now();
      const records=imports.map((item,idx)=>createImportRecord({
        importId:item.importId,
        createdAt:now+idx,
        updatedAt:null,
        status:'Active',
        mode:'api',
        source:'Mock API',
        est:item.est||[],
        sch:item.sch||[]
      },history));
      setHistory(prev=>[...records,...prev]);
      setTab(1);setDetailId(null);
      showImportOutcome(records,'api');
    }catch(e){
      const errorId=`API-${Date.now()}`;
      setSystemError({errorId,message:'APIとの通信または処理に失敗しました。時間をおいて再度実行してください。',detail:String(e?.stack||e?.message||e)});
    }finally{
      setMockApiLoading(false);
    }
  };

  const dlEstimateTpl=()=>toCSV('estimate_template.csv',[["項目","数量","単価","小計","メモ"],["開発一式",1,100000,"","一括見積"]]);
  const dlScheduleTpl=()=>toCSV('schedule_template.csv',[["日付","開始","終了","場所","作業内容","担当","メモ"],["2026-10-08","09:00","12:00","東京店","作業A","山田",""]]);
  const dlOneFileTpl=()=>toCSV('onefile_template.csv',[
    ['種別','見積ID','項目','数量','単価','小計','メモ','日付','開始','終了','場所','作業内容','担当'],
    ['見積','EST001','開発一式',1,100000,'','一括見積','','','','','',''],
    ['見積','EST002','保守',12,5000,'','月次対応','','','','','',''],
    ['スケジュール','EST001','','','','','','2026-10-08','09:00','12:00','東京店','設計','山田'],
    ['スケジュール','EST001','','','','','','2026-10-08','13:00','17:00','東京店','実装','佐藤'],
    ['スケジュール','EST002','','','','','','2026-10-10','10:00','12:00','リモート','月次対応','高橋']
  ]);

  const historySorted=[...history].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const hq=historyQuery.trim().toLowerCase();
  const historyFiltered=historySorted.filter(rec=>!hq || recordSearchText(rec).includes(hq));
  const visibleImportIds=historyFiltered.map(r=>recordJobId(r));
  const allImportsChecked=visibleImportIds.length>0 && visibleImportIds.every(id=>selectedImports.map(String).includes(id));
  const someImportsChecked=visibleImportIds.some(id=>selectedImports.map(String).includes(id));

  return <ThemeProvider theme={theme}>
    <CssBaseline/>

    <AppBar position="sticky" color="primary">
      <Toolbar>
        <Typography variant="h6" sx={{flexGrow:1,fontWeight:500}}>見積＆スケジュール 取込システム</Typography>
        <Stack direction="row" spacing={1}>
          <Button
            color="inherit"
            variant="outlined"
            disabled={mockApiLoading}
            startIcon={<span className="material-icons">api</span>}
            title="クリック: サンプルAPI / Shift+クリック: システムエラーを再現"
            onClick={e=>{
              if(e.shiftKey){
                setSystemError({
                  errorId:`MOCK-${Date.now()}`,
                  message:'モックAPIでシステムエラーを再現しました。',
                  detail:'HTTP 500 / Internal Server Error\ntraceId: mock-trace-id'
                });
                return;
              }
              runMockApi();
            }}
            sx={{borderColor:'rgba(255,255,255,.7)',color:'#fff'}}
          >
            {mockApiLoading?'API取得中...':'モックAPI'}
          </Button>
          <Button color="inherit" variant="outlined" startIcon={<span className="material-icons">add</span>} onClick={startNewImport} sx={{borderColor:'#fff',color:'#fff'}}>
            新規取り込み
          </Button>
        </Stack>
      </Toolbar>
    </AppBar>

    <Tabs value={tab} onChange={(e,v)=>setTab(v)} variant="fullWidth" sx={{background:'#fff',borderBottom:'1px solid #e0e0e0'}}>
      <Tab label="データ取り込み"/><Tab label="取り込み履歴"/>
    </Tabs>

    <Container className="main-container" maxWidth={false} disableGutters sx={{px:{xs:1.5,sm:2,md:2.5,lg:3},py:{xs:1.75,md:2}}}>
      {tab===0 && <Box sx={{width:'100%',maxWidth:'1440px',mx:'auto'}}>
        <Alert severity="info" sx={{mb:1.5}}>このシステム固有のWorkerID <Box component="span" className="mono" sx={{mx:.5}}>{SYSTEM_IDENTITY.workerId}</Box> を使ってJobIDを自動発行します。インポートIDはユーザーが設定できる案件タグです。</Alert>

        <Paper className="business-card" sx={{p:{xs:2,md:2},mb:1.75}}>
          <Stack direction={{xs:'column',md:'row'}} alignItems={{xs:'flex-start',md:'center'}} spacing={2}>
            <Typography variant="subtitle2" sx={{color:'#475569',minWidth:'120px'}}>取り込み方式</Typography>
            <RadioGroup row value={mode} onChange={e=>setMode(e.target.value)} sx={{flexGrow:1}}>
              <FormControlLabel value="two" control={<Radio/>} label="2ファイル方式"/>
              <FormControlLabel value="one" control={<Radio/>} label="1ファイル方式"/>
            </RadioGroup>
            {editTargetId?<Chip color="warning" label="編集中"/>:activeImport?<Chip color="success" label="作業中"/>:<Chip variant="outlined" label="未開始"/>}
          </Stack>
        </Paper>

        {mode==='two' && <Box>
          {twoSets.map((s,idx)=><Paper key={idx} sx={{p:{xs:1.75,md:2},mb:1.5}}>
            <Stack direction={{xs:'column',md:'row'}} justifyContent="space-between" spacing={2} sx={{mb:1.5}}>
              <Stack direction="row" alignItems="center" spacing={1}>
                <Typography variant="subtitle1">インポート {idx+1}</Typography>
                <TextField size="small" label="インポートID（タグ）" value={s.importId||''} onChange={e=>{const v=e.target.value;setTwoSets(prev=>{const cp=[...prev];cp[idx]={...cp[idx],importId:v};return cp;});setActiveImport(true);}}/>
              </Stack>
              <Stack direction="row" spacing={1}>
                <Button size="small" variant="outlined" onClick={()=>{setTwoSets(prev=>{const cp=[...prev];cp[idx]={...cp[idx],est:parseCSV(sampleEstCSV),sch:parseCSV(sampleSchCSV)};return cp;});setActiveImport(true);notify(`インポート ${idx+1} にサンプルを反映しました`,{severity:'success'});}}>サンプル反映</Button>
                {!editTargetId && <Button size="small" color="error" onClick={()=>setTwoSets(prev=>prev.length>1?prev.filter((_,i)=>i!==idx):[{importId:'SET001',est:[],sch:[]}])}>削除</Button>}
              </Stack>
            </Stack>
            <Stack direction={{xs:'column',md:'row'}} spacing={2}>
              <FileImport label="見積CSV" hint="項目,数量,単価,小計,メモ" rows={s.est} onRows={rows=>{setActiveImport(true);setTwoSets(prev=>{const cp=[...prev];cp[idx]={...cp[idx],est:rows};return cp;});}}/>
              <FileImport label="作業（スケジュール）CSV" hint="日付,開始,終了,場所,作業内容,担当,メモ" rows={s.sch} onRows={rows=>{setActiveImport(true);setTwoSets(prev=>{const cp=[...prev];cp[idx]={...cp[idx],sch:rows};return cp;});}}/>
            </Stack>
          </Paper>)}
          {!editTargetId && <Stack direction="row" spacing={1} sx={{mb:1.5}} flexWrap="wrap" useFlexGap>
            <Button variant="outlined" startIcon={<span className="material-icons">playlist_add</span>} onClick={()=>setTwoSets(prev=>[...prev,{importId:`SET${String(prev.length+1).padStart(3,'0')}`,est:[],sch:[]}])}>インポートを追加</Button>
            <Button onClick={dlEstimateTpl}>見積テンプレDL</Button><Button onClick={dlScheduleTpl}>スケジュールテンプレDL</Button>
          </Stack>}
        </Box>}

        {mode==='one' && <Paper sx={{p:{xs:1.75,md:2},mb:1.5}}>
          <FileImport label="1ファイルCSV（見積＋スケジュール）" hint="見積IDをインポートID（タグ）として、見積IDごとに独立したJobを作成します" rows={oneRawRows} onRows={rows=>{setActiveImport(true);setOneRawRows(rows);groupOneRows(rows);}}/>
          <Stack direction="row" spacing={1} sx={{mt:1.5}}>
            <Button variant="outlined" onClick={()=>{const rows=parseCSV(sampleOneCSV);setActiveImport(true);setOneRawRows(rows);groupOneRows(rows);notify('1ファイルのサンプルを反映しました',{severity:'success'});}}>サンプル反映</Button>
            <Button onClick={dlOneFileTpl}>テンプレDL</Button>
          </Stack>
        </Paper>}

        <Divider sx={{my:1.5}}/><Typography variant="h6" sx={{mb:1}}>確認</Typography><ImportPreview imports={currentCandidates()}/>
        <Stack direction="row" spacing={1} sx={{mt:1.5}} flexWrap="wrap" useFlexGap>
          <Button variant="contained" onClick={handleImport} disabled={!activeImport && !editTargetId}>{editTargetId?'更新する':'取り込み実行'}</Button>
          <Button variant="text" onClick={startNewImport}>やり直す</Button>
        </Stack>
      </Box>}

      {tab===1 && <Box>
        <Stack direction={{xs:'column',md:'row'}} justifyContent="space-between" alignItems={{xs:'stretch',md:'center'}} spacing={1} sx={{mb:1.25}}>
          <Stack direction="row" spacing={1} alignItems="baseline"><Typography variant="h6">取り込み履歴</Typography><Typography className="muted">{historyFiltered.length}件</Typography></Stack>
          <TextField size="small" value={historyQuery} onChange={e=>setHistoryQuery(e.target.value)} placeholder="インポート内容を検索" sx={{width:{xs:'100%',md:320}}}/>
        </Stack>

        {selectedImports.length>0 && <Stack direction={{xs:'column',sm:'row'}} spacing={1} alignItems={{xs:'stretch',sm:'center'}} sx={{mb:1}}>
          <Typography variant="body2" color="text.secondary" sx={{mr:1}}>{selectedImports.length}件選択</Typography>
          <Button size="small" onClick={()=>rollbackImports(selectedImports)}>取込前に戻す</Button>
          <Button size="small" color="warning" onClick={()=>cancelImports(selectedImports)}>取消</Button>
        </Stack>}

        <Paper>
          <Box className="tableWrap">
            <Table stickyHeader>
              <TableHead><TableRow>
                <TableCell padding="checkbox" sx={{width:48}}>
                  <Checkbox size="small" checked={allImportsChecked} indeterminate={!allImportsChecked&&someImportsChecked} onChange={e=>{
                    if(e.target.checked) setSelectedImports(prev=>Array.from(new Set([...prev,...visibleImportIds])));
                    else setSelectedImports(prev=>prev.filter(id=>!visibleImportIds.includes(String(id))));
                  }}/>
                </TableCell>
                <TableCell sx={{width:64}}>No.</TableCell>
                <TableCell>JobID</TableCell><TableCell>インポートID（タグ）</TableCell><TableCell>取込日時</TableCell><TableCell>取込元</TableCell><TableCell>作業</TableCell><TableCell>状態</TableCell><TableCell align="right">操作</TableCell>
              </TableRow></TableHead>
              <TableBody>
                {historyFiltered.map((rec,index)=>{
                  const errorCount=countImportErrors(rec);
                  const source=rec.source || (rec.mode==='two'?'CSV（2ファイル）':rec.mode==='one'?'CSV（1ファイル）':'API');
                  const jobId=recordJobId(rec);
                  return <TableRow key={jobId} hover sx={{cursor:'pointer'}} onClick={()=>setDetailId(jobId)}>
                    <TableCell padding="checkbox" onClick={e=>e.stopPropagation()}><Checkbox size="small" checked={selectedImports.map(String).includes(jobId)} onChange={e=>setSelectedImports(prev=>e.target.checked?[...prev,jobId]:prev.filter(id=>String(id)!==jobId))}/></TableCell>
                    <TableCell>{index+1}</TableCell>
                    <TableCell className="mono" sx={{whiteSpace:'nowrap',fontSize:'.75rem'}}>{jobId}</TableCell>
                    <TableCell sx={{fontWeight:500}}>{rec.importId || <Typography component="span" variant="body2" color="text.secondary">未設定</Typography>}</TableCell>
                    <TableCell>{fmtDateTime(rec.createdAt)}</TableCell><TableCell>{source}</TableCell><TableCell>{activeScheduleRows(rec).length}件</TableCell>
                    <TableCell>{rec.status==='RolledBack'?<Chip size="small" color="warning" variant="outlined" label="取込前に戻し済"/>:rec.status==='Canceled'?<Chip size="small" variant="outlined" label="取消"/>:errorCount>0?<Chip size="small" color="error" label={`要修正 ${errorCount}件`}/>:<Chip size="small" color="success" variant="outlined" label="正常"/>}</TableCell>
                    <TableCell align="right"><Button size="small" onClick={e=>{e.stopPropagation();setDetailId(jobId);}}>詳細</Button></TableCell>
                  </TableRow>;
                })}
                {historyFiltered.length===0 && <TableRow><TableCell colSpan={9} className="muted" sx={{py:3,textAlign:'center'}}>該当する履歴はありません。</TableCell></TableRow>}
              </TableBody>
            </Table>
          </Box>
        </Paper>

        <ImportDetailDialog record={detail} onClose={()=>setDetailId(null)} setHistory={setHistory} notify={notify} requestConfirm={requestConfirm} onEditSource={editHistory} onDelete={deleteHistory} onCancel={cancelHistory} onRestore={restoreHistory}/>
      </Box>}
    </Container>

    <Dialog open={!!importResult} onClose={()=>setImportResult(null)} fullWidth maxWidth="xs">
      <DialogTitle>取り込み結果</DialogTitle>
      <DialogContent sx={{pt:1}}>
        {importResult && <Typography variant="body2">
          {importResult.imports}件のインポートを処理しました。<br/>
          <b>{importResult.errors}件</b>の作業に確認が必要です。
        </Typography>}
      </DialogContent>
      <DialogActions>
        <Button onClick={()=>setImportResult(null)}>閉じる</Button>
        {importResult?.firstErrorJobId && <Button variant="contained" onClick={()=>{const jobId=importResult.firstErrorJobId;setImportResult(null);setTab(1);setDetailId(jobId);}}>エラーを確認</Button>}
      </DialogActions>
    </Dialog>

    <Dialog open={!!systemError} onClose={()=>setSystemError(null)} fullWidth maxWidth="sm">
      <DialogTitle>処理に失敗しました</DialogTitle>
      <DialogContent sx={{pt:1}}>
        {systemError && <Stack spacing={1.5}>
          <Typography variant="body2">{systemError.message}</Typography>
          <Typography variant="body2"><b>エラーID：</b>{systemError.errorId}</Typography>
          <Accordion elevation={0} disableGutters sx={{boxShadow:'none','&:before':{display:'none'}}}>
            <AccordionSummary expandIcon={<span className="material-icons">expand_more</span>} sx={{px:0}}><Typography variant="body2">詳細情報</Typography></AccordionSummary>
            <AccordionDetails sx={{px:0,pt:0}}><Typography variant="caption" component="pre" sx={{whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{systemError.detail}</Typography></AccordionDetails>
          </Accordion>
        </Stack>}
      </DialogContent>
      <DialogActions><Button variant="contained" onClick={()=>setSystemError(null)}>閉じる</Button></DialogActions>
    </Dialog>

    <Dialog
      open={!!messageDialog}
      onClose={()=>{ if(messageDialog?.mode==='confirm') closeMessageDialog(false); else closeMessageDialog(false); }}
      fullWidth
      maxWidth="xs"
    >
      <DialogTitle>{messageDialog?.title || 'お知らせ'}</DialogTitle>
      <DialogContent sx={{pt:1}}>
        {messageDialog && <Alert severity={messageDialog.severity || 'info'} variant="outlined" sx={{alignItems:'flex-start'}}>
          <Typography variant="body2" sx={{whiteSpace:'pre-line'}}>{messageDialog.message}</Typography>
        </Alert>}
      </DialogContent>
      <DialogActions>
        {messageDialog?.mode==='confirm' && <Button onClick={()=>closeMessageDialog(false)}>{messageDialog.cancelLabel || 'キャンセル'}</Button>}
        <Button
          variant="contained"
          color={messageDialog?.severity==='error'?'error':'primary'}
          onClick={()=>closeMessageDialog(messageDialog?.mode==='confirm')}
        >
          {messageDialog?.confirmLabel || '閉じる'}
        </Button>
      </DialogActions>
    </Dialog>
  </ThemeProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
