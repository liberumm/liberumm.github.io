<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>

  <title>依頼管理 - React 19 + MUI 9</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600;700&display=swap"/>

  <style>

    }
    .dense-dialog .MuiTableCell-root {
      padding: 4px 8px;

    }
    .dense-dialog .MuiAlert-root {
      padding: 4px 10px;
    }
    .dense-dialog .MuiInputBase-root,
    .dense-dialog .MuiFormLabel-root {
      font-size: 0.85rem;
    }
    .work-entry-table .MuiTableCell-root { box-sizing: border-box; vertical-align: middle; }
    .work-entry-table .MuiTableBody-root .MuiTableCell-root,
    .report-entry-table .MuiTableBody-root .MuiTableCell-root {
      overflow: visible;
      padding-top: 10px;

    }

    }
    @media (max-width: 899.95px) {

      .dense-table .resizer { display: none; }

    @media (max-width: 599.95px) {
      .MuiDialog-root .MuiDialog-paper {
        width: calc(100% - 16px) !important;
        max-width: calc(100% - 16px) !important;
        margin: 8px !important;
      }
      .fc .fc-toolbar {
        align-items: stretch;
        flex-direction: column;
        gap: 8px;
      }
      .fc .fc-toolbar-chunk {
        display: flex;
        justify-content: center;
      }
      .fc .fc-toolbar-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script type="module">
import React from "https://esm.sh/react@19.2.0";
import { createRoot } from "https://esm.sh/react-dom@19.2.0/client";
import * as MaterialUI from "https://esm.sh/@mui/material@9.2.0?deps=react@19.2.0,react-dom@19.2.0";

// JSXコードを文字列として定義
const appCode = `
const { useState, useEffect, useRef, useMemo } = React;
const {
  AppBar, Toolbar, Typography: MuiTypography, CssBaseline, Container, Box: MuiBox, Stack: MuiStack, Button,
  ThemeProvider, createTheme, useMediaQuery, Paper, Chip, TextField: MuiTextField, Dialog: MuiDialog,
  DialogTitle, DialogContent, DialogActions, Grid, MenuItem, Select, FormControl, InputLabel,
  Snackbar, Alert, Table, TableBody, TableCell, TableContainer, TableHead, TableRow, Checkbox, Drawer,
  FormControlLabel, Divider, IconButton, Collapse, TableSortLabel, Tabs, Tab
} = MaterialUI;

// MUI v9で削除されたSystem propsだけをsxへ集約する。
const withSystemSx = (Component, systemPropNames) => {
  const systemProps = new Set(systemPropNames);
  return React.forwardRef(function MuiV9SystemAdapter(props, ref) {
    const nextProps = {...props, ref};
    const systemSx = {};
    let hasSystemProp = false;
    Object.keys(props).forEach(name => {
      if (systemProps.has(name)) {
        systemSx[name] = nextProps[name];
        delete nextProps[name];
        hasSystemProp = true;
      }
    });
    if (hasSystemProp) nextProps.sx = nextProps.sx ? [systemSx, nextProps.sx] : systemSx;
    return React.createElement(Component, nextProps);
  });
};

const Box = withSystemSx(MuiBox, ['m','mt','mr','mb','ml','mx','my','p','pt','pr','pb','pl','px','py','display','flex','flexGrow','flexShrink','width','height','minWidth','maxWidth','minHeight','maxHeight','position','top','right','bottom','left','zIndex','border','borderColor','borderRadius','bgcolor','gap','rowGap','columnGap']);
const Stack = withSystemSx(MuiStack, ['m','mt','mr','mb','ml','mx','my','p','pt','pr','pb','pl','px','py','display','alignItems','justifyContent','flexWrap','flexGrow','flexShrink','width','height','minWidth','maxWidth','minHeight','maxHeight','position','top','right','bottom','left','zIndex','border','borderColor','borderRadius','bgcolor','gap','rowGap','columnGap']);
const Typography = withSystemSx(MuiTypography, ['m','mt','mr','mb','ml','mx','my','p','pt','pr','pb','pl','px','py','display','fontFamily','fontSize','fontStyle','fontWeight','letterSpacing','lineHeight','textAlign','textTransform','whiteSpace','overflow','textOverflow','width','height','minWidth','maxWidth','minHeight','maxHeight','position','top','right','bottom','left','zIndex']);
const BaseTextField = MuiTextField;
const mergeSlotProp = (slotProp, overrides) => typeof slotProp === 'function'
  ? ownerState => ({...(slotProp(ownerState) || {}), ...overrides})
  : {...(slotProp || {}), ...overrides};

const FormTextField = React.forwardRef(function FormTextField({slotProps = {}, sx, ...props}, ref) {
  const normalizedSlotProps = slotProps || {};
  return (
    <BaseTextField
      {...props}
      ref={ref}
      variant="outlined"
      size="medium"
      sx={[
        ...(Array.isArray(sx) ? sx : sx ? [sx] : []),
        {
          '& .MuiInputBase-root': {minHeight:56, fontSize:'1rem'},
          '& .MuiInputLabel-root': {fontSize:'1rem'}
        }
      ]}
      slotProps={{
        ...normalizedSlotProps,
        inputLabel:mergeSlotProp(normalizedSlotProps.inputLabel, {shrink:true})
      }}
    />
  );
});

const Dialog = MuiDialog;

/* ===== データ定義 ===== */
// フローステータス（ワークフローの進行状態）
const FLOW_STATUSES = [
  { key: 'request', label: '依頼', route: '社内 → 取引先', color: 'info' },
  { key: 'proposal', label: '提案', route: '取引先 → 社内', color: 'warning' },
  { key: 'confirmed', label: '確定', route: '社内 → 取引先', color: 'primary' },
  { key: 'completed', label: '実施済', route: '取引先 → 社内', color: 'success' },
  { key: 'billing', label: '請求待', route: '社内 → 経理', color: 'secondary' },
  { key: 'paid', label: '支払済', route: '経理 → 経理システム', color: 'success' },
];
const FLOW_STATUS_BY_KEY = new Map(FLOW_STATUSES.map(status => [status.key, status]));
const FLOW_STATUS_INDEX_BY_KEY = new Map(FLOW_STATUSES.map((status, index) => [status.key, index]));
const IN_PROGRESS_FLOW_KEYS = new Set(['proposal','confirmed','completed']);
const COMPLETED_FLOW_KEYS = new Set(['completed','billing','paid']);

// データ状態（レコードの確定状態）
const DATA_STATES = {
  draft: { label: '下書', color: 'default', editable: true },
  submitted: { label: '送信済', color: 'info', editable: false },
  reviewing: { label: '確認中', color: 'warning', editable: false },
  approved: { label: '承認済', color: 'success', editable: false },
  rejected: { label: '差戻', color: 'error', editable: true },
  completed: { label: '完了', color: 'success', editable: false },
  cancelled: { label: '取消', color: 'default', editable: false },
};
const CONTEXTUAL_STATE_LABELS = {
  request: {submitted:'社内承認待ち', approved:'提案待ち', rejected:'依頼差戻し', cancelled:'取消済'},
  proposal: {reviewing:'取引先承認待ち', submitted:'確定承認待ち', rejected:'提案差戻し'},
  confirmed: {approved:'実施待ち', rejected:'実施報告差戻し'},
  completed: {submitted:'検収待ち'},
  billing: {reviewing:'経理処理待ち', approved:'支払連携待ち'},
  paid: {completed:'支払済'}
};

// 運用保守ロールは正規の状態遷移を守りながら、全業務を代理実行できる。
const SERVICE_OWNER_PERMISSIONS = [
  'create', 'submit_request', 'approve_request',
  'estimate', 'approve_partner_estimate', 'approve_estimate',
  'report_complete', 'accept_complete', 'invoice', 'payment',
  'reject', 'cancel', 'api_monitor', 'export', 'dashboard'
];

const ACTION_OWNER_LABELS = {
  create: '利用部 担当者',
  submit_request: '利用部 担当者',
  approve_request: '利用部 承認者',
  estimate: '取引先 担当者',
  estimate_submit: '取引先 担当者',
  approve_partner_estimate: '取引先 承認者',
  approve_estimate: '利用部 承認者',
  report_complete: '取引先 担当者',
  accept_complete: '利用部 承認者',
  invoice: '経理部 担当者',
  payment: '経理部 承認者',
  reject_request: '相手組織 承認者',
  reject: '各組織 承認者',
  cancel: '利用部 担当者'
};

const buildActionAudit = (account, action) => account?.key === 'service_owner_staff'
  ? {
      executionType: 'proxy',
      proxyFor: ACTION_OWNER_LABELS[action] || '業務担当組織',
      proxyReason: '運用保守による代理実行'
    }
  : { executionType: 'direct' };

// 要件定義用ユーザーアカウント
const USER_ACCOUNTS = [
  {
    key: 'internal_user_staff', name: '利用部 担当者', group: '社内', organization: '利用部', position: '担当者',
    color: 'primary', permissions: ['create', 'submit_request', 'cancel', 'reject_request', 'export']
  },
  {
    key: 'internal_user_approver', name: '利用部 承認者', group: '社内', organization: '利用部', position: '承認者',
    color: 'primary', permissions: ['approve_request', 'approve_estimate', 'accept_complete', 'reject', 'reject_request', 'export', 'dashboard']
  },
  {
    key: 'internal_accounting_staff', name: '経理部 担当者', group: '社内', organization: '経理部', position: '担当者',
    color: 'secondary', permissions: ['invoice', 'reject_request', 'export']
  },
  {
    key: 'internal_accounting_approver', name: '経理部 承認者', group: '社内', organization: '経理部', position: '承認者',
    color: 'secondary', permissions: ['payment', 'reject', 'reject_request', 'export', 'dashboard']
  },
  {
    key: 'partner_staff', name: '取引先 担当者', group: '取引先', organization: '取引先', position: '担当者',
    color: 'info', permissions: ['estimate', 'report_complete', 'reject', 'reject_request', 'export']
  },
  {
    key: 'partner_approver', name: '取引先 承認者', group: '取引先', organization: '取引先', position: '承認者',
    color: 'info', permissions: ['approve_partner_estimate', 'reject', 'reject_request', 'export', 'dashboard']
  },
  {
    key: 'service_owner_staff', name: 'サービスオーナー組織 担当者', group: '運用組織', organization: 'サービスオーナー組織', position: '担当者',
    color: 'success', permissions: [...SERVICE_OWNER_PERMISSIONS, 'reject_request']
  },
];
const USER_ACCOUNT_BY_KEY = new Map(USER_ACCOUNTS.map(account => [account.key, account]));

// フローとデータ状態の両方を検証する業務操作定義
const WORKFLOW_ACTIONS = [
  { key:'submit_request', permission:'submit_request', flow:'request', states:['draft','rejected'], label:'依頼を申請' },
  { key:'approve_request', permission:'approve_request', flow:'request', states:['submitted'], label:'依頼を承認' },
  { key:'estimate', permission:'estimate', flow:'request', states:['approved'], label:'回答登録' },
  { key:'estimate', permission:'estimate', flow:'proposal', states:['rejected'], label:'見積を修正' },
  { key:'approve_partner_estimate', permission:'approve_partner_estimate', flow:'proposal', states:['reviewing','rejected'], label:'見積を承認・提出' },
  { key:'approve_estimate', permission:'approve_estimate', flow:'proposal', states:['submitted'], label:'見積を承認・確定' },
  { key:'report_complete', permission:'report_complete', flow:'confirmed', states:['approved','rejected'], label:'作業完了を報告' },
  { key:'accept_complete', permission:'accept_complete', flow:'completed', states:['submitted'], label:'検収承認・経理へ送信' },
  { key:'invoice', permission:'invoice', flow:'billing', states:['reviewing'], label:'支払処理を起票' },
  { key:'payment', permission:'payment', flow:'billing', states:['approved'], label:'経理システム連携・支払完了' },
];

const BULK_SAFE_ACTIONS = [
  'submit_request', 'approve_request', 'approve_partner_estimate',
  'approve_estimate', 'accept_complete', 'invoice'
];

const getWorkflowTransition = action => {
  const transitions = {
    submit_request: { flowStatus:'request', dataState:'submitted', timestamp:'submittedAt' },
    approve_request: { flowStatus:'request', dataState:'approved' },
    approve_partner_estimate: { flowStatus:'proposal', dataState:'submitted' },
    approve_estimate: { flowStatus:'confirmed', dataState:'approved', timestamp:'confirmedAt' },
    report_complete: { flowStatus:'completed', dataState:'submitted', timestamp:'completedAt' },
    accept_complete: { flowStatus:'billing', dataState:'reviewing', timestamp:'billingAt' },
    invoice: { flowStatus:'billing', dataState:'approved' },
    payment: {
      flowStatus:'paid',
      dataState:'completed',
      timestamp:'paidAt',
      extra:{
        accountingSystemStatus:'linked',
        accountingSystemLinkedAt:new Date().toISOString()
      }
    }
  };
  return transitions[action] || null;
};

const buildTransitionedItem = (source, action, account) => {
  const transition = getWorkflowTransition(action);
  if (!source || !transition) return null;
  const now = new Date().toISOString();
  return {
    ...source,
    flowStatus:transition.flowStatus,
    dataState:transition.dataState,
    ...(transition.timestamp ? {[transition.timestamp]:now} : {}),
    ...(transition.extra || {}),
    rejectedAt:null,
    rejectedReason:'',
    rejectedBy:'',
    history:[...(source.history || []), {
      action,
      from:source.flowStatus,
      to:transition.flowStatus,
      by:account?.name || account?.key || 'unknown',
      at:now,
      ...buildActionAudit(account, action)
    }]
  };
};

const mockData = {
  partners: ['株式会社アルタ','テクノリンクス','ACME合同会社','北斗ソリューションズ'],
  stores: ['新宿本店','大阪中央','名古屋栄','札幌駅前'],
  departments: ['営業企画部','店舗支援部','情報システム部','DX推進室'],
  categories: ['棚替え','ラベル差替え','商品陳列','在庫整理','販促設置']
};

const utils = {
  randomId: () => Math.random().toString(36).slice(2,8),
  yen: v => v ? '¥' + Number(v).toLocaleString() : '—',
  fmtDate: iso => iso ? new Date(iso).toISOString().slice(0,10) : '—',
  getFlowIndex: key => FLOW_STATUS_INDEX_BY_KEY.get(key) ?? -1,
  dataStateInfo: (flowStatus, dataState) => {
    const state = DATA_STATES[dataState];
    const contextualLabel = CONTEXTUAL_STATE_LABELS[flowStatus]?.[dataState];
    if (contextualLabel && state) return {...state, label:contextualLabel};
    return state;
  },
  getAccount: accountKey => USER_ACCOUNT_BY_KEY.get(accountKey),
  hasPermission: (accountKey, permission) =>
    USER_ACCOUNT_BY_KEY.get(accountKey)?.permissions.includes(permission) || false,
  timeToMinutes: value => {
    if (!value || !/^\\d{1,2}:\\d{2}$/.test(value)) return null;
    const [hours, minutes] = value.split(':').map(Number);
    return hours * 60 + minutes;
  },
  workMinutes: work => {
    const start = utils.timeToMinutes(work?.startTime);
    const end = utils.timeToMinutes(work?.endTime);
    if (start === null || end === null || end <= start) return null;
    return Math.max(0, end - start - Math.max(0, Number(work?.breakMinutes) || 0));
  },
  isRequestReady: item => {
    const works = item?.workItems || [];
    return Boolean(
      item?.title?.trim() && item?.caseStartDate && item?.caseEndDate &&
      item.caseStartDate <= item.caseEndDate && works.length > 0 &&
      works.every(work => work.title?.trim() && work.date &&
        utils.workMinutes(work) > 0 && Number(work.hourlyRate) > 0 &&
        work.store && Number(work.heads) >= 1 &&
        work.date >= item.caseStartDate && work.date <= item.caseEndDate)
    );
  },
  estimateLineAmount: row => {
    const workMinutes = utils.workMinutes(row);
    if (workMinutes === null) return 0;
    const laborAmount = (workMinutes / 60) * (Number(row?.hourlyRate) || 0);
    return Math.round(laborAmount + (Number(row?.transport) || 0));
  },
  fmtClockMinutes: value => {
    if (value === null || value === undefined || !Number.isFinite(Number(value))) return '—';
    const minutes = Math.max(0, Math.round(Number(value)));
    return String(Math.floor(minutes / 60)).padStart(2, '0') + ':' + String(minutes % 60).padStart(2, '0');
  },
  availableActions: (item, accountKey) => {
    const account = USER_ACCOUNT_BY_KEY.get(accountKey);
    if (!item || !account) return [];
    return WORKFLOW_ACTIONS.filter(action =>
      account.permissions.includes(action.permission) &&
      action.flow === item.flowStatus &&
      action.states.includes(item.dataState)
    );
  },
  randPick: arr => arr[Math.floor(Math.random()*arr.length)],
  randInt: (min,max) => Math.floor(Math.random()*(max-min+1))+min,
  daysFromNow: d => new Date(Date.now()+86400000*d).toISOString().slice(0,10)
};

function makeInitialRequest(flowStatus = null, dataState = null) {
  const flow = flowStatus || utils.randPick(['request','proposal','confirmed']);
  const defaultStates = {
    request: utils.randPick(['draft','submitted','approved']),
    proposal: utils.randPick(['reviewing','submitted']),
    confirmed: 'approved',
    completed: utils.randPick(['submitted','approved']),
    billing: 'reviewing',
    paid: 'completed'
  };
  const state = dataState || defaultStates[flow] || 'draft';
  const workItems = Array.from({length:utils.randInt(2,4)}, (_, index) => ({
    id: 'W-' + utils.randomId().toUpperCase(),
    title: utils.randPick(mockData.categories),
    date: utils.daysFromNow(utils.randInt(1,14)),
    startTime: utils.randInt(9,12) + ':00',
    endTime: utils.randInt(16,20) + ':00',
    breakMinutes: utils.randPick([45,60]),
    hourlyRate: 1300,
    store: utils.randPick(mockData.stores),
    heads: utils.randInt(1,3),
    status: index === 0 && ['completed','billing','paid'].includes(flow) ? 'completed' : 'pending',
    memo: ''
  }));
  const heads = workItems.reduce((sum, work) => sum + work.heads, 0);
  const schedules = workItems.map(work => ({
    date:work.date, startTime:work.startTime, endTime:work.endTime,
    breakMinutes:work.breakMinutes, hourlyRate:work.hourlyRate
  }));
  const workDates = workItems.map(work => work.date).sort();
  const hasEstimate = ['proposal','confirmed','completed','billing','paid'].includes(flow);
  const mockSupporters = hasEstimate ? workItems.map((work, index) => {
    const supporter = {
      workId:work.id,
      workTitle:work.title,
      date:work.date,
      startTime:work.startTime,
      endTime:work.endTime,
      breakMinutes:work.breakMinutes,
      name:['山田太郎','佐藤花子','鈴木一郎'][index % 3],
      hourlyRate:work.hourlyRate,
      email:'',
      phone:'',
      transport:utils.randInt(500,1000)
    };
    const workMinutes = utils.workMinutes(supporter) || 0;
    const laborAmount = Math.round((workMinutes / 60) * supporter.hourlyRate);
    return {
      ...supporter,
      workMinutes,
      laborAmount,
      lineAmount:laborAmount + supporter.transport
    };
  }) : [];
  const mockEstimateAmount = mockSupporters.reduce((sum, supporter) => sum + supporter.lineAmount, 0);
  
  return {
    id: utils.randomId(),
    title: utils.randPick(mockData.stores) + ' ' + utils.randPick(mockData.categories),
    partner: utils.randPick(mockData.partners),
    partnerCode: 'P-' + utils.randInt(100,999),
    store: utils.randPick(mockData.stores),
    caseStartDate: workDates[0],
    caseEndDate: workDates[workDates.length - 1],
    schedules,
    workItems,
    heads,
    department: utils.randPick(mockData.departments),
    category: utils.randPick(mockData.categories),
    content: workItems.map(work => work.title).join('、'),
    memo: '',
    // フロー状態
    flowStatus: flow,
    // データ状態
    dataState: state,
    // 各種日時
    createdAt: new Date().toISOString(),
    createdBy: '商品部 田中',
    submittedAt: flow !== 'request' || ['submitted','approved'].includes(state) ? new Date().toISOString() : null,
    proposalAt: hasEstimate ? new Date().toISOString() : null,
    confirmedAt: ['confirmed','completed','billing','paid'].includes(flow) ? new Date().toISOString() : null,
    completedAt: ['completed','billing','paid'].includes(flow) ? new Date().toISOString() : null,
    billingAt: ['billing','paid'].includes(flow) ? new Date().toISOString() : null,
    paidAt: flow === 'paid' ? new Date().toISOString() : null,
    accountingSystemStatus: flow === 'paid' ? 'linked' : 'not_linked',
    accountingSystemLinkedAt: flow === 'paid' ? new Date().toISOString() : null,
    // 見積情報
    estimate: hasEstimate ? {
      amount: mockEstimateAmount,
      note: mockSupporters.length + '明細（休憩控除・交通費込み）',
      supporters: mockSupporters,

// APIレスポンスに旧形式や時刻未設定の作業が混在しても、表示・計算に必要な時刻を補完する
function normalizeRequestTimes(item) {
  if (!item || typeof item !== 'object') return item;
  const normalize = work => ({...work, startTime:work.startTime || '09:00', endTime:work.endTime || '18:00'});
  return {...item,
    workItems:Array.isArray(item.workItems) ? item.workItems.map(normalize) : item.workItems,
    schedules:Array.isArray(item.schedules) ? item.schedules.map(normalize) : item.schedules
  };
}

/* ===== Request API =====
 * 既定は単一HTMLで確認できるmockアダプター。
 * バックエンド接続時はHTML読込前に次を設定する。
 * window.REQUEST_API_CONFIG = { mode:'rest', baseUrl:'https://example.com/api' };
 * GET  /requests
 * POST /requests
 * POST /requests/{id}/actions/{action}
 * POST /requests/bulk-actions/{action}
 * 作業条件は request.workItems[].breakMinutes（0以上の整数、分単位）と
 * request.workItems[].hourlyRate（税抜、円単位）で送受信する。
 * 見積明細は estimate.supporters[].transport を入力値とし、
 * lineAmount = round((workMinutes / 60) * hourlyRate) + transport、
 * estimate.amount = sum(lineAmount) をAPI側でも再計算する。
 * 本番APIはユーザー権限と状態遷移を再検証し、更新後の依頼を返す。
 */
const REQUEST_API_CONFIG = {
  mode: 'mock',
  baseUrl: '/api',
  ...(window.REQUEST_API_CONFIG || {})
};
const WORK_TYPES = [
  {key:'inspection', label:'現地確認'}, {key:'repair', label:'修理'},
  {key:'parts_replacement', label:'部品交換'}, {key:'equipment_arrangement', label:'備品手配'},
  {key:'registration', label:'登録作業'}, {key:'delivery', label:'配送'},
  {key:'other', label:'その他'}
];
const WORK_TYPE_LABEL_BY_KEY = new Map(WORK_TYPES.map(type => [type.key, type.label]));
const workTypeLabel = key => WORK_TYPE_LABEL_BY_KEY.get(key) || 'その他';
const makeCaseNumber = () => '案件-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + utils.randomId().toUpperCase();

let mockRequestStore = [];

const requestApi = {
  async request(path, options = {}) {
    const response = await fetch(REQUEST_API_CONFIG.baseUrl + path, {
      ...options,
      headers: {'Content-Type':'application/json', ...(options.headers || {})}
    });
    if (!response.ok) {
      throw new Error('APIエラー: ' + response.status + ' ' + response.statusText);
    }
    return response.status === 204 ? null : response.json();
  },

  async list() {
    if (REQUEST_API_CONFIG.mode === 'mock') {
      return mockRequestStore.map(normalizeRequestTimes);
    }
    return this.request('/requests');
  },

  async create(payload) {
    if (REQUEST_API_CONFIG.mode === 'mock') {
      mockRequestStore = [payload, ...mockRequestStore];
      return {...payload};
    }
    return this.request('/requests', {method:'POST', body:JSON.stringify(payload)});
  },

  async seed(count = 5) {
    if (REQUEST_API_CONFIG.mode !== 'mock') {
      throw new Error('サンプル案件の生成はモックAPIでのみ利用できます');
    }
    const created = Array.from({length:count}, () => makeInitialRequest());
    mockRequestStore = [...created, ...mockRequestStore];
    return created.map(normalizeRequestTimes);
  },

  async update(id, payload, action) {
    if (REQUEST_API_CONFIG.mode === 'mock') {
      mockRequestStore = mockRequestStore.map(item => item.id === id ? payload : item);
      return {...payload};
    }
    return this.request('/requests/' + encodeURIComponent(id) + '/actions/' + encodeURIComponent(action), {
      method:'POST',
      body:JSON.stringify({request:payload})
    });
  },

  async bulkUpdate(payloads, action) {
    if (REQUEST_API_CONFIG.mode === 'mock') {
      const payloadMap = new Map(payloads.map(payload => [payload.id, payload]));
      mockRequestStore = mockRequestStore.map(item => payloadMap.get(item.id) || item);
      return payloads.map(payload => ({...payload}));
    }
    return this.request('/requests/bulk-actions/' + encodeURIComponent(action), {
      method:'POST',
      body:JSON.stringify({requests:payloads})
    });
  }
};

/* ===== CSV出力 ===== */
function exportCSV(items) {
  const headers = ['No','フロー状態','データ状態','作業数','案件開始日','案件終了日','実施日','開始時刻','終了時刻','休憩合計(分)','作業時給','必要人数','依頼部門','取引先コード','取引先名','対象拠点','依頼日','確定日','見積金額'];
  const rows = items.map((item, idx) => [
    idx + 1, FLOW_STATUS_BY_KEY.get(item.flowStatus)?.label || '',
    utils.dataStateInfo(item.flowStatus, item.dataState)?.label || '', item.workItems?.length || item.schedules?.length || 0,
    item.caseStartDate || '', item.caseEndDate || '',
    item.schedules?.map(s => s.date).join('、') || '', item.schedules?.[0]?.startTime || '',
    item.schedules?.[0]?.endTime || '',
    (item.workItems || item.schedules || []).reduce((sum, work) => sum + (Number(work.breakMinutes) || 0), 0),
    (item.workItems || item.schedules || []).map(work => Number(work.hourlyRate) || 0).join('、'),
    item.heads, item.department, item.partnerCode,
    item.partner, item.store, utils.fmtDate(item.createdAt), utils.fmtDate(item.confirmedAt),
    item.estimate ? item.estimate.amount : ''
  ]);
  
  const csv = [headers, ...rows].map(row => 
    row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')
  ).join('\\n');
  
  const blob = new Blob(['\\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const objectUrl = URL.createObjectURL(blob);
  link.href = objectUrl;
  link.download = '案件一覧_' + new Date().toISOString().slice(0,10) + '.csv';
  link.click();
  setTimeout(() => URL.revokeObjectURL(objectUrl), 0);
}

            <Box>
              <Typography variant="subtitle1" fontWeight="600" sx={{mb:1}}>作業者明細</Typography>
              <TableContainer className="responsive-table-scroll" sx={{border:'1px solid', borderColor:'divider', borderRadius:1, maxWidth:'100%', overflowX:'auto'}}>

                    <TableRow sx={{bgcolor:'grey.50'}}>
                      <TableCell sx={{fontWeight:600}}>実施日</TableCell>
                      <TableCell sx={{fontWeight:600}}>開始</TableCell>
                      <TableCell sx={{fontWeight:600}}>終了</TableCell>
                      <TableCell align="center" sx={{fontWeight:600}}>休憩</TableCell>
                      <TableCell align="center" sx={{fontWeight:600}}>実働</TableCell>
                      <TableCell sx={{fontWeight:600}}>氏名</TableCell>
                      <TableCell align="right" sx={{fontWeight:600}}>時給</TableCell>
                      <TableCell align="right" sx={{fontWeight:600}}>人件費</TableCell>

                      const transport = Number(s.transport) || 0;
                      const laborAmount = Number(s.laborAmount) || Math.round((workMinutes / 60) * hourlyRate);
                      const subtotal = Number(s.lineAmount) || laborAmount + transport;

                        <TableRow key={idx} hover>

                      <TableCell colSpan={9} align="right" sx={{fontWeight:600}}>見積金額（税抜）</TableCell>

          {/* 備考 */}
          {item.memo && (

      </DialogContent>
      
      <DialogActions sx={{px:3, py:2, borderTop:'1px solid', borderColor:'divider'}}>
        <Typography variant="caption" color="text.secondary">

        </Typography>
        {canCancel && <Button onClick={() => onAction(item.id, 'cancel')} color="error" size="medium">{isServiceOwner ? '代理: ' : ''}依頼を取消</Button>}
        {canRequestReject && <Button onClick={() => onAction(item.id, 'reject_request')} color="warning" variant="outlined" size="medium">{isServiceOwner ? '代理: ' : ''}差戻依頼</Button>}
        {canReject && <Button onClick={() => onAction(item.id, 'reject')} color="warning" size="medium">{isServiceOwner ? '代理: ' : ''}差し戻し</Button>}
        <Box flex={1}/>

            {isServiceOwner ? '代理: ' : ''}{action.label}
          </Button>
        ))}
      </DialogActions>
    </Dialog>
  );
}

/* ===== 新規案件ダイアログ ===== */
function CreateDialog({open, onClose, onCreate, onSaveDraft, actor}) {
  const emptyWork = () => ({
    id:'W-' + utils.randomId().toUpperCase(), title:'', date:'', startTime:'09:00',
    endTime:'18:00', workType:'other', breakMinutes:60, hourlyRate:1500,
    store:mockData.stores[0], partner:'', heads:1, status:'pending', memo:''
  });
  const [caseInfo, setCaseInfo] = useState({
    title:'', partnerCode:'P-'+utils.randInt(100,999), partner:mockData.partners[0],
    department:mockData.departments[0], caseStartDate:'', caseEndDate:'', memo:''
  });
  const [workItems, setWorkItems] = useState([emptyWork()]);
  const [errors, setErrors] = useState({});
  const caseSummary = useMemo(() => workItems.reduce((summary, work) => {
    const heads = Math.max(0, Number(work.heads) || 0);
    const workMinutes = utils.workMinutes(work) || 0;
    return {
      workCount:summary.workCount + 1,
      totalHeads:summary.totalHeads + heads,
      totalPersonMinutes:summary.totalPersonMinutes + (workMinutes * heads)
    };
  }, {
    workCount:0,
    totalHeads:0,
    totalPersonMinutes:0
  }), [workItems]);
  const caseWorkDays = useMemo(
    () => new Set(workItems.map(work => work.date).filter(Boolean)).size,
    [workItems]
  );

  const addWork = () => setWorkItems(prev => [...prev, emptyWork()]);
  const removeWork = (idx) => setWorkItems(prev => prev.filter((_,i) => i !== idx));
  const updateWork = (idx, patch) => {
    setWorkItems(prev => prev.map((work,i) => i===idx ? {...work,...patch} : work));
    if (errors[idx]) {
      setErrors(prev => {
        const newErrors = {...prev};
        delete newErrors[idx];
        return newErrors;
      });
    }
  };

  const validate = () => {
    const newErrors = {};
    if (!caseInfo.title.trim()) newErrors.caseTitle = ['案件名は必須です'];
    if (!caseInfo.caseStartDate || !caseInfo.caseEndDate) {
      newErrors.casePeriod = ['案件開始日と案件終了日は必須です'];
    } else if (caseInfo.caseStartDate > caseInfo.caseEndDate) {
      newErrors.casePeriod = ['案件終了日は案件開始日以降にしてください'];
    }
    workItems.forEach((work, idx) => {
      const rowErrors = [];
      if (!work.title.trim()) rowErrors.push('作業名は必須です');
      if (!work.date) rowErrors.push('実施日は必須です');
      if (!work.startTime) rowErrors.push('開始時刻は必須です');
      if (!work.endTime) rowErrors.push('終了時刻は必須です');
      if (work.startTime && work.endTime && work.startTime >= work.endTime) {
        rowErrors.push('終了時刻は開始時刻より後にしてください');
      }
      const breakMinutes = Number(work.breakMinutes);
      if (!Number.isFinite(breakMinutes) || breakMinutes < 0) {
        rowErrors.push('休憩時間は0分以上で入力してください');
      }
      const scheduledMinutes = work.startTime && work.endTime
        ? utils.timeToMinutes(work.endTime) - utils.timeToMinutes(work.startTime)
        : null;
      if (scheduledMinutes > 0 && breakMinutes >= scheduledMinutes) {
        rowErrors.push('休憩時間は作業時間より短くしてください');
      }
      if (!Number.isFinite(Number(work.hourlyRate)) || Number(work.hourlyRate) <= 0) {
        rowErrors.push('時給は1円以上で入力してください');
      }
      if (!work.store) rowErrors.push('対象拠点は必須です');
      if (!work.heads || work.heads < 1) rowErrors.push('人数は1名以上にしてください');
      if (work.date && caseInfo.caseStartDate && work.date < caseInfo.caseStartDate) {
        rowErrors.push('実施日は案件開始日以降にしてください');
      }
      if (work.date && caseInfo.caseEndDate && work.date > caseInfo.caseEndDate) {
        rowErrors.push('実施日は案件終了日以前にしてください');
      }
      if (rowErrors.length > 0) newErrors[idx] = rowErrors;
    });
    setErrors(newErrors);
    return Object.keys(newErrors).length === 0;
  };

  const canSave = caseInfo.title.trim() && caseInfo.caseStartDate && caseInfo.caseEndDate && workItems.length > 0;
  const canSaveDraft = Boolean(
    caseInfo.title.trim() || caseInfo.memo.trim() ||
    workItems.some(work => work.title.trim() || work.date || work.memo.trim() ||
      work.startTime !== '09:00' || work.endTime !== '18:00' ||
      Number(work.breakMinutes) !== 60 || Number(work.hourlyRate) !== 1500 ||
      Number(work.heads) !== 1)
  );

  const buildPayload = (isDraft = false) => {
    const now = new Date().toISOString();
    const firstWork = workItems[0];
    return {
      id: utils.randomId(),
      caseNumber: makeCaseNumber(),
      title: caseInfo.title.trim(),
      partner: caseInfo.partner,
      partnerCode: caseInfo.partnerCode,
      store: firstWork.store,
      caseStartDate: caseInfo.caseStartDate,
      caseEndDate: caseInfo.caseEndDate,
      schedules: workItems.map(work => ({
        date:work.date, startTime:work.startTime, endTime:work.endTime,
        breakMinutes:Number(work.breakMinutes) || 0, hourlyRate:Number(work.hourlyRate) || 0
      })),
      workItems: workItems.map(work => ({
        ...work,
        breakMinutes:Number(work.breakMinutes) || 0,
        hourlyRate:Number(work.hourlyRate) || 0
      })),
      heads: workItems.reduce((sum, work) => sum + (Number(work.heads) || 0), 0),
      department: caseInfo.department,
      category: 'general_request',
      content: workItems.map(work => work.title).join('、'),
      memo: caseInfo.memo,
      flowStatus: 'request',
      dataState: 'draft',
      createdAt: now,
      createdBy: actor?.name || '利用部 担当者',
      submittedAt: null,
      proposalAt: null,
      confirmedAt: null,
      completedAt: null,
      billingAt: null,
      paidAt: null,
      accountingSystemStatus: 'not_linked',
      accountingSystemLinkedAt: null,
      estimate: null,
      rejectedAt: null,
      rejectedReason: '',
      rejectedBy: '',
      rejectedFrom: '',
      history: [{
        action:isDraft ? 'draft_save' : 'create',
        by:actor?.name || '利用部 担当者',
        at:now,
        ...buildActionAudit(actor, 'create')
      }]
    };
  };

  const resetForm = () => {
    setCaseInfo({
      title:'', partnerCode:'P-'+utils.randInt(100,999), partner:mockData.partners[0],
      department:mockData.departments[0], caseStartDate:'', caseEndDate:'', memo:''
    });
    setWorkItems([emptyWork()]);
    setErrors({});
  };

  const save = async () => {
    if (!validate()) return;
    await onCreate(buildPayload(false));
    resetForm();
  };

  const saveDraft = async () => {
    if (!canSaveDraft || !onSaveDraft) return;
    await onSaveDraft(buildPayload(true));
    resetForm();
  };

  return (
    <Dialog open={open} onClose={onClose} fullWidth maxWidth="xl" slotProps={{paper:{className:'dense-dialog', sx:{borderRadius:1, height:'92vh'}}}}>
      <DialogTitle sx={{borderBottom:'1px solid', borderColor:'divider', py:1.5, px:3}}>
        <Stack direction="row" justifyContent="space-between" alignItems="center">
          <Box sx={{flex:1,minWidth:0}}>
            <Typography variant="h6" fontWeight="600">新規案件作成</Typography>
            <Typography variant="caption" color="text.secondary">1つの案件に複数の作業を登録できます</Typography>
          </Box>
          <Stack direction="row" spacing={{xs:0.5,sm:2}} sx={{flexShrink:0}}>
            <Button size="medium" onClick={addWork} variant="outlined" startIcon={<span className="material-icons">add</span>} sx={{px:{xs:1,sm:2}}}>作業追加</Button>
            <IconButton onClick={onClose} size="small"><span className="material-icons">close</span></IconButton>
          </Stack>
        </Stack>
      </DialogTitle>
      
      <DialogContent sx={{p:3, display:'flex', flexDirection:'column', height:'100%'}}>
        {/* 案件情報 */}
        <Paper variant="outlined" sx={{p:2, mb:2}}>
          <Typography variant="subtitle2" fontWeight="700" sx={{mb:1.5}}>案件情報</Typography>
          <Grid container spacing={2} sx={{'& > .MuiGrid-root:nth-child(2)':{display:'none'}, '& > .MuiGrid-root:nth-child(1)':{order:1}, '& > .MuiGrid-root:nth-child(5)':{order:2}, '& > .MuiGrid-root:nth-child(6)':{order:3}, '& > .MuiGrid-root:nth-child(4)':{order:4}, '& > .MuiGrid-root:nth-child(3)':{order:5}, '& > .MuiGrid-root:nth-child(7)':{order:6}}}>
            <Grid size={{xs:12, md:4}}>
              <FormTextField required label="案件名" value={caseInfo.title} onChange={e=>setCaseInfo(prev=>({...prev,title:e.target.value}))}
                error={!!errors.caseTitle} helperText={errors.caseTitle?.[0]} fullWidth/>
            </Grid>
            <Grid size={{xs:12, md:2}}>
              <FormTextField label="取引先コード" value={caseInfo.partnerCode} onChange={e=>setCaseInfo(prev=>({...prev,partnerCode:e.target.value}))} fullWidth/>
            </Grid>
            <Grid size={{xs:12, md:3}}>
              <FormControl fullWidth size="small">
                <InputLabel id="create-partner-label">取引先*</InputLabel>
                <Select
                  labelId="create-partner-label"
                  label="取引先*"
                  value={caseInfo.partner}
                  onChange={e=>setCaseInfo(prev=>({...prev,partner:e.target.value}))}
                >
                  {mockData.partners.map(partner => <MenuItem key={partner} value={partner}>{partner}</MenuItem>)}
                </Select>
              </FormControl>
            </Grid>
            <Grid size={{xs:12, md:3}}>
              <FormControl fullWidth size="small">
                <InputLabel id="create-department-label">依頼部門*</InputLabel>
                <Select
                  labelId="create-department-label"
                  label="依頼部門*"
                  value={caseInfo.department}
                  onChange={e=>setCaseInfo(prev=>({...prev,department:e.target.value}))}
                >
                  {mockData.departments.map(dept => <MenuItem key={dept} value={dept}>{dept}</MenuItem>)}
                </Select>
              </FormControl>
            </Grid>
            <Grid size={{xs:12, md:3}}>
              <FormTextField
                required label="案件開始日" type="date" value={caseInfo.caseStartDate}
                onChange={e=>setCaseInfo(prev=>({...prev,caseStartDate:e.target.value}))}
                error={!!errors.casePeriod} fullWidth
              />
            </Grid>
            <Grid size={{xs:12, md:3}}>
              <FormTextField
                required label="案件終了日" type="date" value={caseInfo.caseEndDate}
                onChange={e=>setCaseInfo(prev=>({...prev,caseEndDate:e.target.value}))}
                error={!!errors.casePeriod} helperText={errors.casePeriod?.[0]}
                fullWidth
              />
            </Grid>
            <Grid size={{xs:12, md:6}}>
              <FormTextField label="案件備考" value={caseInfo.memo} onChange={e=>setCaseInfo(prev=>({...prev,memo:e.target.value}))} fullWidth/>
            </Grid>
          </Grid>
          <Box sx={{
            mt:1.5, pt:1.25, borderTop:'1px solid', borderColor:'divider',
            display:'grid', gridTemplateColumns:{xs:'repeat(2, 1fr)', md:'repeat(4, 1fr)'},
            gap:1
          }}>
            {[
              ['作業数', caseSummary.workCount + '件'],
              ['延べ必要人数', caseSummary.totalHeads + '名'],
              ['延べ実働', utils.fmtClockMinutes(caseSummary.totalPersonMinutes)],
              ['稼働日数', caseWorkDays + '日']
            ].map(([label, value]) => (
              <Box key={label} sx={{px:1.25, py:0.75, bgcolor:'grey.50', borderRadius:1}}>
                <Typography variant="caption" color="text.secondary">{label}</Typography>
                <Typography variant="subtitle2" fontWeight="700">{value}</Typography>
              </Box>
            ))}
          </Box>
        </Paper>

        {/* 作業一覧 */}
        <Box sx={{flex:1, overflow:'hidden'}}>
          <Typography variant="subtitle2" fontWeight="700" sx={{mb:1}}>作業一覧（{workItems.length}件）</Typography>
          <TableContainer sx={{height:'100%', overflowX:'auto', overflowY:'auto', border:'1px solid', borderColor:'divider', borderRadius:1}}>
            <Table size="medium" stickyHeader className="dense-table work-entry-table" sx={{minWidth:1900}}>
              <TableHead>
                <TableRow>
                  <TableCell padding="none" sx={{bgcolor:'grey.100', width:50, textAlign:'center', minWidth:50}}>#</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:140}}>作業種別*</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:150}}>取引先</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:180}}>作業名*</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:150}}>実施日*</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:100}}>開始*</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:100}}>終了*</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:90}}>休憩(分)*</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:90}}>実働</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:100}}>時給*</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:120}}>対象拠点*</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:80}}>必要人数*</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', minWidth:150}}>備考</TableCell>
                  <TableCell sx={{bgcolor:'grey.100', width:60}}></TableCell>
                </TableRow>
              </TableHead>
              <TableBody>
                {workItems.map((work, idx) => (
                  <TableRow key={idx} hover sx={{bgcolor: errors[idx] ? 'error.light' : 'inherit'}}>
                    <TableCell padding="none" sx={{textAlign:'center'}}>
                      {idx+1}
                      {errors[idx] && <span style={{color:'#d32f2f'}}> !</span>}
                    </TableCell>
                    <TableCell>
                      <Select value={work.workType || 'other'} onChange={e=>updateWork(idx, {workType:e.target.value})} size="small" fullWidth>
                        {WORK_TYPES.map(type => <MenuItem key={type.key} value={type.key}>{type.label}</MenuItem>)}
                      </Select>
                    </TableCell>
                    <TableCell>
                      <Select value={work.partner || ''} onChange={e=>updateWork(idx, {partner:e.target.value})} size="small" fullWidth displayEmpty>
                        <MenuItem value="">案件と同じ（{caseInfo.partner}）</MenuItem>
                        {mockData.partners.map(partner => <MenuItem key={partner} value={partner}>{partner}</MenuItem>)}
                      </Select>
                    </TableCell>
                    <TableCell>
                      <FormTextField required label="作業名" fullWidth placeholder="作業内容" sx={{minWidth:160}}
                        value={work.title} onChange={e=>updateWork(idx, {title:e.target.value})}
                        error={errors[idx]?.some(e => e.includes('作業名'))}/>
                    </TableCell>
                    <TableCell>
                      <FormTextField required label="実施日" type="date" fullWidth sx={{minWidth:150}}
                        value={work.date} onChange={e=>updateWork(idx, {date:e.target.value})}
                        error={errors[idx]?.some(e => e.includes('実施日'))}/>
                    </TableCell>
                    <TableCell>
                      <FormTextField required label="開始" type="time" fullWidth sx={{minWidth:110}}
                        value={work.startTime} onChange={e=>updateWork(idx, {startTime:e.target.value})}
                        error={errors[idx]?.some(e => e.includes('開始'))}/>
                    </TableCell>
                    <TableCell>
                      <FormTextField required label="終了" type="time" fullWidth sx={{minWidth:110}}
                        value={work.endTime} onChange={e=>updateWork(idx, {endTime:e.target.value})}
                        error={errors[idx]?.some(e => e.includes('終了'))}/>
                    </TableCell>
                    <TableCell>
                      <FormTextField required label="休憩(分)" type="number" fullWidth sx={{minWidth:110}}
                        slotProps={{htmlInput:{min:0, step:15, style:{textAlign:'center'}}}}
                        value={work.breakMinutes}
                        onChange={e=>updateWork(idx, {breakMinutes:Math.max(0, Number(e.target.value) || 0)})}
                        error={errors[idx]?.some(e => e.includes('休憩'))}/>
                    </TableCell>
                    <TableCell sx={{whiteSpace:'nowrap', textAlign:'center', fontWeight:600}}>
                      {utils.fmtClockMinutes(utils.workMinutes(work))}
                    </TableCell>
                    <TableCell>
                      <FormTextField required label="時給" type="number" fullWidth sx={{minWidth:110}}
                        slotProps={{
                          htmlInput:{min:1, step:10, style:{textAlign:'right'}},
                          input:{startAdornment:<Typography sx={{mr:0.5, fontSize:'0.75rem'}}>¥</Typography>}
                        }}
                        value={work.hourlyRate}
                        onChange={e=>updateWork(idx, {hourlyRate:Math.max(0, Number(e.target.value) || 0)})}
                        error={errors[idx]?.some(e => e.includes('時給'))}
                      />
                    </TableCell>
                    <TableCell>
                      <Select value={work.store} onChange={e=>updateWork(idx, {store:e.target.value})}
                        size="small" fullWidth error={errors[idx]?.some(e => e.includes('対象拠点'))}>
                        {mockData.stores.map(s => <MenuItem key={s} value={s}>{s}</MenuItem>)}
                      </Select>
                    </TableCell>
                    <TableCell>
                      <FormTextField required label="必要人数" type="number" fullWidth sx={{minWidth:110}} slotProps={{htmlInput:{min:1, style:{textAlign:'center'}}}}
                        value={work.heads} onChange={e=>updateWork(idx, {heads:Math.max(1, Number(e.target.value))})}
                        error={errors[idx]?.some(e => e.includes('人数'))}/>
                    </TableCell>
                    <TableCell>
                      <FormTextField label="備考" fullWidth placeholder="備考" sx={{minWidth:150}}
                        value={work.memo} onChange={e=>updateWork(idx, {memo:e.target.value})}/>
                    </TableCell>
                    <TableCell padding="none" sx={{textAlign:'center'}}>
                      {workItems.length > 1 && (
                        <IconButton color="error" onClick={() => removeWork(idx)} size="small">
                          <span className="material-icons" style={{fontSize:16}}>delete</span>
                        </IconButton>
                      )}
                    </TableCell>
                  </TableRow>
                ))}
              </TableBody>
            </Table>
          </TableContainer>
        </Box>
        
        {/* エラー表示 */}
        {Object.keys(errors).length > 0 && (
          <Alert severity="error" sx={{mt:2}}>
            {Object.entries(errors).map(([key, errs]) => (
              <Typography key={key} variant="caption" display="block">
                {key === 'caseTitle' || key === 'casePeriod' ? '案件情報' : '作業' + (parseInt(key)+1)}: {errs.join(', ')}
              </Typography>
            ))}
          </Alert>
        )}
      </DialogContent>
      
      <DialogActions sx={{px:3,py:2,borderTop:'1px solid',borderColor:'divider',display:'grid',gridTemplateColumns:{xs:'repeat(3,minmax(0,1fr))',sm:'minmax(0,1fr) auto auto auto'},gap:{xs:0.75,sm:1},'& .MuiButton-root':{m:'0 !important',minWidth:0,px:{xs:0.75,sm:2}}}}>
        <Typography variant="body1" color="text.secondary" sx={{gridColumn:{xs:'1 / -1',sm:'auto'},minWidth:0}}>1案件・{workItems.length}作業を作成</Typography>
        <Button onClick={onClose} size="medium">キャンセル</Button>
        <Button onClick={saveDraft} variant="outlined" size="medium" disabled={!canSaveDraft}>下書き保存</Button>
        <Button onClick={save} variant="contained" size="medium" disabled={!canSave}>案件を作成</Button>
      </DialogActions>
    </Dialog>
  );
}

/* ===== 見積もりダイアログ ===== */
function EstimateDialog({open, onClose, item, onSubmit, onAction, canDirectReject}) {
  const [note, setNote] = useState('');
  const [agree, setAgree] = useState(false);
  const [supporters, setSupporters] = useState([]);
  const [errors, setErrors] = useState({});
  const estimateWorks = useMemo(() => {
    if (item?.workItems?.length) return item.workItems;
    return (item?.schedules || []).map((schedule, index) => ({
      ...schedule,
      id:'W-' + (index + 1),
      title:item?.content || '作業',
      heads:1
    }));
  }, [item]);

  useEffect(() => {
    if (!item) return;
    if (item.estimate?.supporters?.length) {
      setSupporters(item.estimate.supporters.map((row, index) => {
        const sourceWork = estimateWorks.find(work =>
          work.id === row.workId ||
          (work.date === row.date && work.startTime === row.startTime && work.endTime === row.endTime)
        ) || estimateWorks[index] || estimateWorks[0] || {};
        return {
          ...row,
          workId:row.workId || sourceWork.id || 'W-' + (index + 1),
          workTitle:row.workTitle || sourceWork.title || item.content || '作業',
          breakMinutes:Number(row.breakMinutes ?? sourceWork.breakMinutes) || 0,
          hourlyRate:Number(sourceWork.hourlyRate ?? row.hourlyRate) || 0,
          transport:Number(row.transport) || 0
        };
      }));
    } else {
      const rows = [];
      estimateWorks.forEach((work, workIndex) => {
        const rowCount = Math.max(1, Number(work.heads) || 1);
        for (let i = 0; i < rowCount; i++) {
          rows.push({
            workId:work.id || 'W-' + (workIndex + 1),
            workTitle:work.title || item.content || '作業',
            date:work.date,
            startTime:work.startTime,
            endTime:work.endTime,
            breakMinutes:Number(work.breakMinutes) || 0,
            name:'',
            hourlyRate:Number(work.hourlyRate) || 0,
            transport:0,
            email:'',
            phone:''
          });
        }
      });
      setSupporters(rows);
    }
    setNote(item.estimate?.note || '');
    setAgree(false);
    setErrors({});
  }, [item, estimateWorks]);

  const amount = useMemo(
    () => supporters.reduce((sum, supporter) => sum + utils.estimateLineAmount(supporter), 0),
    [supporters]
  );
  const estimateSummary = useMemo(() => ({
    workCount:item?.workItems?.length || new Set(supporters.map(row => row.workId).filter(Boolean)).size,
    totalHeads:supporters.length,
    totalPersonMinutes:supporters.reduce((sum, row) => sum + (utils.workMinutes(row) || 0), 0),
    workDays:new Set(supporters.map(row => row.date).filter(Boolean)).size
  }), [item, supporters]);

  const addRow = () => {
    const work = estimateWorks[0] || {};
    setSupporters(prev => [...prev, {
      workId:work.id || 'W-1',
      workTitle:work.title || item?.content || '作業',
      date:work.date || '',
      startTime:work.startTime || '09:00',
      endTime:work.endTime || '18:00',
      breakMinutes:Number(work.breakMinutes) || 0,
      name:'',
      hourlyRate:Number(work.hourlyRate) || 0,
      transport:0
    }]);
  };
  const removeRow = (idx) => setSupporters(prev => prev.filter((_,i)=>i!==idx));
  const updateRow = (idx, patch) => {
    setSupporters(prev => prev.map((r,i)=> i===idx ? {...r, ...patch} : r));
    // エラーをクリア
    if (errors['supporter_' + idx]) {
      setErrors(prev => {
        const newErrors = {...prev};
        delete newErrors['supporter_' + idx];
        delete newErrors.amount;
        return newErrors;
      });
    }
  };
  const selectWork = (idx, workId) => {
    const work = estimateWorks.find(candidate => candidate.id === workId);
    if (!work) return;
    updateRow(idx, {
      workId:work.id,
      workTitle:work.title || item?.content || '作業',
      date:work.date,
      startTime:work.startTime,
      endTime:work.endTime,
      breakMinutes:Number(work.breakMinutes) || 0,
      hourlyRate:Number(work.hourlyRate) || 0
    });
  };

  const validateForm = () => {
    const newErrors = {};

    supporters.forEach((s, idx) => {
      const supporterErrors = [];
      if (!s.date) supporterErrors.push('日付は必須です');
      if (!s.startTime) supporterErrors.push('開始時刻は必須です');
      if (!s.endTime) supporterErrors.push('終了時刻は必須です');
      if (s.startTime && s.endTime && s.startTime >= s.endTime) {
        supporterErrors.push('終了時刻は開始時刻より後にしてください');
      }
      if (utils.workMinutes(s) === 0) supporterErrors.push('休憩控除後の実働時間が必要です');
      if (!s.name.trim()) supporterErrors.push('氏名は必須です');
      if (!Number.isFinite(Number(s.hourlyRate)) || Number(s.hourlyRate) <= 0) {
        supporterErrors.push('依頼作成時の時給が設定されていません');
      }
      if (!Number.isFinite(Number(s.transport)) || Number(s.transport) < 0) {
        supporterErrors.push('交通費は0円以上で入力してください');
      }
      
      if (supporterErrors.length > 0) {
        newErrors['supporter_' + idx] = supporterErrors;
      }
    });
    
    if (!agree) {
      newErrors.agree = '取引先応援に伴う同意事項の確認が必要です';
    }
    if (amount <= 0) newErrors.amount = '明細の時給・実働時間・交通費を確認してください';
    
    setErrors(newErrors);
    return Object.keys(newErrors).length === 0;
  };

  const ok = amount > 0 && supporters.length > 0 && supporters.every(s =>
    s.date && s.startTime && s.endTime && s.name.trim() &&
    utils.workMinutes(s) > 0 && Number(s.hourlyRate) > 0 && Number(s.transport) >= 0
  ) && agree;

  const submit = () => {
    if (!validateForm()) return;
    const calculatedSupporters = supporters.map(supporter => {
      const workMinutes = utils.workMinutes(supporter) || 0;
      const laborAmount = Math.round((workMinutes / 60) * (Number(supporter.hourlyRate) || 0));
      const transport = Number(supporter.transport) || 0;
      return {
        ...supporter,
        breakMinutes:Number(supporter.breakMinutes) || 0,
        hourlyRate:Number(supporter.hourlyRate) || 0,
        transport,
        workMinutes,
        laborAmount,
        lineAmount:laborAmount + transport
      };
    });
    onSubmit({amount, note, supporters:calculatedSupporters});
  };

  return (
    <Dialog open={open} onClose={onClose} fullWidth maxWidth="xl" slotProps={{paper:{className:'dense-dialog', sx:{borderRadius:1, height:'90vh'}}}}>
      <DialogTitle sx={{borderBottom:'1px solid', borderColor:'divider', py:2, px:3}}>
        <Stack direction="row" justifyContent="space-between" alignItems="center">
          <Typography variant="h6" fontWeight="600">見積もり登録 - {item?.title}</Typography>
          <IconButton onClick={onClose} size="small"><span className="material-icons">close</span></IconButton>
        </Stack>
      </DialogTitle>
      
      <DialogContent sx={{p:3, overflow:'auto'}}>
        {/* 取引先応援に伴う同意事項 */}
        <Alert severity="warning" sx={{mb:3}}>
          <Typography variant="body1" fontWeight="600">取引先応援に伴う同意事項</Typography>
          <Typography variant="body2">作業内容・日程・必要人数・時給・交通費などの条件を確認し、記載内容に基づいて応援作業を実施することに同意してください。</Typography>
        </Alert>

        {/* 作業時間サマリー */}
        <Box sx={{
          mb:2, p:1.25, border:'1px solid', borderColor:'divider', borderRadius:1,
          display:'grid', gridTemplateColumns:{xs:'repeat(2, 1fr)', md:'repeat(4, 1fr)'}, gap:1
        }}>
          {[
            ['作業数', estimateSummary.workCount + '件'],
            ['必要人数', estimateSummary.totalHeads + '名'],
            ['延べ実働', utils.fmtClockMinutes(estimateSummary.totalPersonMinutes)],
            ['稼働日数', estimateSummary.workDays + '日']
          ].map(([label, value]) => (
            <Box key={label} sx={{px:1, py:0.5, bgcolor:'grey.50', borderRadius:1}}>
              <Typography variant="caption" color="text.secondary">{label}</Typography>
              <Typography variant="subtitle2" fontWeight="700">{value}</Typography>
            </Box>
          ))}
        </Box>

        {/* 見積情報 */}
        <Stack spacing={1.5} sx={{mb:2}}>
          <Typography variant="h6" fontWeight="600">見積情報</Typography>
          <Box sx={{display:'flex', gap:2, overflow:'visible'}}>
            <FormTextField 
              label="見積金額（税抜）" 
              value={utils.yen(amount)}
              error={!!errors.amount}
              helperText={errors.amount || '各行の「実働×時給＋交通費」の合計'}
              slotProps={{input:{readOnly:true}}}
              sx={{width:230}}
            />
            <FormTextField 
              label="備考" 
              value={note} 
              onChange={e=>setNote(e.target.value)} 
              fullWidth
              placeholder="例：2名×4時間、交通費込み"
            />
          </Box>
        </Stack>
        
        {/* 作業者リスト */}
        <Box sx={{mb:3}}>
          <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{mb:2}}>
            <Typography variant="h6" fontWeight="600">作業者リスト</Typography>
            <Button onClick={addRow} size="medium" variant="outlined" startIcon={<span className="material-icons" style={{fontSize:18}}>add</span>}>
              作業者追加
            </Button>
          </Stack>
          
          {supporters.length === 0 ? (
            <Typography variant="body1" color="text.secondary" sx={{p:4, textAlign:'center', bgcolor:'grey.50', borderRadius:1}}>
              作業者を追加してください
            </Typography>
          ) : (
            <TableContainer sx={{border:'1px solid', borderColor:'divider', borderRadius:1, maxHeight:430, overflowX:'auto'}}>
              <Table size="small" className="dense-table estimate-supporters-table" sx={{minWidth:1600}}>
                <TableHead>
                  <TableRow sx={{bgcolor:'grey.50'}}>
                    <TableCell sx={{minWidth:120}}>作業</TableCell>
                    <TableCell sx={{minWidth:130}}>実施日</TableCell>
                    <TableCell sx={{minWidth:95}}>開始</TableCell>
                    <TableCell sx={{minWidth:95}}>終了</TableCell>
                    <TableCell sx={{minWidth:75}}>休憩</TableCell>
                    <TableCell sx={{minWidth:75}}>実働</TableCell>
                    <TableCell sx={{minWidth:130}}>氏名</TableCell>
                    <TableCell sx={{minWidth:180}}>メール</TableCell>
                    <TableCell sx={{minWidth:130}}>電話</TableCell>
                    <TableCell align="right" sx={{minWidth:85}}>時給</TableCell>
                    <TableCell sx={{minWidth:105}}>交通費</TableCell>
                    <TableCell align="right" sx={{minWidth:95}}>行小計</TableCell>
                    <TableCell sx={{width:48}}></TableCell>
                  </TableRow>
                </TableHead>
                <TableBody>
                  {supporters.map((s, idx) => (
                    <TableRow key={idx} sx={{bgcolor: errors['supporter_' + idx] ? 'error.light' : 'inherit'}}>
                      <TableCell>
                        <Select
                          size="small"
                          fullWidth
                          value={s.workId || ''}
                          onChange={e=>selectWork(idx, e.target.value)}
                        >
                          {estimateWorks.map((work, workIndex) => (
                            <MenuItem key={work.id || workIndex} value={work.id || 'W-' + (workIndex + 1)}>
                              {work.title || item?.content || '作業'}
                            </MenuItem>
                          ))}
                        </Select>
                      </TableCell>
                      <TableCell>
                        <FormTextField required label="実施日" type="date" fullWidth sx={{minWidth:150}}
                          value={s.date} onChange={e=>updateRow(idx,{date:e.target.value})}
                          error={errors['supporter_' + idx]?.some(e => e.includes('日付'))}/>
                      </TableCell>
                      <TableCell>
                        <FormTextField required label="開始" type="time" fullWidth sx={{minWidth:110}}
                          value={s.startTime} onChange={e=>updateRow(idx,{startTime:e.target.value})}
                          error={errors['supporter_' + idx]?.some(e => e.includes('開始'))}/>
                      </TableCell>
                      <TableCell>
                        <FormTextField required label="終了" type="time" fullWidth sx={{minWidth:110}}
                          value={s.endTime} onChange={e=>updateRow(idx,{endTime:e.target.value})}
                          error={errors['supporter_' + idx]?.some(e => e.includes('終了'))}/>
                      </TableCell>
                      <TableCell sx={{textAlign:'center', whiteSpace:'nowrap'}}>
                        {utils.fmtClockMinutes(Number(s.breakMinutes) || 0)}
                      </TableCell>
                      <TableCell sx={{textAlign:'center', whiteSpace:'nowrap', fontWeight:600}}>
                        {utils.fmtClockMinutes(utils.workMinutes(s))}
                      </TableCell>
                      <TableCell>
                        <FormTextField required label="氏名" fullWidth placeholder="山田太郎" sx={{minWidth:140}}
                          value={s.name} onChange={e=>updateRow(idx,{name:e.target.value})}
                          error={errors['supporter_' + idx]?.some(e => e.includes('氏名'))}/>
                      </TableCell>
                      <TableCell>
                        <FormTextField label="メール" fullWidth type="email" placeholder="メール（任意）" sx={{minWidth:190}}
                          value={s.email || ''} onChange={e=>updateRow(idx,{email:e.target.value})}/>
                      </TableCell>
                      <TableCell>
                        <FormTextField label="電話" fullWidth placeholder="電話（任意）" sx={{minWidth:140}}
                          value={s.phone || ''} onChange={e=>updateRow(idx,{phone:e.target.value})}/>
                      </TableCell>
                      <TableCell align="right" sx={{fontWeight:600, whiteSpace:'nowrap'}}>
                        {utils.yen(Number(s.hourlyRate) || 0)}
                      </TableCell>
                      <TableCell>
                        <FormTextField label="交通費" type="number" fullWidth placeholder="0" sx={{minWidth:120}}
                          value={s.transport} onChange={e=>updateRow(idx,{transport:e.target.value.replace(/[^\\d]/g,'')})}
                          slotProps={{
                            htmlInput:{min:0, step:10, style:{textAlign:'right'}},
                            input:{startAdornment:<Typography sx={{mr:0.5, fontSize:'0.75rem'}}>¥</Typography>}
                          }}/>
                      </TableCell>
                      <TableCell align="right" sx={{fontWeight:700, whiteSpace:'nowrap'}}>
                        {utils.yen(utils.estimateLineAmount(s))}
                      </TableCell>
                      <TableCell>
                        <IconButton size="small" color="error" onClick={()=>removeRow(idx)}>
                          <span className="material-icons" style={{fontSize:16}}>delete</span>
                        </IconButton>
                      </TableCell>
                    </TableRow>
                  ))}
                </TableBody>
                <TableHead>
                  <TableRow sx={{bgcolor:'primary.light'}}>
                    <TableCell colSpan={11} align="right" sx={{fontWeight:700}}>見積金額（税抜）</TableCell>
                    <TableCell align="right" sx={{fontWeight:800, whiteSpace:'nowrap'}}>{utils.yen(amount)}</TableCell>
                    <TableCell/>
                  </TableRow>
                </TableHead>
              </Table>
            </TableContainer>
          )}
        </Box>

        {/* 同意チェック */}
        <Box sx={{mt:4, p:3, bgcolor:'grey.50', borderRadius:1}}>
          <FormControlLabel
            control={<Checkbox checked={agree} onChange={e=>setAgree(e.target.checked)} size="medium"/>}
            label={<Typography variant="body1">取引先応援に伴う同意事項を確認し、同意のうえ回答を登録します</Typography>}
          />
          {errors.agree && <Typography variant="body2" color="error" sx={{mt:1}}>{errors.agree}</Typography>}
        </Box>
      </DialogContent>
      
      <DialogActions sx={{px:3, py:2, borderTop:'1px solid', borderColor:'divider'}}>
        <Button onClick={onClose} size="medium">キャンセル</Button>
        {item && <Button color="warning" variant="outlined" size="medium" onClick={()=>onAction(item.id, (canDirectReject || item.rejectionRequest) ? 'reject' : 'reject_request')}>
          {(canDirectReject || item.rejectionRequest) ? '差し戻し' : '差戻依頼'}
        </Button>}
        <Button variant="contained" disabled={!ok} onClick={submit} size="medium">見積もり提出</Button>
      </DialogActions>
    </Dialog>
  );
}

/* ===== 実施報告ダイアログ ===== */
function ReportDialogV2({open, onClose, item, onSubmit}) {
  const [rows, setRows] = useState([]), [reason, setReason] = useState(''), [errors, setErrors] = useState({});
  useEffect(() => {
    if (!item) return;
    const works = item.workItems?.length ? item.workItems : (item.schedules || []).map((s,i)=>({id:'W-'+(i+1), title:item.content || '作業', ...s, heads:item.heads}));
    const supporters = item.estimate?.supporters || [], next=[];
    works.forEach(work => { const people=supporters.filter(p=>!p.workId || p.workId===work.id), count=people.length || Math.max(1,Number(work.heads)||1); for(let i=0;i<count;i++){const p=people[i]||{}; const validTime=value=>/^\d{1,2}:\d{2}$/.test(String(value||'')) ? value : ''; next.push({workId:work.id,workTitle:work.title||'作業',plannedDate:work.date||'',plannedStartTime:validTime(work.startTime)||'09:00',plannedEndTime:validTime(work.endTime)||'18:00',plannedBreakMinutes:Number(work.breakMinutes)||0,plannedTransport:Number(p.transport)||0,date:p.date||work.date||'',startTime:validTime(p.startTime)||validTime(work.startTime)||'09:00',endTime:validTime(p.endTime)||validTime(work.endTime)||'18:00',breakMinutes:Number(p.breakMinutes ?? work.breakMinutes)||0,name:p.name||'',hourlyRate:Number(p.hourlyRate||work.hourlyRate)||0,transport:Number(p.transport)||0,memo:''});}});
    setRows(next); setReason(''); setErrors({});
  }, [item]);
  const updateRow=(index,patch)=>{setRows(prev=>prev.map((r,i)=>i===index?{...r,...patch}:r));setErrors(prev=>{const n={...prev};delete n[index];delete n.reason;return n;});};
  const addPerson=()=>{const base=rows[rows.length-1];if(base)setRows(prev=>[...prev,{...base,name:'',transport:0,memo:''}]);};
  const {changed,totalActualMinutes,workCount}=useMemo(()=>{
    let changed=false,totalActualMinutes=0;
    const workIds=new Set();
    rows.forEach(r=>{
      changed ||= r.date!==r.plannedDate||r.startTime!==r.plannedStartTime||r.endTime!==r.plannedEndTime||Number(r.breakMinutes)!==Number(r.plannedBreakMinutes)||Number(r.transport)!==Number(r.plannedTransport||0);
      totalActualMinutes += utils.workMinutes(r)||0;
      workIds.add(r.workId);
    });
    return {changed,totalActualMinutes,workCount:workIds.size};
  },[rows]);
  const validate=()=>{const n={};rows.forEach((r,i)=>{const m=[],workMinutes=utils.workMinutes(r);if(!r.name.trim())m.push('作業者名を入力してください');if(!r.date)m.push('実績日を入力してください');if(workMinutes===null||workMinutes<=0)m.push('実績時間を正しく入力してください');if(Number(r.transport)<0)m.push('交通費は0以上で入力してください');if(m.length)n[i]=m;});if(changed&&!reason.trim())n.reason=['予定から変更した理由を入力してください'];setErrors(n);return !Object.keys(n).length;};
  const submit=mode=>{if(!validate())return;onSubmit({mode,changed,reason:reason.trim(),totalActualMinutes,plannedWorkItems:item?.workItems||item?.schedules||[],actualWorkItems:rows.map(r=>({workId:r.workId,title:r.workTitle,date:r.date,startTime:r.startTime,endTime:r.endTime,breakMinutes:Number(r.breakMinutes)||0,workMinutes:utils.workMinutes(r),name:r.name.trim(),hourlyRate:Number(r.hourlyRate)||0,transport:Number(r.transport)||0,heads:1,memo:r.memo}))});};
  return <Dialog open={open} onClose={onClose} fullWidth maxWidth="xl" slotProps={{paper:{className:'dense-dialog',sx:{borderRadius:1,height:'88vh'}}}}><DialogTitle sx={{borderBottom:'1px solid',borderColor:'divider',py:1.5,px:3}}><Stack direction="row" justifyContent="space-between" alignItems="center"><Box><Typography variant="h6" fontWeight="600">作業完了報告 - {item?.title}</Typography><Typography variant="caption" color="text.secondary">作業者ごとの実績時間・交通費を確認、訂正して報告します</Typography></Box><IconButton onClick={onClose} size="small"><span className="material-icons">close</span></IconButton></Stack></DialogTitle><DialogContent sx={{p:2,overflow:'auto'}}><Box sx={{mb:1.5,p:1.25,border:'1px solid',borderColor:'divider',borderRadius:1,display:'grid',gridTemplateColumns:{xs:'repeat(2,1fr)',md:'repeat(3,1fr)'},gap:1}}><Box><Typography variant="caption" color="text.secondary">作業数</Typography><Typography variant="subtitle2" fontWeight="700">{workCount}件</Typography></Box><Box><Typography variant="caption" color="text.secondary">実施人数</Typography><Typography variant="subtitle2" fontWeight="700">{rows.length}名</Typography></Box><Box><Typography variant="caption" color="text.secondary">実績延べ実働</Typography><Typography variant="subtitle2" fontWeight="700">{utils.fmtClockMinutes(totalActualMinutes)}</Typography></Box></Box><TableContainer sx={{border:'1px solid',borderColor:'divider',borderRadius:1,overflowX:'auto'}}><Table size="small" className="dense-table report-entry-table" sx={{minWidth:1400}}><TableHead><TableRow sx={{bgcolor:'grey.50'}}><TableCell>作業（予定）</TableCell><TableCell>作業者名*</TableCell><TableCell>実績日</TableCell><TableCell>開始</TableCell><TableCell>終了</TableCell><TableCell>休憩(分)</TableCell><TableCell>実働</TableCell><TableCell>交通費</TableCell><TableCell>メモ</TableCell></TableRow></TableHead><TableBody>{rows.map((r,i)=><TableRow key={r.workId+'-'+i} sx={{bgcolor:errors[i]?'error.light':'inherit'}}><TableCell><Typography variant="caption" fontWeight="600">{r.workTitle}</Typography><Typography variant="caption" display="block" color="text.secondary">予定 {r.plannedDate||'—'} {r.plannedStartTime}–{r.plannedEndTime} / 休憩 {r.plannedBreakMinutes}分</Typography></TableCell><TableCell><FormTextField required label="作業者名" value={r.name} sx={{minWidth:150}} onChange={e=>updateRow(i,{name:e.target.value})} placeholder="氏名"/></TableCell><TableCell><FormTextField required label="実績日" type="date" value={r.date} sx={{minWidth:150}} onChange={e=>updateRow(i,{date:e.target.value})}/></TableCell><TableCell><FormTextField required label="開始" type="time" value={r.startTime} sx={{minWidth:110}} onChange={e=>updateRow(i,{startTime:e.target.value})}/></TableCell><TableCell><FormTextField required label="終了" type="time" value={r.endTime} sx={{minWidth:110}} onChange={e=>updateRow(i,{endTime:e.target.value})}/></TableCell><TableCell><FormTextField label="休憩(分)" type="number" value={r.breakMinutes} sx={{minWidth:110}} onChange={e=>updateRow(i,{breakMinutes:Math.max(0,Number(e.target.value)||0)})} slotProps={{htmlInput:{min:0,step:15}}}/></TableCell><TableCell sx={{whiteSpace:'nowrap',fontWeight:600}}>{utils.fmtClockMinutes(utils.workMinutes(r))}</TableCell><TableCell><FormTextField label="交通費" type="number" value={r.transport} sx={{minWidth:120}} onChange={e=>updateRow(i,{transport:Math.max(0,Number(e.target.value)||0)})} slotProps={{htmlInput:{min:0,step:1}}}/></TableCell><TableCell><FormTextField label="メモ" value={r.memo} sx={{minWidth:180}} onChange={e=>updateRow(i,{memo:e.target.value})} placeholder="実績メモ"/></TableCell></TableRow>)}</TableBody></Table></TableContainer><Button size="small" sx={{mt:1}} onClick={addPerson} startIcon={<span className="material-icons">person_add</span>}>作業者を追加</Button>{changed&&<FormTextField required fullWidth label="変更理由" value={reason} onChange={e=>setReason(e.target.value)} error={!!errors.reason} helperText={errors.reason?.[0]||'予定から変更した理由を入力してください'} sx={{mt:1.5}}/>}</DialogContent><DialogActions sx={{px:2,py:1,borderTop:'1px solid',borderColor:'divider'}}><Button onClick={onClose} size="small">キャンセル</Button><Box flex={1}/><Button variant="outlined" size="small" onClick={()=>submit('as_planned')} disabled={!rows.length||changed}>予定どおり報告</Button><Button variant="contained" size="small" onClick={()=>submit('adjusted')} disabled={!rows.length}>実績を修正して報告</Button></DialogActions></Dialog>;
}

/* ===== 差し戻しダイアログ ===== */
function RejectDialog({open, onClose, item, onSubmit}) {
  const [reason, setReason] = useState('');
  const [selectedReason, setSelectedReason] = useState('');
  const [targetFlow, setTargetFlow] = useState('');
  const currentFlowIndex = item ? utils.getFlowIndex(item.flowStatus) : -1;
  const targetOptions = currentFlowIndex > 0 ? FLOW_STATUSES.slice(0, currentFlowIndex) : [];
  useEffect(() => {
    setTargetFlow(targetOptions[targetOptions.length - 1]?.key || item?.flowStatus || '');
  }, [item]);
  
  const commonReasons = [
    '情報が不足しています',
    '日程の調整が必要です',
    '人数の見直しが必要です',
    '作業内容の詳細確認が必要です',
    '見積金額の再検討が必要です',
    'その他'
  ];

  const handleReasonChange = (value) => {
    setSelectedReason(value);
    if (value !== 'その他') {
      setReason(value);
    } else {
      setReason('');
    }
  };

  const submit = () => {
    onSubmit(reason || selectedReason, targetFlow);
    setReason('');
    setSelectedReason('');
  };

  return (
    <Dialog open={open} onClose={onClose} maxWidth="sm" fullWidth slotProps={{paper:{className:'dense-dialog', sx:{borderRadius:1}}}}>
      <DialogTitle sx={{borderBottom:'1px solid', borderColor:'divider', py:2, px:3}}>
        <Stack direction="row" justifyContent="space-between" alignItems="center">
          <Typography variant="h6" fontWeight="600">差し戻し理由</Typography>
          <IconButton onClick={onClose} size="small"><span className="material-icons">close</span></IconButton>
        </Stack>
      </DialogTitle>
      
      <DialogContent sx={{p:3}}>
        <Alert severity="info" sx={{mb:3}}>
          <Typography variant="body2">差し戻し理由は相手方に通知され、案件は前のステップに戻ります。</Typography>
        </Alert>
        <Stack spacing={1.5}>
          <FormControl fullWidth size="medium">
            <InputLabel>戻し先工程</InputLabel>
            <Select value={targetFlow} label="戻し先工程" onChange={e=>setTargetFlow(e.target.value)}>
              {targetOptions.length ? targetOptions.map(status => <MenuItem key={status.key} value={status.key}>{status.label}</MenuItem>) : <MenuItem value={item?.flowStatus || ''}>{FLOW_STATUS_BY_KEY.get(item?.flowStatus)?.label || '現在の工程'}</MenuItem>}
            </Select>
          </FormControl>
          <FormControl fullWidth size="medium">
            <Select value={selectedReason} onChange={e=>handleReasonChange(e.target.value)} displayEmpty>
              <MenuItem value="" disabled>理由を選択</MenuItem>
              {commonReasons.map(r => <MenuItem key={r} value={r}>{r}</MenuItem>)}
            </Select>
          </FormControl>
          
          {selectedReason === 'その他' && (
            <FormTextField
              required
              label="詳細理由"
              value={reason}
              onChange={e=>setReason(e.target.value)}
              fullWidth
              multiline
              rows={4}
            />
          )}
        </Stack>
      </DialogContent>
      
      <DialogActions sx={{px:3, py:2, borderTop:'1px solid', borderColor:'divider'}}>
        <Button onClick={onClose} size="medium">キャンセル</Button>
        <Button onClick={submit} variant="contained" color="warning" size="medium" disabled={!reason && !selectedReason}>
          差し戻し
        </Button>
      </DialogActions>
    </Dialog>
  );
}
/* ===== ダッシュボード ===== */
const Dashboard = React.memo(function Dashboard({items}) {
  
  // 統計データの計算
  const stats = useMemo(() => {
    const now = new Date();
    const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    
    const thisMonthItems = items.filter(i => new Date(i.createdAt) >= thisMonth);
    const lastMonthItems = items.filter(i => new Date(i.createdAt) >= lastMonth && new Date(i.createdAt) < thisMonth);
    
    // フロー別集計
    const flowStats = FLOW_STATUSES.map(status => ({
      ...status,
      count: items.filter(i => i.flowStatus === status.key).length,
      thisMonth: thisMonthItems.filter(i => i.flowStatus === status.key).length,
      amount: items.filter(i => i.flowStatus === status.key && i.estimate?.amount).reduce((sum, i) => sum + i.estimate.amount, 0)
    }));
    
    // データ状態別集計
    const stateStats = Object.entries(DATA_STATES).map(([key, state]) => ({
      key,
      ...state,
      count: items.filter(i => i.dataState === key).length
    }));
    
    // 取引先別集計（金額含む）
    const partnerData = items.reduce((acc, item) => {
      if (!acc[item.partner]) acc[item.partner] = { count: 0, amount: 0, completed: 0 };
      acc[item.partner].count++;
      if (item.estimate?.amount) acc[item.partner].amount += item.estimate.amount;
      if (item.flowStatus === 'paid') acc[item.partner].completed++;
      return acc;
    }, {});
    const topPartners = Object.entries(partnerData)
      .sort(([,a], [,b]) => b.count - a.count)
      .slice(0, 5)
      .map(([partner, data]) => ({partner, ...data}));
    
    // 対象拠点別集計（金額含む）
    const storeData = items.reduce((acc, item) => {
      if (!acc[item.store]) acc[item.store] = { count: 0, amount: 0 };
      acc[item.store].count++;
      if (item.estimate?.amount) acc[item.store].amount += item.estimate.amount;
      return acc;
    }, {});
    const topStores = Object.entries(storeData)
      .sort(([,a], [,b]) => b.count - a.count)
      .slice(0, 5)
      .map(([store, data]) => ({store, ...data}));
    
    // 依頼部門別集計
    const deptData = items.reduce((acc, item) => {
      if (!acc[item.department]) acc[item.department] = { count: 0, amount: 0 };
      acc[item.department].count++;
      if (item.estimate?.amount) acc[item.department].amount += item.estimate.amount;
      return acc;
    }, {});
    const topDepts = Object.entries(deptData)
      .sort(([,a], [,b]) => b.count - a.count)
      .map(([dept, data]) => ({dept, ...data}));
    
    // 見積金額統計
    const estimatedItems = items.filter(i => i.estimate?.amount);
    const totalAmount = estimatedItems.reduce((sum, i) => sum + i.estimate.amount, 0);
    const avgAmount = estimatedItems.length > 0 ? totalAmount / estimatedItems.length : 0;
    const maxAmount = estimatedItems.length > 0 ? Math.max(...estimatedItems.map(i => i.estimate.amount)) : 0;
    const minAmount = estimatedItems.length > 0 ? Math.min(...estimatedItems.map(i => i.estimate.amount)) : 0;
    
    // 完了率・差し戻し率
    const completedCount = items.filter(i => i.flowStatus === 'paid').length;
    const completionRate = items.length > 0 ? (completedCount / items.length * 100) : 0;
    const rejectedCount = items.filter(i => i.dataState === 'rejected').length;
    const rejectionRate = items.length > 0 ? (rejectedCount / items.length * 100) : 0;
    
    // 平均処理日数
    const completedItems = items.filter(i => i.flowStatus === 'paid' && i.createdAt && i.paidAt);
    const avgProcessDays = completedItems.length > 0 
      ? completedItems.reduce((sum, i) => sum + (new Date(i.paidAt) - new Date(i.createdAt)) / (1000 * 60 * 60 * 24), 0) / completedItems.length 
      : 0;
    
    // 月別推移（12ヶ月）
    const monthlyTrend = [];
    for (let i = 11; i >= 0; i--) {
      const month = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const nextMonth = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
      const monthItems = items.filter(item => {
        const date = new Date(item.createdAt);
        return date >= month && date < nextMonth;
      });
      monthlyTrend.push({
        month: month.toLocaleDateString('ja-JP', {month:'short'}),
        count: monthItems.length,
        amount: monthItems.filter(item => item.estimate?.amount).reduce((sum, item) => sum + item.estimate.amount, 0)
      });
    }
    
    // 曜日別集計
    const weekdayData = [0,1,2,3,4,5,6].map(day => ({
      day: ['日','月','火','水','木','金','土'][day],
      count: items.filter(i => new Date(i.schedules?.[0]?.date).getDay() === day).length
    }));
    
    return {
      total: items.length,
      thisMonth: thisMonthItems.length,
      lastMonth: lastMonthItems.length,
      monthGrowth: lastMonthItems.length > 0 ? ((thisMonthItems.length - lastMonthItems.length) / lastMonthItems.length * 100) : 0,
      flowStats,
      stateStats,
      topPartners,
      topStores,
      topDepts,
      totalAmount,
      avgAmount,
      maxAmount,
      minAmount,
      completedCount,
      completionRate,
      rejectedCount,
      rejectionRate,
      avgProcessDays,
      monthlyTrend,
      weekdayData
    };
  }, [items]);
  
  const maxMonthlyCount = Math.max(...stats.monthlyTrend.map(m => m.count), 1);
  const maxMonthlyAmount = Math.max(...stats.monthlyTrend.map(m => m.amount), 1);
  const maxFlowCount = Math.max(...stats.flowStats.map(f => f.count), 1);
  const maxWeekdayCount = Math.max(...stats.weekdayData.map(w => w.count), 1);
  
  return (
    <Box>
      {/* KPIサマリーカード */}
